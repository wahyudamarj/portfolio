<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcf8f0">
  <title>How We Use AI Shapes What Happens Next</title>
  <style>
:root {
  --cream: #fcf8f0;
  --paper: #fffdf8;
  --navy: #10222c;
  --navy-2: #1a3847;
  --teal: #008080;
  --teal-soft: #cce9e4;
  --apricot: #f49e58;
  --apricot-soft: #fee2c8;
  --coral: #e86849;
  --coral-soft: #f7d3c9;
  --sage: #93a8ac;
  --periwinkle: #7a79d8;
  --lavender: #deddf9;
  --lime: #b9df3d;
  --line: rgba(16, 34, 44, .14);
  --shadow: 0 18px 55px rgba(16, 34, 44, .14);
  --shadow-soft: 0 8px 24px rgba(16, 34, 44, .10);
  --font-scale: 1;
  --top-h: 66px;
  --bottom-h: 78px;
  --safe-x: clamp(24px, 4vw, 64px);
  --ease: cubic-bezier(.22, 1, .36, 1);
  --display: ui-rounded, system-ui, sans-serif;
  --body: system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { background: var(--cream); color: var(--navy); font-family: var(--body); }
button, input, textarea { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 4px solid rgba(0, 128, 128, .28); outline-offset: 3px;
}

.app { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: var(--cream); }
.atmosphere { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.orb { position: absolute; width: 30vw; height: 30vw; border-radius: 50%; filter: blur(4px); opacity: .22; }
.orb-a { left: -15vw; top: -18vw; background: radial-gradient(circle, var(--apricot), transparent 68%); }
.orb-b { right: -13vw; bottom: -20vw; background: radial-gradient(circle, var(--periwinkle), transparent 68%); }
.grain { position: absolute; inset: 0; opacity: .035; background-image: radial-gradient(var(--navy) .65px, transparent .65px); background-size: 6px 6px; }

.topbar, .bottombar { position: fixed; left: 0; right: 0; z-index: 30; display: flex; align-items: center; padding-inline: var(--safe-x); }
.topbar { top: 0; height: var(--top-h); justify-content: space-between; border-bottom: 1px solid rgba(16,34,44,.08); background: rgba(252,248,240,.88); backdrop-filter: blur(18px); }
.bottombar { bottom: 0; height: var(--bottom-h); justify-content: space-between; border-top: 1px solid rgba(16,34,44,.08); background: rgba(252,248,240,.92); backdrop-filter: blur(18px); }
.lesson-id { font-weight: 800; font-size: calc(13px * var(--font-scale)); letter-spacing: .03em; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-button, .text-button, .dialog-close { border: 1px solid var(--line); background: rgba(255,255,255,.7); border-radius: 13px; min-height: 40px; padding: 0 13px; cursor: pointer; font-weight: 800; }
.icon-button:hover, .text-button:hover { background: white; transform: translateY(-1px); }
.brand-lockup { width: 240px; display: flex; align-items: center; }
.brand-board { display: inline-flex; align-items: center; justify-content: center; width: 118px; height: 35px; padding: 7px 12px; border-radius: 12px; background: white; box-shadow: var(--shadow-soft); }
.brand-board img { width: 100%; height: 100%; object-fit: contain; }
.copyright { width: 240px; text-align: right; font-size: calc(11px * var(--font-scale)); color: rgba(16,34,44,.65); }
.nav-cluster { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; }
.nav-button { min-width: 112px; height: 48px; border: 0; border-radius: 16px; padding: 0 20px; cursor: pointer; font-weight: 900; font-size: calc(15px * var(--font-scale)); transition: .25s var(--ease); }
.nav-back { background: white; border: 1px solid var(--line); }
.nav-next { background: var(--navy); color: white; box-shadow: 0 10px 24px rgba(16,34,44,.24); }
.nav-button:hover:not(:disabled) { transform: translateY(-2px); }
.nav-button:disabled { opacity: .36; cursor: not-allowed; box-shadow: none; }
.progress-button { width: 108px; height: 48px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.82); padding: 7px 12px; cursor: pointer; font-weight: 900; }
.progress-track { display: block; height: 5px; margin-top: 5px; border-radius: 99px; background: rgba(16,34,44,.10); overflow: hidden; }
.progress-fill { display: block; height: 100%; width: 5%; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--lime)); transition: width .45s var(--ease); }

.scene-root { position: absolute; z-index: 2; inset: var(--top-h) 0 var(--bottom-h); overflow: hidden; }
.scene { position: absolute; inset: 0; display: grid; place-items: center; padding: clamp(18px, 3vh, 32px) var(--safe-x); animation: scene-in .65s var(--ease) both; }
.scene-inner { width: min(1180px, 100%); height: 100%; max-height: 650px; display: flex; flex-direction: column; justify-content: center; position: relative; }
.scene-inner.top-aligned { justify-content: flex-start; padding-top: clamp(8px, 1.7vh, 18px); }
@keyframes scene-in { from { opacity: 0; transform: translateY(16px) scale(.992); } to { opacity: 1; transform: none; } }

h1, h2, h3, p { margin-top: 0; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.035em; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--teal); font-weight: 900; font-size: calc(clamp(11px, 1.2vw, 14px) * var(--font-scale)); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; }
.eyebrow::before { content: ""; width: 24px; height: 3px; border-radius: 9px; background: currentColor; }
.scene-title { font-size: calc(clamp(34px, 4.3vw, 62px) * var(--font-scale)); line-height: .98; margin-bottom: clamp(10px, 2vh, 20px); max-width: 940px; }
.scene-subtitle { font-size: calc(clamp(18px, 2vw, 25px) * var(--font-scale)); line-height: 1.35; max-width: 760px; color: rgba(16,34,44,.78); }
.teacher-line { display: inline-flex; align-items: center; gap: 10px; font-size: calc(clamp(15px, 1.65vw, 20px) * var(--font-scale)); color: rgba(16,34,44,.76); }
.teacher-line::before { content: "💬"; }
.split { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); gap: clamp(24px, 4vw, 64px); align-items: center; min-height: 0; }
.media-frame { min-height: 0; border-radius: 30px; overflow: hidden; background: rgba(255,255,255,.62); box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.72); }
.media-frame img { width: 100%; height: 100%; display: block; object-fit: contain; }
.image-stage { min-height: 0; height: min(55vh, 470px); display: flex; align-items: center; justify-content: center; position: relative; }
.image-stage img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 18px 20px rgba(16,34,44,.12)); }
.insight-strip { display: flex; align-items: center; gap: 12px; padding: 13px 17px; border-left: 5px solid var(--teal); background: rgba(255,255,255,.72); border-radius: 4px 16px 16px 4px; box-shadow: var(--shadow-soft); font-weight: 850; font-size: calc(clamp(16px, 1.5vw, 20px) * var(--font-scale)); }

.primary-button, .secondary-button, .danger-button, .choice-button, .chip-button {
  border: 0; border-radius: 16px; min-height: 46px; padding: 0 20px; cursor: pointer; font-weight: 900; transition: .25s var(--ease);
}
.primary-button { background: var(--teal); color: white; box-shadow: 0 10px 24px rgba(0,128,128,.22); }
.secondary-button { background: white; border: 1px solid var(--line); }
.danger-button { background: var(--coral); color: white; }
.primary-button:hover, .secondary-button:hover, .choice-button:hover { transform: translateY(-2px); }
.hint { font-size: calc(clamp(13px, 1.25vw, 16px) * var(--font-scale)); color: rgba(16,34,44,.62); }

/* Cover */
.app[data-scene="cover"] .topbar, .app[data-scene="cover"] .bottombar { display: none; }
.app[data-scene="cover"] .scene-root { inset: 0; }
.cover-scene { padding: 0; cursor: pointer; }
.cover-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover-scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(252,248,240,.97) 0%, rgba(252,248,240,.82) 46%, rgba(252,248,240,.12) 100%); }
.cover-copy { position: relative; z-index: 2; width: min(1180px, calc(100% - 10vw)); }
.cover-kicker { font-weight: 900; letter-spacing: .08em; text-transform: uppercase; font-size: calc(clamp(14px, 1.6vw, 20px) * var(--font-scale)); margin-bottom: 28px; }
.cover-title { font-size: calc(clamp(50px, 7.4vw, 104px) * var(--font-scale)); line-height: .88; max-width: 850px; margin: 0; }
.cover-title span { color: var(--coral); }
.start-cue { position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%); z-index: 3; color: rgba(16,34,44,.70); font-weight: 800; font-size: calc(clamp(14px, 1.4vw, 18px) * var(--font-scale)); animation: cue-pulse 2.4s ease-in-out infinite; }
@keyframes cue-pulse { 50% { opacity: .52; transform: translate(-50%, -5px); } }

/* Login and objectives */
.login-board { width: min(650px, 100%); margin-inline: auto; padding: clamp(24px, 5vh, 44px); border-radius: 34px; background: rgba(255,255,255,.84); box-shadow: var(--shadow); text-align: center; position: relative; overflow: hidden; }
.login-board::after { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: var(--apricot-soft); right: -70px; top: -90px; }
.login-board .scene-title { margin-inline: auto; }
.name-field { width: min(500px, 100%); height: 66px; border: 2px solid rgba(16,34,44,.16); border-radius: 18px; background: white; padding: 0 20px; font-size: calc(clamp(19px, 2vw, 25px) * var(--font-scale)); text-align: center; color: var(--navy); }
.login-actions { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 16px; }
.form-note { min-height: 24px; margin-top: 10px; color: var(--coral); font-weight: 750; }
.objectives-layout { display: grid; grid-template-columns: 1fr 1.6fr; gap: 44px; align-items: center; }
.objective-stack { display: grid; gap: 12px; }
.objective-row { display: grid; grid-template-columns: 52px 120px 1fr; gap: 16px; align-items: center; min-height: 92px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.objective-row:last-child { border-bottom: 0; }
.objective-icon { font-size: calc(clamp(30px, 3vw, 42px) * var(--font-scale)); }
.objective-verb { font-family: var(--display); font-size: calc(clamp(18px, 2vw, 25px) * var(--font-scale)); font-weight: 950; color: var(--teal); }
.objective-copy { font-size: calc(clamp(16px, 1.65vw, 20px) * var(--font-scale)); line-height: 1.35; }

/* Video */
.video-layout { display: grid; grid-template-columns: minmax(260px, .55fr) minmax(0, 1.45fr); gap: 34px; align-items: center; }
.video-player { background: var(--navy); border-radius: 28px; padding: 10px; box-shadow: 0 24px 60px rgba(16,34,44,.28); }
.video-screen { position: relative; aspect-ratio: 16 / 9; background: #0b171d; border-radius: 20px 20px 10px 10px; overflow: hidden; }
.video-screen video { width: 100%; height: 100%; display: block; object-fit: contain; background: #0b171d; }
.video-top { display: flex; justify-content: space-between; align-items: center; padding: 0 8px 8px; color: rgba(255,255,255,.78); font-size: 12px; }
.window-dots { display: flex; gap: 6px; }.window-dots i { display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }.window-dots i:nth-child(2){background:var(--apricot)}.window-dots i:nth-child(3){background:var(--teal)}
.video-controls { display: grid; grid-template-columns: auto auto auto auto 1fr auto auto; align-items: center; gap: 8px; padding: 10px 8px 4px; color: white; }
.media-button { height: 38px; min-width: 38px; border: 0; border-radius: 11px; background: rgba(255,255,255,.12); color: white; cursor: pointer; }
.video-seek { accent-color: var(--apricot); width: 100%; }
.video-time { font-variant-numeric: tabular-nums; font-size: 12px; min-width: 82px; text-align: center; }

/* Think */
.think-stage { display: grid; grid-template-columns: .7fr 1.3fr; align-items: center; gap: 44px; }
.think-art { height: min(56vh, 470px); position: relative; }
.think-art img { position: absolute; max-width: 86%; max-height: 88%; object-fit: contain; filter: drop-shadow(0 18px 28px rgba(16,34,44,.15)); }
.think-art .cluster { right: -3%; top: 0; opacity: .36; transform: scale(.92); }
.think-art .student { left: 2%; bottom: 0; z-index: 2; }
.talk-timer { display: inline-grid; grid-template-columns: auto auto; gap: 12px; align-items: center; margin-top: 18px; }
.timer-face { min-width: 96px; padding: 11px 14px; border-radius: 14px; background: var(--navy); color: white; font-weight: 900; font-variant-numeric: tabular-nums; text-align: center; }

/* Stable reveal gallery */
.gallery-instruction { margin: -4px 0 13px; color: rgba(16,34,44,.68); font-size: calc(clamp(14px, 1.35vw, 17px) * var(--font-scale)); }
.help-gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; min-height: 0; }
.help-card { position: relative; display: grid; grid-template-rows: 1fr auto; height: min(43vh, 350px); min-height: 270px; padding: 0; overflow: hidden; border: 1px solid rgba(16,34,44,.11); border-radius: 26px; background: white; box-shadow: var(--shadow-soft); cursor: pointer; text-align: left; isolation: isolate; }
.help-card::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 18%, rgba(222,221,249,.62), transparent 54%), linear-gradient(160deg,#fffdf8,#f1f5f5); }
.help-card-visual { min-height: 0; padding: 10px 12px 0; display: grid; place-items: center; transition: transform .65s var(--ease), opacity .45s ease; }
.help-card-visual img { width: 100%; height: 100%; max-height: 250px; object-fit: contain; display: block; }
.help-card-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 64px; padding: 10px 14px; background: rgba(255,253,248,.94); border-top: 1px solid var(--line); }
.help-card-label strong { font-family: var(--display); font-size: calc(clamp(15px, 1.5vw, 20px) * var(--font-scale)); }
.help-open-icon { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border-radius: 50%; background: var(--teal-soft); color: var(--teal); font-size: 19px; font-weight: 950; transition: transform .45s var(--ease), background .35s ease, color .35s ease; }
.help-card-reveal { position: absolute; z-index: 4; inset: auto 9px 9px; min-height: 46%; display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 12px; padding: 15px; border-radius: 20px; background: rgba(16,34,44,.96); color: white; box-shadow: 0 18px 34px rgba(16,34,44,.28); opacity: 0; transform: translateY(calc(100% + 18px)); transition: transform .65s var(--ease), opacity .35s ease; pointer-events: none; }
.help-logo { width: 62px; height: 62px; display: grid; place-items: center; padding: 8px; border-radius: 15px; background: white; }
.help-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.help-example-copy { display: block; }.help-example-copy strong { display: block; margin-bottom: 6px; color: var(--apricot); font-size: calc(clamp(14px,1.3vw,17px) * var(--font-scale)); }.help-example-copy > span { display: block; font-size: calc(clamp(12px,1.1vw,15px) * var(--font-scale)); line-height: 1.3; }
.help-card:hover .help-card-reveal, .help-card:focus-visible .help-card-reveal, .help-card.is-open .help-card-reveal { opacity: 1; transform: translateY(0); }
.help-card:hover .help-card-visual, .help-card:focus-visible .help-card-visual, .help-card.is-open .help-card-visual { transform: scale(.92) translateY(-12px); opacity: .28; }
.help-card:hover .help-open-icon, .help-card:focus-visible .help-open-icon, .help-card.is-open .help-open-icon { transform: rotate(180deg); background: var(--navy); color: white; }
.help-card:focus-visible { outline-offset: 4px; }

/* Bridges */
.bridge-scene { text-align: center; }
.bridge-mark { width: 88px; height: 8px; margin: 0 auto 26px; border-radius: 20px; background: linear-gradient(90deg, var(--teal), var(--apricot), var(--coral)); }
.bridge-quote { font-family: var(--display); font-weight: 900; font-size: calc(clamp(38px, 5vw, 72px) * var(--font-scale)); line-height: 1.04; max-width: 1000px; margin: 0 auto; letter-spacing: -.045em; }
.bridge-quote .warm { color: var(--coral); }
.bridge-next { margin-top: 26px; font-size: calc(clamp(18px, 2vw, 25px) * var(--font-scale)); color: rgba(16,34,44,.64); }
.bridge-lookback { width: fit-content; margin: 0 auto 22px; padding: 10px 16px; border-radius: 999px; background: rgba(0,128,128,.10); color: var(--teal); font-weight: 850; font-size: calc(clamp(15px,1.4vw,19px) * var(--font-scale)); }
.question-bridge .bridge-quote { max-width: 920px; }

/* Challenge previews */
.diorama-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; min-height: 0; }
.challenge-card { --arrival-delay: 0s; position: relative; min-height: min(43vh, 340px); padding: 0; border-radius: 28px; overflow: hidden; background: linear-gradient(155deg,#fffdf8,#eef5f3); box-shadow: var(--shadow-soft); border: 1px solid var(--line); cursor: pointer; text-align: left; opacity: 0; animation: challenge-arrive .68s var(--arrival-delay) var(--ease) forwards; transition: transform .35s var(--ease), box-shadow .35s ease; }
.challenge-card:nth-child(2) { --arrival-delay: .12s; }.challenge-card:nth-child(3) { --arrival-delay: .24s; }.challenge-card:nth-child(4) { --arrival-delay: .36s; }
.challenge-card:hover, .challenge-card:focus-visible, .challenge-card.is-open { transform: translateY(-6px); box-shadow: 0 22px 42px rgba(16,34,44,.18); }
.challenge-visual { display: block; width: 100%; height: calc(100% - 68px); padding: 9px; transition: transform .55s var(--ease), opacity .4s ease; }
.challenge-visual img { width: 100%; height: 100%; object-fit: contain; display: block; }
.challenge-title { position: absolute; z-index: 4; inset: auto 0 0; min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 15px; background: rgba(255,253,248,.97); border-top: 1px solid var(--line); }
.challenge-title strong { font-family: var(--display); color: var(--coral); font-size: calc(clamp(14px, 1.42vw, 19px) * var(--font-scale)); line-height: 1.05; }
.challenge-title i { width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center; border-radius: 50%; background: var(--coral-soft); color: var(--coral); font-style: normal; font-size: 22px; transition: transform .45s var(--ease), background .35s ease, color .35s ease; }
.challenge-description { position: absolute; z-index: 3; inset: 10px 10px 78px; display: flex; align-items: flex-end; padding: 18px; border-radius: 20px; background: linear-gradient(180deg,rgba(16,34,44,.12),rgba(16,34,44,.96) 58%); color: white; font-size: calc(clamp(15px,1.4vw,18px) * var(--font-scale)); font-weight: 750; line-height: 1.35; opacity: 0; transform: translateY(18px); transition: opacity .4s ease, transform .55s var(--ease); pointer-events: none; }
.challenge-card:hover .challenge-description, .challenge-card:focus-visible .challenge-description, .challenge-card.is-open .challenge-description { opacity: 1; transform: none; }
.challenge-card:hover .challenge-visual, .challenge-card:focus-visible .challenge-visual, .challenge-card.is-open .challenge-visual { transform: scale(1.04); opacity: .46; }
.challenge-card:hover .challenge-title i, .challenge-card:focus-visible .challenge-title i, .challenge-card.is-open .challenge-title i { transform: rotate(45deg); background: var(--navy); color: white; }
@keyframes challenge-arrive { from { opacity:0; transform: translateY(30px) scale(.94); filter: blur(5px); } to { opacity:1; transform:none; filter:none; } }

/* Checks */
.check-shell { width: min(940px, 100%); margin: auto; display: grid; grid-template-columns: 180px 1fr; gap: 30px; align-items: center; }
.check-number { width: 160px; height: 160px; border-radius: 44px; display: grid; place-items: center; background: var(--navy); color: white; box-shadow: var(--shadow); font-family: var(--display); font-weight: 950; font-size: calc(50px * var(--font-scale)); transform: rotate(-4deg); }
.check-content { min-width: 0; }
.check-options { display: grid; gap: 10px; margin-top: 18px; }
.choice-button { min-height: 54px; text-align: left; padding: 12px 18px; background: rgba(255,255,255,.82); border: 2px solid transparent; box-shadow: var(--shadow-soft); font-size: calc(clamp(15px, 1.55vw, 19px) * var(--font-scale)); }
.choice-button[aria-pressed="true"] { border-color: var(--teal); background: #effaf7; }
.choice-button.is-wrong { border-color: var(--coral); background: #fff3ef; }
.feedback { min-height: 68px; margin-top: 14px; padding: 13px 16px; border-radius: 16px; background: rgba(255,255,255,.72); border-left: 5px solid var(--sage); font-size: calc(clamp(14px, 1.35vw, 17px) * var(--font-scale)); line-height: 1.35; }
.feedback.good { border-color: var(--teal); background: #edf9f6; }
.feedback.try { border-color: var(--coral); background: #fff2ee; }

/* Capability lab */
.capability-layout { display: grid; grid-template-columns: 210px 1fr; gap: 22px; min-height: 0; flex: 1; }
.capability-tabs { display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.cap-tab { position: relative; height: 66px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.72); cursor: pointer; text-align: left; padding: 0 18px; font-family: var(--display); font-weight: 900; font-size: calc(clamp(15px, 1.5vw, 20px) * var(--font-scale)); transition: .35s var(--ease); }
.cap-tab:not(.active) { transform: scale(.94); opacity: .62; }
.cap-tab.active { transform: translateX(10px) scale(1.04); background: var(--navy); color: white; box-shadow: var(--shadow); }
.cap-tab.visited::after { content: "✓"; position: absolute; right: 14px; color: var(--lime); }
.cap-stage { position: relative; min-height: 0; border-radius: 32px; background: rgba(255,255,255,.72); box-shadow: var(--shadow); overflow: hidden; }

.route-new { stroke: var(--teal); stroke-dasharray: 900; stroke-dashoffset: 900; animation: route-draw 3.4s var(--ease) infinite; }
@keyframes route-draw { 0%,28%{stroke-dashoffset:900;opacity:0} 40%{opacity:1} 78%,100%{stroke-dashoffset:0;opacity:1} }
@keyframes soften { 0%,28%{opacity:1} 55%,100%{opacity:.18} }
@keyframes marker-pop { 0%,20%{transform:scale(0);opacity:0} 32%,100%{transform:scale(1);opacity:1} }
.organize-stack img { position: absolute; inset: 0; transition: opacity .7s var(--ease), transform .7s var(--ease); }
.organize-stack .after { opacity: 0; transform: scale(.96); animation: organize-swap 4.2s var(--ease) infinite; }

@keyframes organize-swap { 0%,38%{opacity:0;transform:scale(.96)} 55%,90%{opacity:1;transform:none} 100%{opacity:0} }
@keyframes organize-before { 0%,38%{opacity:1;transform:none} 55%,90%{opacity:0;transform:scale(1.03)} 100%{opacity:1} }
.factor-list, .clue-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.factor-list span, .clue-list span { padding: 7px 10px; border-radius: 999px; background: var(--lavender); font-size: calc(clamp(12px, 1.1vw, 15px) * var(--font-scale)); font-weight: 800; }

.particles.burst i { animation: particle .65s var(--ease) both; }
.particles i:nth-child(2){--x:35px;--y:-34px;background:var(--teal)} .particles i:nth-child(3){--x:-28px;--y:-40px;background:var(--coral)} .particles i:nth-child(4){--x:42px;--y:20px;background:var(--periwinkle)} .particles i:nth-child(5){--x:-38px;--y:24px;background:var(--lime)}
@keyframes particle { 0%{opacity:1;transform:translate(0,0) scale(.3)} 100%{opacity:0;transform:translate(var(--x,20px),var(--y,-25px)) scale(1.2)} }

/* Responsibility timeline */
.sequence-scene { padding-block: clamp(10px,1.5vh,18px); }
.sequence-scene .scene-title { max-width: none; margin-bottom: 8px; font-size: calc(clamp(36px,3.7vw,50px) * var(--font-scale)); white-space: nowrap; }

.timeline-slot::before { content: attr(data-step); position: absolute; left: 10px; top: 10px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: white; font-weight: 900; }
.timeline-slot.drop-hover { border-color: var(--teal); background: #e8f7f3; }
.slot-empty { font-size: calc(clamp(12px, 1.2vw, 15px) * var(--font-scale)); color: rgba(16,34,44,.48); font-weight: 800; }
.role-piece { width: 100%; height: 100%; border: 0; background: transparent; cursor: grab; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 8px; touch-action: none; }

.palette-piece { width: 210px; height: 48px; display: grid; grid-template-columns: 38px 1fr; align-items: center; border: 1px solid var(--line); border-radius: 15px; background: white; padding: 4px 9px; cursor: grab; font-weight: 850; text-align: left; touch-action: none; }
.palette-piece img { width: 38px; height: 38px; object-fit: contain; }

/* Trust slider */
.trust-chat-stage { display: grid; grid-template-columns: minmax(300px,.88fr) minmax(420px,1.12fr); gap: clamp(34px,5vw,72px); align-items: center; isolation: isolate; }

.live-message > span { display:block; margin-bottom:4px; font-size:10px; font-weight:950; letter-spacing:.11em; }.live-message p{margin:0;font-size:calc(clamp(16px,1.45vw,20px) * var(--font-scale));line-height:1.32}

.trust-panel { text-align: center; position:relative; z-index:2; padding:clamp(18px,2.5vw,30px); border-radius:32px; background:rgba(255,253,248,.78); border:1px solid rgba(255,255,255,.74); box-shadow:0 20px 55px rgba(16,34,44,.11); backdrop-filter:blur(10px); }
.trust-panel .scene-title { font-size:calc(clamp(34px,4vw,56px) * var(--font-scale)); }
@keyframes chat-you { 0%,10%{opacity:0;transform:translateY(12px) scale(.96)} 17%,92%{opacity:1;transform:none} 100%{opacity:0} }
@keyframes chat-ai { 0%,32%{opacity:0;transform:translateY(12px) scale(.96)} 38%,92%{opacity:1;transform:none} 100%{opacity:0} }

.emoji-morph-stage { position: relative; height: clamp(76px,10vh,104px); margin: 3px 0 1px; }

.trust-slider { width: 100%; height: 28px; appearance: none; background: transparent; cursor: grab; }

/* Ethics framework */
.ethics-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1.55fr) minmax(250px,.65fr); gap: 22px; align-items: stretch; }
.ethics-stage { position: relative; min-height: 0; height: 100%; border-radius: 30px; background: radial-gradient(circle at 50% 52%,rgba(222,221,249,.58),transparent 47%),rgba(255,255,255,.48); border: 1px solid rgba(16,34,44,.08); overflow: hidden; }
.ethics-orbit { position: absolute; inset: 10% 18%; border: 2px dashed rgba(0,128,128,.22); border-radius: 50%; transform: rotate(-7deg); }
.ethics-device { position: absolute; width: 46%; height: 78%; left: 27%; top: 12%; object-fit: contain; filter: drop-shadow(0 22px 30px rgba(16,34,44,.16)); animation: lens-arrive .8s var(--ease) both; }

.ethics-reveal-dock { min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: clamp(20px,2.5vw,30px); border-radius: 30px; color: white; background: linear-gradient(150deg,var(--navy),#244959); box-shadow: var(--shadow); overflow: hidden; position: relative; }

.ethics-reveal-dock.reveal-in > * { animation: reveal-dock-in .48s var(--ease) both; }
@keyframes lens-arrive { from{opacity:0;transform:translateY(18px) scale(.84) rotate(-4deg)} to{opacity:1;transform:none} }
@keyframes hotspot-arrive { from{opacity:0;filter:blur(7px)} to{opacity:1;filter:none} }

/* Trustworthy AI board */
.context-ribbon { width: fit-content; margin: -4px 0 12px; padding: 8px 13px; border-radius: 4px 14px 14px 4px; border-left: 4px solid var(--teal); background: rgba(255,255,255,.74); color: rgba(16,34,44,.70); font-size: calc(clamp(13px,1.25vw,16px) * var(--font-scale)); }
.trust-board { position: relative; flex: 1; min-height: 0; width: min(1060px,100%); margin-inline:auto; padding: 22px; border-radius: 34px; color:var(--navy); background: linear-gradient(145deg,#eef7f4 0%,#fffaf1 52%,#f8e4d2 118%); box-shadow: 0 26px 60px rgba(16,34,44,.18), inset 0 1px 0 white; border:1px solid rgba(16,34,44,.10); overflow:hidden; isolation:isolate; animation: board-arrive .85s var(--ease) both; }
.trust-board::before { content:""; position:absolute; inset:10px; border:1px solid rgba(16,34,44,.10); border-radius:26px; pointer-events:none; }.trust-board::after { content:""; position:absolute; inset:0; opacity:.13; background-image:linear-gradient(rgba(16,34,44,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(16,34,44,.11) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(90deg,#000,transparent 42%,transparent 58%,#000);pointer-events:none}.trust-board-glow { position:absolute; width:390px; height:390px; border-radius:50%; left:50%; top:48%; transform:translate(-50%,-50%); background:radial-gradient(circle,rgba(0,128,128,.20),rgba(122,121,216,.09) 42%,transparent 69%); filter:blur(3px); }
.trust-board-grid { position:relative; z-index:2; height:100%; display:grid; grid-template-columns:1fr 230px 1fr; gap:18px; align-items:center; }
.trust-column { display:grid; gap:18px; }.trust-signal,.trust-human-led { display:grid; grid-template-columns:46px 1fr; gap:10px; align-items:center; padding:13px 15px; border-radius:18px; background:rgba(255,255,255,.88); border:1px solid rgba(16,34,44,.11); box-shadow:0 12px 28px rgba(16,34,44,.10); opacity:0; animation:signal-arrive .62s var(--ease) forwards; }.trust-signal em,.trust-human-led em { font-style:normal;font-size:30px; }.trust-signal b,.trust-human-led b { display:block;color:var(--teal);font-size:calc(clamp(13px,1.25vw,17px) * var(--font-scale)); }.trust-signal span,.trust-human-led span { font-size:calc(clamp(12px,1.12vw,15px) * var(--font-scale));line-height:1.25;color:rgba(16,34,44,.78); }
.trust-signal.s1{animation-delay:.22s}.trust-signal.s2{animation-delay:.38s}.trust-signal.s3{animation-delay:.54s}.trust-signal.s4{animation-delay:.70s}
.trust-center { position:relative; height:100%; min-height:260px; display:grid; place-items:center; }.trust-center-ring { position:absolute; width:214px;height:214px;border-radius:50%;border:2px solid rgba(0,128,128,.34);box-shadow:0 0 0 15px rgba(0,128,128,.06),0 0 0 34px rgba(122,121,216,.055);animation:ring-breathe 4.5s ease-in-out infinite; }.trust-emblem { position:relative; z-index:2; width:170px;height:170px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 34% 24%,#244959,var(--navy) 64%);color:white;border:5px solid rgba(255,255,255,.94);box-shadow:0 20px 42px rgba(16,34,44,.32),0 0 0 5px rgba(0,128,128,.18); }.trust-emblem > span { position:absolute;top:17px;color:var(--lime);font-size:22px; }.trust-emblem strong { color:white;text-shadow:0 2px 8px rgba(0,0,0,.32);font:900 calc(clamp(19px,2vw,27px) * var(--font-scale))/1 var(--display);letter-spacing:-.03em; }
.trust-human-led { position:absolute; z-index:4; left:50%; bottom:3px; width:250px; transform:translateX(-50%); background:linear-gradient(110deg,var(--navy),#1d5360); border-color:rgba(16,34,44,.25); box-shadow:0 14px 30px rgba(16,34,44,.22); animation-delay:.88s; }.trust-human-led b{color:var(--apricot)}.trust-human-led span{color:white}
@keyframes board-arrive { from{opacity:0;transform:perspective(900px) rotateX(7deg) translateY(24px) scale(.97)} to{opacity:1;transform:none} }
@keyframes signal-arrive { from{opacity:0;transform:translateY(18px) scale(.96)} to{opacity:1;transform:none} }

/* Exit ticket */
.exit-layout { display: grid; grid-template-columns: .42fr 1.58fr; gap: 32px; min-height: 0; align-items: center; }
.exit-form { display: grid; gap: 10px; min-height: 0; }
.exit-prompt { display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: center; padding: 12px 15px; border-radius: 18px; background: rgba(255,255,255,.78); border: 1px solid var(--line); }
.exit-number { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--navy); color: white; font-weight: 900; }

.exit-prompt textarea { width: 100%; height: 48px; min-height: 48px; max-height: 58px; resize: none; border: 1px solid rgba(16,34,44,.18); border-radius: 11px; padding: 9px 11px; color: var(--navy); background: white; font-size: calc(clamp(13px, 1.25vw, 16px) * var(--font-scale)); }
.exit-status { min-height: 24px; color: var(--teal); font-weight: 850; }

/* Badge */
.badge-scene { color: white; background: radial-gradient(circle at 50% 42%, #263d49, #0a151b 70%); }

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'aistart-g7-m6-s1-v3';
  const PREVIOUS_STORAGE_KEY = 'aistart-g7-m6-s1-v2';
  const LEGACY_STORAGE_KEY = 'aistart-g7-m6-s1-v1';
  const VERSION = 3;
  const sceneRoot = document.getElementById('sceneRoot');
  const app = document.getElementById('app');
  const backButton = document.getElementById('backButton');
  const nextButton = document.getElementById('nextButton');
  const progressButton = document.getElementById('progressButton');
  const progressText = document.getElementById('progressText');
  const progressFill = document.getElementById('progressFill');
  const sceneDialog = document.getElementById('sceneDialog');
  const resetDialog = document.getElementById('resetDialog');
  const sceneList = document.getElementById('sceneList');
  const toast = document.getElementById('toast');
  let cleanupScene = () => {};
  let toastTimer = 0;
  let timerInterval = 0;
  let suppressClickUntil = 0;

  const roleData = {
    suggest: { label: 'AI gives a suggestion', image: 'assets/role-ai-suggests.png' },
    check: { label: 'A person checks', image: 'assets/role-human-checks.png' },
    decide: { label: 'A person decides', image: 'assets/role-human-decides.png' },
    responsible: { label: 'A person stays responsible', image: 'assets/role-human-responsible.png' }
  };

  const defaultState = () => ({
    version: VERSION,
    current: 0,
    maxReached: 0,
    fontScale: 1,
    name: '',
    completed: {},
    videoStarted: false,
    flipped: [],
    challengesOpen: [],
    checks: {},
    capVisited: ['suggest'],
    activeCapability: 'suggest',
    sequence: [],
    sequenceFeedback: '',
    trust: 0,
    ethicsActive: '',
    ethicsSeen: [],
    exit: ['', '', ''],
    exitSubmitted: false
  });

  function loadState() {
    try {
      const currentRaw = localStorage.getItem(STORAGE_KEY);
      const previousRaw = currentRaw ? null : localStorage.getItem(PREVIOUS_STORAGE_KEY);
      const legacyRaw = currentRaw || previousRaw ? null : localStorage.getItem(LEGACY_STORAGE_KEY);
      const parsed = JSON.parse(currentRaw || previousRaw || legacyRaw);
      if (!parsed || ![1, 2, VERSION].includes(parsed.version)) return defaultState();
      const fromLegacy = parsed.version === 1;
      const base = defaultState();
      const merged = { ...base, ...parsed };
      if (fromLegacy) {
        const shiftIndex = value => Number(value) >= 15 ? Number(value) + 1 : Number(value);
        merged.current = shiftIndex(merged.current);
        merged.maxReached = shiftIndex(merged.maxReached);
        merged.completed = Object.fromEntries(Object.entries(merged.completed || {}).map(([key,value]) => [String(shiftIndex(key)), value]));
        merged.trust = Number(merged.trust) <= 4 ? Number(merged.trust) * 25 : Number(merged.trust);
      }
      merged.version = VERSION;
      merged.current = clampInt(merged.current, 0, 22);
      merged.maxReached = clampInt(merged.maxReached, 0, 22);
      merged.fontScale = Math.max(.9, Math.min(1.12, Number(merged.fontScale) || 1));
      merged.name = typeof merged.name === 'string' ? merged.name.slice(0, 60) : '';
      merged.completed = merged.completed && typeof merged.completed === 'object' ? merged.completed : {};
      merged.flipped = Array.isArray(merged.flipped) ? merged.flipped.filter(Number.isInteger) : [];
      merged.challengesOpen = Array.isArray(merged.challengesOpen) ? merged.challengesOpen.filter(value => Number.isInteger(value) && value >= 0 && value < 4) : [];
      merged.capVisited = Array.isArray(merged.capVisited) ? merged.capVisited.filter(v => ['suggest','organize','compare','predict'].includes(v)) : ['suggest'];
      merged.sequence = Array.isArray(merged.sequence) ? merged.sequence.filter(v => roleData[v]).slice(0, 4) : [];
      merged.trust = Math.max(0, Math.min(100, Number(merged.trust) || 0));
      merged.ethicsActive = ['purpose','benefit','problem','people','responsibility'].includes(merged.ethicsActive) ? merged.ethicsActive : '';
      merged.ethicsSeen = Array.isArray(merged.ethicsSeen) ? merged.ethicsSeen.filter(v => ['purpose','benefit','problem','people','responsibility'].includes(v)) : [];
      merged.exit = Array.isArray(merged.exit) ? merged.exit.slice(0,3).map(v => String(v).slice(0,240)) : ['', '', ''];
      while (merged.exit.length < 3) merged.exit.push('');
      return merged;
    } catch (_) { return defaultState(); }
  }

  let state = loadState();

  function clampInt(value, min, max) {
    const n = Number.parseInt(value, 10);
    return Number.isFinite(n) ? Math.max(min, Math.min(max, n)) : min;
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
  }

  function showToast(message) {
    window.clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.add('show');
    toastTimer = window.setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function markComplete(index = state.current) {
    state.completed[index] = true;
    saveState();
    updateChrome();
  }

  function isComplete(index) {
    if ([0,2,4,6,7,9,13,15,16,17,19,21,22].includes(index)) return true;
    if (index === 1) return state.name.trim().length >= 2;
    if (index === 3) return state.videoStarted;
    if (index === 5) return state.flipped.length >= 1;
    if (index === 8) return state.checks.one === 'correct';
    if (index === 10) return ['suggest','organize','compare','predict'].every(v => state.capVisited.includes(v));
    if (index === 11) return state.sequence.join(',') === 'suggest,check,decide,responsible';
    if (index === 12) return state.checks.two === 'correct';
    if (index === 14) return Number(state.trust) >= 75;
    if (index === 18) return state.checks.three === 'correct';
    if (index === 20) return state.exitSubmitted;
    return Boolean(state.completed[index]);
  }

            <div class="live-chat-body">
              <div class="live-message live-you"><span>YOU</span><p>What is the capital of France?</p></div>
              <div class="live-message live-ai"><span>AI</span><div class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></div><p class="ai-answer">Lyon is the capital of France.</p></div>
            </div>
            <div class="chat-alert"><span>!</span>Confident can still be incorrect.</div>
          </div>
          <div class="trust-panel"><span class="eyebrow">THINK · MOVE THE SLIDER</span><h1 class="scene-title" id="trustTitle">What would you do with this answer?</h1><div class="emoji-morph-stage" id="emojiMorph" aria-hidden="true"><span data-emoji-stop="0">😵‍💫</span><span data-emoji-stop="25">🤨</span><span data-emoji-stop="50">🤔</span><span data-emoji-stop="75">🧐</span><span data-emoji-stop="100">🕵️</span></div><input class="trust-slider" id="trustSlider" type="range" min="0" max="100" step="1" value="${value}" aria-label="From believe it now to check it first"><div class="slider-labels"><span>BELIEVE IT NOW</span><span>CHECK IT FIRST</span></div><div class="trust-reveal" id="trustReveal" role="status">${reveal}</div><div class="insight-strip">Trust doesn’t mean believing everything.</div></div>
        </div>
      </section>`;
  }

  function renderEthicsReveal() {
    const questions = {
      purpose: ['🎯','PURPOSE','What is this AI trying to help with?'],
      benefit: ['✨','BENEFIT','What could become better?'],
      problem: ['⚠️','PROBLEM','What could go wrong?'],
      people: ['👥','PEOPLE','Who could be affected?'],
      responsibility: ['🧭','RESPONSIBILITY','What should a person still check or decide?']
    };
    const item = questions[state.ethicsActive];
    if (!item) return '<span class="reveal-cue">Choose a title beside the lens.</span><strong>Open one question at a time.</strong><p>Use each question to look at AI from a different angle.</p>';
    return `<span class="reveal-cue">QUESTION OPENED</span><div class="reveal-icon">${item[0]}</div><strong>${item[1]}</strong><p>${item[2]}</p>`;
  }

  function renderExitTicket() {
    const name = state.name.trim() || 'Explorer';
    const prompts = [
      'Name one way AI can help and one challenge it could create.',
      'How can AI support a decision without making the final decision for us?',
      'What should a person still check or decide when using AI? Why?'
    ];
    return `
      <section class="scene" aria-labelledby="exitTitle"><div class="scene-inner exit-layout">
        <div><span class="eyebrow">REFLECT</span><h1 class="scene-title" id="exitTitle">${escapeHTML(name)}, capture your thinking.</h1><p class="scene-subtitle">Three short answers. Clear ideas matter more than long writing.</p><div class="exit-status" id="exitStatus" role="status">${state.exitSubmitted ? 'Exit Ticket complete.' : ''}</div></div>
        <form class="exit-form" id="exitForm">${prompts.map((prompt,i) => `<label class="exit-prompt"><span class="exit-number">${i+1}</span><span><span class="exit-question">${prompt}</span><textarea maxlength="240" data-exit="${i}" placeholder="Write a short response...">${escapeHTML(state.exit[i])}</textarea></span></label>`).join('')}<button class="primary-button" type="submit">Complete Exit Ticket</button></form>
      </div></section>`;
  }

  function renderBadge() {
    const name = state.name.trim() || 'Impact Explorer';
    return `
      <section class="scene badge-scene" aria-labelledby="badgeTitle"><div class="badge-stage">
        <div class="badge-art"><span class="badge-token bt1"><img src="assets/shape-capsule-apricot.png" alt=""><span>PURPOSE</span></span><span class="badge-token bt2"><img src="assets/shape-sphere-teal.png" alt=""><span>BENEFIT</span></span><span class="badge-token bt3"><img src="assets/shape-sphere-coral.png" alt=""><span>PROBLEM</span></span><span class="badge-token bt4"><img src="assets/shape-ring-lavender.png" alt=""><span>PEOPLE</span></span><span class="badge-token bt5"><img src="assets/shape-sphere-teal.png" alt=""><span>RESPONSIBILITY</span></span><img class="badge-main" src="assets/badge-impact-explorer.png" alt="Impact Explorer badge"></div>
        <div class="badge-copy"><span class="eyebrow">BADGE UNLOCKED</span><h1 id="badgeTitle">IMPACT<br>EXPLORER</h1><div class="awarded">Awarded to</div><div class="student-award">${escapeHTML(name)}</div><div class="badge-collection" aria-label="Module 6 badge collection, one of five earned"><span class="collection-slot earned"><img src="assets/badge-impact-explorer.png" alt="Impact Explorer earned"></span><span class="collection-slot">2</span><span class="collection-slot">3</span><span class="collection-slot">4</span><span class="collection-slot">5</span></div><div class="collection-note">Impact Explorer earned · 1 of 5 badges collected</div></div>
      </div></section>`;
  }

  function initName() {
    const input = document.getElementById('studentName');
    const note = document.getElementById('nameNote');
    const save = () => {
      const name = input.value.trim().replace(/\s+/g, ' ');
      if (name.length < 2) { note.textContent = 'Please enter the name you want on your badge.'; input.focus(); return; }
      state.name = name.slice(0, 60); markComplete(); saveState(); note.textContent = `Welcome, ${state.name}!`; showToast('Name saved');
    };
    document.getElementById('saveName').addEventListener('click', save);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
    input.addEventListener('input', () => { state.name = input.value.slice(0,60); saveState(); updateChrome(); });
    window.setTimeout(() => input.focus(), 80);
  }

  function initVideo() {
    const video = document.getElementById('introVideo');
    const seek = document.getElementById('videoSeek');
    const time = document.getElementById('videoTime');
    const mute = document.getElementById('videoMute');
    const fmt = seconds => `${Math.floor(seconds/60)}:${String(Math.floor(seconds%60)).padStart(2,'0')}`;
    const play = () => video.play().catch(() => showToast('Press Play again if your browser blocked media.'));
    document.getElementById('videoPlay').addEventListener('click', play);
    document.getElementById('videoPause').addEventListener('click', () => video.pause());
    document.getElementById('videoReplay').addEventListener('click', () => { video.currentTime = 0; play(); });
    mute.addEventListener('click', () => { video.muted = !video.muted; mute.textContent = video.muted ? '🔇' : '🔊'; mute.setAttribute('aria-label', video.muted ? 'Unmute video' : 'Mute video'); });
    document.getElementById('videoFullscreen').addEventListener('click', () => {
      const target = video.closest('.video-screen');
      const request = target.requestFullscreen || target.webkitRequestFullscreen;
      if (request) request.call(target); else showToast('Fullscreen is not available in this browser.');
    });
    video.addEventListener('play', () => { state.videoStarted = true; markComplete(); });
    video.addEventListener('timeupdate', () => { const duration = video.duration || 36.57; seek.value = String((video.currentTime/duration)*100); time.textContent = `${fmt(video.currentTime)} / ${fmt(duration)}`; });
    seek.addEventListener('input', () => { if (Number.isFinite(video.duration)) video.currentTime = (Number(seek.value)/100)*video.duration; });
    cleanupScene = () => video.pause();
  }

  function initTalkTimer() {
    const button = document.getElementById('timerButton');
    const face = document.getElementById('timerFace');
    let remaining = 45;
    button.addEventListener('click', () => {
      window.clearInterval(timerInterval);
      remaining = 45; face.textContent = '0:45'; button.textContent = 'Restart talk';
      timerInterval = window.setInterval(() => { remaining -= 1; face.textContent = `0:${String(Math.max(0,remaining)).padStart(2,'0')}`; if (remaining <= 0) { window.clearInterval(timerInterval); face.textContent = 'Share!'; showToast('Time to share one idea.'); } }, 1000);
    });
    cleanupScene = () => window.clearInterval(timerInterval);
  }

  function initFlipGallery() {
    document.querySelectorAll('[data-flip]').forEach(card => card.addEventListener('click', () => {
      const index = Number(card.dataset.flip);
      card.classList.toggle('is-open');
      const isOpen = card.classList.contains('is-open');
      card.setAttribute('aria-expanded', String(isOpen));
      if (!state.flipped.includes(index)) state.flipped.push(index);
      markComplete();
    }));
  }

  function initChallenges() {
    document.querySelectorAll('[data-challenge]').forEach(card => card.addEventListener('click', () => {
      const index = Number(card.dataset.challenge);
      card.classList.toggle('is-open');
      const isOpen = card.classList.contains('is-open');
      card.setAttribute('aria-expanded', String(isOpen));
      state.challengesOpen = isOpen ? [...new Set([...state.challengesOpen, index])] : state.challengesOpen.filter(value => value !== index);
      saveState();
    }));
  }

  function initCheck(id, correctIndex, correctReason) {
    const feedback = document.getElementById('checkFeedback');
    document.querySelectorAll('[data-check-choice]').forEach(button => button.addEventListener('click', () => {
      const index = Number(button.dataset.checkChoice);
      document.querySelectorAll('[data-check-choice]').forEach(b => { b.classList.remove('is-wrong'); b.setAttribute('aria-pressed','false'); });
      button.setAttribute('aria-pressed','true');
      if (index === correctIndex) {
        state.checks[id] = 'correct';
        feedback.className = 'feedback good';
        feedback.innerHTML = `<strong>Yes.</strong> ${correctReason}`;
        markComplete();
      } else {
        state.checks[id] = `wrong-${index}`;
        feedback.className = 'feedback try';
        feedback.innerHTML = '<strong>Not quite.</strong> Look for the answer that keeps the benefit without ignoring people’s responsibility.';
        button.classList.add('is-wrong');
        saveState(); updateChrome();
      }
    }));
  }

  function initCapabilities() {
    document.querySelectorAll('[data-cap]').forEach(tab => tab.addEventListener('click', () => {
      const key = tab.dataset.cap;
      state.activeCapability = key;
      if (!state.capVisited.includes(key)) state.capVisited.push(key);
      saveState();
      document.querySelectorAll('[data-cap]').forEach(t => { t.classList.toggle('active', t.dataset.cap === key); t.classList.toggle('visited', state.capVisited.includes(t.dataset.cap)); t.setAttribute('aria-selected', t.dataset.cap === key); });
      document.querySelectorAll('[data-cap-panel]').forEach(panel => panel.classList.toggle('active', panel.dataset.capPanel === key));
      const particles = document.getElementById('capParticles');
      particles.classList.remove('burst'); void particles.offsetWidth; particles.classList.add('burst');
      if (isComplete(10)) markComplete(10); else updateChrome();
    }));
  }

  function initSequence() {
    updateSequenceUI();
    document.getElementById('clearSequence').addEventListener('click', () => { state.sequence = []; state.sequenceFeedback = ''; saveState(); updateSequenceUI(); updateChrome(); });
    document.getElementById('checkSequence').addEventListener('click', () => {
      if (state.sequence.length < 4) state.sequenceFeedback = 'Place all four roles first.';
      else if (state.sequence.join(',') === 'suggest,check,decide,responsible') { state.sequenceFeedback = 'That’s it. AI supports; people check, decide, and stay responsible.'; markComplete(); }
      else state.sequenceFeedback = 'Try again. AI starts with support, but the final responsibility stays with people.';
      saveState(); updateSequenceUI(); updateChrome();
    });
  }

  function updateSequenceUI() {
    const host = document.getElementById('sequenceActivity');
    if (!host) return;
    const unused = Object.keys(roleData).filter(key => !state.sequence.includes(key));
    host.innerHTML = `<div class="timeline-slots">${[0,1,2,3].map(index => {
      const key = state.sequence[index];
      return `<div class="timeline-slot" data-step="${index+1}" data-slot="${index}">${key ? rolePiece(key, true) : '<span class="slot-empty">Place a role here</span>'}</div>`;
    }).join('')}</div><div class="role-palette" aria-label="Available roles">${unused.map(key => rolePiece(key, false)).join('')}</div>`;
    const feedback = document.getElementById('sequenceFeedback');
    if (feedback) feedback.textContent = state.sequenceFeedback;
    bindRolePieces();
  }

  function rolePiece(key, placed) {
    const role = roleData[key];
    return `<button class="${placed ? 'role-piece' : 'palette-piece'}" type="button" data-role="${key}" data-placed="${placed}" aria-label="${role.label}${placed ? ', tap to remove' : ', tap to add'}"><img src="${role.image}" alt=""><strong>${role.label}</strong></button>`;
  }

  function bindRolePieces() {
    document.querySelectorAll('[data-role]').forEach(piece => {
      piece.addEventListener('click', () => {
        if (Date.now() < suppressClickUntil) return;
        const key = piece.dataset.role;
        if (piece.dataset.placed === 'true') state.sequence = state.sequence.filter(v => v !== key);
        else if (!state.sequence.includes(key) && state.sequence.length < 4) state.sequence.push(key);
        state.sequenceFeedback = ''; saveState(); updateSequenceUI(); updateChrome();
      });
      piece.addEventListener('pointerdown', startRoleDrag);
    });
  }

  function startRoleDrag(event) {
    if (event.button !== undefined && event.button !== 0) return;
    const source = event.currentTarget;
    const key = source.dataset.role;
    const startX = event.clientX, startY = event.clientY;
    let ghost = null, moved = false;
    const move = e => {
      if (!moved && Math.hypot(e.clientX-startX, e.clientY-startY) < 7) return;
      moved = true;
      if (!ghost) { ghost = source.cloneNode(true); ghost.className = 'role-piece dragging'; document.body.appendChild(ghost); }
      ghost.style.left = `${e.clientX - 90}px`; ghost.style.top = `${e.clientY - 95}px`;
      document.querySelectorAll('.timeline-slot').forEach(slot => slot.classList.remove('drop-hover'));
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const slot = under && under.closest('.timeline-slot'); if (slot) slot.classList.add('drop-hover');
    };
    const up = e => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      document.querySelectorAll('.timeline-slot').forEach(slot => slot.classList.remove('drop-hover'));
      if (ghost) ghost.remove();
      if (!moved) return;
      suppressClickUntil = Date.now() + 450;
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const slot = under && under.closest('.timeline-slot');
      if (!slot) return;
      const target = Number(slot.dataset.slot);
      const next = state.sequence.filter(v => v !== key);
      const displaced = next[target];
      if (displaced) next.splice(target, 1, key, displaced); else next.splice(target, 0, key);
      state.sequence = next.slice(0,4); state.sequenceFeedback = ''; saveState(); updateSequenceUI(); updateChrome();
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }

  function initTrustSlider() {
    const slider = document.getElementById('trustSlider');
    const reveal = document.getElementById('trustReveal');
    const updateEmojiMorph = value => {
      document.querySelectorAll('[data-emoji-stop]').forEach(emoji => {
        const stop = Number(emoji.dataset.emojiStop);
        const distance = Math.abs(value - stop);
        const visibility = Math.max(0, 1 - distance / 32);
        emoji.style.opacity = String(visibility);
        emoji.style.transform = `translate(-50%, calc(-50% + ${(stop-value)*.11}px)) scale(${.78 + visibility*.25}) rotate(${(stop-value)*.055}deg)`;
        emoji.style.zIndex = String(Math.round(visibility * 10));
      });
    };
    updateEmojiMorph(Number(slider.value));
    slider.addEventListener('input', () => {
      const value = Number(slider.value);
      state.trust = value;
      updateEmojiMorph(value);
      reveal.innerHTML = value >= 75 ? '<strong>The capital is Paris.</strong> Good trust includes checking.' : value >= 45 ? 'Pause before using the answer for something important.' : value >= 20 ? 'A confident voice can still make a mistake.' : 'Move toward checking before an important decision.';
      if (value >= 75) markComplete(); else { saveState(); updateChrome(); }
    });
  }

  function initEthicsQuestions() {
    document.querySelectorAll('[data-ethics]').forEach(button => button.addEventListener('click', () => {
      const key = button.dataset.ethics;
      state.ethicsActive = key;
      if (!state.ethicsSeen.includes(key)) state.ethicsSeen.push(key);
      document.querySelectorAll('[data-ethics]').forEach(item => {
        const active = item.dataset.ethics === key;
        item.classList.toggle('active', active);
        item.setAttribute('aria-pressed', String(active));
      });
      const dock = document.getElementById('ethicsReveal');
      dock.classList.remove('reveal-in');
      dock.innerHTML = renderEthicsReveal();
      void dock.offsetWidth;
      dock.classList.add('reveal-in');
      saveState();
    }));
  }

  function initExitTicket() {
    document.querySelectorAll('[data-exit]').forEach(area => area.addEventListener('input', () => { state.exit[Number(area.dataset.exit)] = area.value.slice(0,240); state.exitSubmitted = false; saveState(); updateChrome(); }));
    document.getElementById('exitForm').addEventListener('submit', e => {
      e.preventDefault();
      const areas = [...document.querySelectorAll('[data-exit]')];
      state.exit = areas.map(area => area.value.trim().slice(0,240));
      const missing = state.exit.findIndex(value => value.length < 5);
      const status = document.getElementById('exitStatus');
      if (missing >= 0) { status.textContent = `Add a short idea for prompt ${missing+1}.`; areas[missing].focus(); state.exitSubmitted = false; saveState(); updateChrome(); return; }
      state.exitSubmitted = true; status.textContent = 'Exit Ticket complete. Your badge is ready.'; markComplete(); showToast('Exit Ticket complete');
    });
  }

  function renderScene() {
    cleanupScene(); cleanupScene = () => {}; window.clearInterval(timerInterval);
    const scene = scenes[state.current];
    app.dataset.scene = scene.id;
    sceneRoot.innerHTML = scene.render();
    document.documentElement.style.setProperty('--font-scale', state.fontScale);
    updateChrome();
    if (scene.init) scene.init();
    window.setTimeout(() => {
      const heading = sceneRoot.querySelector('h1, h2, [tabindex="0"]');
      if (heading && state.current !== 1) { heading.tabIndex = -1; heading.focus({ preventScroll: true }); }
    }, 60);
  }

  function updateChrome() {
    const total = scenes.length;
    progressText.textContent = `${state.current + 1} / ${total}`;
    progressFill.style.width = `${((state.current + 1)/total)*100}%`;
    backButton.disabled = state.current === 0;
    if (state.current === total - 1) { nextButton.disabled = true; nextButton.innerHTML = '<span>Session Complete</span>'; }
    else { nextButton.disabled = !isComplete(state.current); nextButton.innerHTML = '<span>Next</span> →'; }
    const blockedLabels = { 1:'Save your name first', 3:'Start the video first', 5:'Open at least one example', 8:'Answer Mini Check 1', 10:'Explore all four ways', 11:'Build the correct order', 12:'Answer Mini Check 2', 14:'Move toward checking', 18:'Answer Mini Check 3', 20:'Complete all three prompts' };
    nextButton.title = nextButton.disabled && blockedLabels[state.current] ? blockedLabels[state.current] : '';
    saveState();
  }

  function goTo(index) {
    const target = clampInt(index, 0, scenes.length - 1);
    if (target > state.maxReached + 1) return;
    if (target === state.current + 1 && !isComplete(state.current)) { showToast(nextButton.title || 'Complete this scene first.'); return; }
    if (target > state.current) markComplete(state.current);
    state.current = target;
    state.maxReached = Math.max(state.maxReached, target);
    saveState(); renderScene();
  }

  function openSceneNavigator() {
    sceneList.innerHTML = scenes.map((scene,index) => `<button class="scene-link ${index===state.current?'current':''}" type="button" data-scene-link="${index}" ${index<=state.maxReached?'':'disabled'}><span>${index+1}.</span> ${escapeHTML(scene.title)}</button>`).join('');
    sceneList.querySelectorAll('[data-scene-link]').forEach(button => button.addEventListener('click', () => { sceneDialog.close(); goTo(Number(button.dataset.sceneLink)); }));
    sceneDialog.showModal();
  }

  function resetSession() {
    cleanupScene(); window.clearInterval(timerInterval); localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(PREVIOUS_STORAGE_KEY); localStorage.removeItem(LEGACY_STORAGE_KEY); state = defaultState(); resetDialog.close(); renderScene(); showToast('Session reset');
  }

  backButton.addEventListener('click', () => goTo(state.current - 1));
  nextButton.addEventListener('click', () => goTo(state.current + 1));
  progressButton.addEventListener('click', openSceneNavigator);
  document.getElementById('resetButton').addEventListener('click', () => resetDialog.showModal());
  document.getElementById('confirmReset').addEventListener('click', resetSession);
  document.querySelectorAll('[data-close-dialog]').forEach(button => button.addEventListener('click', () => button.closest('dialog').close()));
  document.getElementById('fontDown').addEventListener('click', () => { state.fontScale = Math.max(.9, Number((state.fontScale-.05).toFixed(2))); saveState(); renderScene(); showToast(`Text size ${Math.round(state.fontScale*100)}%`); });
  document.getElementById('fontUp').addEventListener('click', () => { state.fontScale = Math.min(1.12, Number((state.fontScale+.05).toFixed(2))); saveState(); renderScene(); showToast(`Text size ${Math.round(state.fontScale*100)}%`); });
  window.addEventListener('keydown', event => {
    if (event.key === 'Escape') return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(tag)) return;
    if (event.key === 'ArrowLeft' && state.current > 0) goTo(state.current - 1);
    if (event.key === 'ArrowRight' && state.current < scenes.length-1 && isComplete(state.current)) goTo(state.current + 1);
  });
  window.addEventListener('beforeunload', () => cleanupScene());

  renderScene();
})();

</script>
</body>
</html>
