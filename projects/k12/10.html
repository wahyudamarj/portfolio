<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../assets/preview-session.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My AI Helper · Session 1</title>
  <style>
/* ============================================================
   MY AI HELPER — Grade 5, Module 2, Session 1
   Visual system: colorful, warm, playful-but-not-childish.
   ============================================================ */

/* ---------- Design tokens ---------- */
:root {
  /* palette */
  --navy: #17324D;
  --teal: #1EAFA1;
  --aqua: #4CCFDB;
  --mint: #BDEFE3;
  --yellow: #FFD96A;
  --coral: #FF8E7A;
  --purple: #A995E8;
  --sky: #8CCCF4;
  --offwhite: #FFFDF8;
  --palemint: #F1FBF7;

  /* spacing */
  --space-xs: clamp(6px, 0.6vw, 10px);
  --space-sm: clamp(10px, 1vw, 18px);
  --space-md: clamp(18px, 1.8vw, 30px);
  --space-lg: clamp(28px, 3vw, 52px);
  --space-xl: clamp(42px, 5vw, 84px);

  /* radii */
  --r-sm: 14px;
  --r-md: 22px;
  --r-lg: 34px;
  --r-xl: 46px;

  /* type */
  --font: "Poppins", "Nunito", "Arial Rounded MT Bold", Arial, sans-serif;

  /* per-scene accents (set inline by JS) */
  --accent: var(--teal);
  --accent-2: var(--aqua);
  --accent-3: var(--yellow);

  /* shadow */
  --shadow-sm: 0 6px 18px rgba(23, 50, 77, 0.10);
  --shadow-md: 0 14px 34px rgba(23, 50, 77, 0.14);
  --shadow-lg: 0 26px 60px rgba(23, 50, 77, 0.18);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100dvh;
}

body {
  font-family: var(--font);
  color: var(--navy);
  background: var(--palemint);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- App layout ---------- */
#app {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  height: 100dvh;
  padding: clamp(8px, 1.2vh, 16px) clamp(10px, 1.6vw, 26px);
  gap: clamp(4px, 0.8vh, 10px);
}

/* ---------- Top bar ---------- */
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  z-index: 5;
}
.topbar__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.72);
  border-radius: 999px;
  padding: 8px 16px;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(6px);
}
.dot-badge {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--teal), var(--aqua));
  box-shadow: 0 0 0 4px rgba(76, 207, 219, 0.25);
}
.session-label {
  font-weight: 700;
  color: var(--navy);
  font-size: clamp(0.8rem, 0.9vw, 1rem);
  letter-spacing: 0.02em;
}

.toolbar { display: flex; gap: 8px; }
.tool {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: none;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.72);
  color: var(--navy);
  border-radius: 999px;
  padding: 9px 14px;
  min-height: 44px;
  font-family: var(--font);
  font-weight: 700;
  font-size: clamp(0.78rem, 0.9vw, 0.95rem);
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(6px);
  transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
}
.tool:hover { transform: translateY(-2px); }
.tool:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.tool[aria-pressed="true"] {
  background: var(--teal);
  color: #fff;
}
.tool__icon { font-size: 1.05em; line-height: 1; }
.tool__text { line-height: 1; }
@media (max-width: 900px) { .tool__text { display: none; } .tool { padding: 9px; } }

/* ---------- Stage ----------
   Fill whatever vertical space is left AFTER the topbar and nav, so the
   stage + chrome always sum to exactly one screen — nothing is pushed off
   and no scrolling is needed to reach buttons like "Start". */
.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: min(92vw, 1380px);
  margin: 0 auto;
  border-radius: var(--r-xl);
  overflow: hidden;
  background: var(--offwhite);
  box-shadow: var(--shadow-lg);
  isolation: isolate;
}
@media (max-width: 1180px) and (orientation: landscape) {
  .stage { width: 94vw; }
}

/* Each scene fills the stage */
.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: clamp(16px, 2.2vh, 40px) clamp(20px, 3vw, 52px);
  z-index: 2;
}

/* Content wrapper: fills the scene, and if content is ever taller than
   the stage it scrolls INSIDE the wrapper instead of being clipped —
   so no object is ever cut off at the bottom. The background stays pinned. */
.scene__content {
  position: relative;
  z-index: 2;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-width: thin;
}
/* single top-level child per scene: centre it, but let it scroll when tall */
.scene__content > * { margin-block: auto; width: 100%; }

/* Scene transitions */
.scene {
  opacity: 0;
  transition: opacity 560ms cubic-bezier(0.22, 0.61, 0.36, 1),
              transform 560ms cubic-bezier(0.22, 0.61, 0.36, 1);
}
.scene.enter-right { transform: translateX(42px) scale(0.985); }
.scene.enter-left  { transform: translateX(-42px) scale(0.985); }
.scene.is-active   { opacity: 1; transform: translateX(0) scale(1); }
.scene.leave-left  { opacity: 0; transform: translateX(-42px) scale(0.985); }
.scene.leave-right { opacity: 0; transform: translateX(42px) scale(0.985); }

/* ============================================================
   BACKGROUND FAMILIES
   ============================================================ */
.bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.bg__grad {
  position: absolute;
  inset: -10%;
  background-size: 180% 180%;
  animation: gradShift 24s ease-in-out infinite alternate;
}
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(38px);
  opacity: 0.55;
  animation: drift 20s ease-in-out infinite alternate;
}
.blob.b2 { animation-duration: 24s; animation-delay: -6s; }
.shape {
  position: absolute;
  opacity: 0.5;
  animation: tilt 9s ease-in-out infinite alternate;
}
.shape.round { border-radius: 50%; }
.shape.soft { border-radius: 30% 70% 62% 38% / 44% 40% 60% 56%; }
.paper {
  position: absolute;
  border-radius: 16px;
  opacity: 0.5;
  animation: floaty 14s ease-in-out infinite alternate;
  box-shadow: 0 8px 18px rgba(23,50,77,0.06);
}
.dot {
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 50%;
  opacity: 0.6;
  animation: floatUp 13s ease-in-out infinite;
}
.spark {
  position: absolute;
  font-size: 20px;
  opacity: 0;
  animation: twinkle 7s ease-in-out infinite;
}
.wave {
  position: absolute;
  left: -10%;
  width: 120%;
  height: 46%;
  opacity: 0.5;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  animation: waveShift 18s ease-in-out infinite alternate;
}

/* Family: Mint Waves */
.bg--mint .bg__grad { background-image: linear-gradient(135deg, #F1FBF7, #E4F7EF, #D6F2E8); }
.bg--mint .wave.w1 { bottom: -6%; background: var(--mint); }
.bg--mint .wave.w2 { bottom: -14%; background: var(--aqua); opacity: 0.35; }

/* Family: Aqua Bubbles */
.bg--aqua .bg__grad { background-image: linear-gradient(135deg, #EAFAFC, #DBF4F8, #CFF0F5); }

/* Family: Coral Paper Shapes */
.bg--coral .bg__grad { background-image: linear-gradient(135deg, #FFF6F1, #FFEFE9, #FCEAF0); }

/* Family: Yellow Sparkles */
.bg--yellow .bg__grad { background-image: linear-gradient(135deg, #FFFCEF, #FFF7E0, #FFF2D2); }

/* Family: Purple Clouds */
.bg--purple .bg__grad { background-image: linear-gradient(135deg, #F6F3FE, #EFEAFC, #F3ECFA); }

/* ---------- background keyframes ---------- */
@keyframes gradShift { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
@keyframes drift {
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(22px, -18px) scale(1.05); }
}
@keyframes tilt {
  0%   { transform: rotate(-3deg); }
  100% { transform: rotate(4deg); }
}
@keyframes floaty {
  0%   { transform: translateY(0) rotate(-2deg); }
  100% { transform: translateY(-16px) rotate(3deg); }
}
@keyframes floatUp {
  0%   { transform: translate(0, 0); opacity: 0.15; }
  50%  { opacity: 0.7; }
  100% { transform: translate(16px, -46px); opacity: 0.1; }
}
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.7); }
  50%      { opacity: 0.9; transform: scale(1.1); }
}
@keyframes waveShift {
  0%   { transform: translateX(0); }
  100% { transform: translateX(30px); }
}

/* ============================================================
   TYPOGRAPHY HELPERS
   ============================================================ */
.title      { font-size: clamp(2.4rem, 4.4vw, 4.8rem); font-weight: 800; line-height: 1.06; letter-spacing: -0.01em; }
.heading    { font-size: clamp(2.25rem, 4vw, 4.5rem); font-weight: 800; line-height: 1.08; }
.question   { font-size: clamp(2rem, 3.4vw, 3.6rem);  font-weight: 700; line-height: 1.12; }
.keystmt    { font-size: clamp(2.2rem, 4.2vw, 4.8rem); font-weight: 800; line-height: 1.08; }
.support    { font-size: clamp(1.2rem, 1.7vw, 1.65rem); font-weight: 500; line-height: 1.3; }
.choicelbl  { font-size: clamp(1.1rem, 1.5vw, 1.45rem); font-weight: 700; line-height: 1.15; }
.btnlbl     { font-size: clamp(1rem, 1.25vw, 1.25rem); font-weight: 700; }

/* Keep large text legible even when it sits over a coloured blob or wash:
   a soft light halo separates dark text from mid-tone decoration. */
.title, .heading, .question, .keystmt, .bigline, .fn-label, .cmp-cap {
  text-shadow: 0 1px 2px rgba(255, 253, 248, 0.75), 0 0 1px rgba(255, 253, 248, 0.6);
}
.eyebrow, .ai-name, .ask-who, .game-meta, .pv-label { text-shadow: none; }

.tx-teal { color: var(--teal); }
.tx-coral { color: var(--coral); }
.tx-purple { color: #7d63d8; }
.tx-white { color: #fff; }

.eyebrow {
  display: inline-block;
  font-weight: 800;
  font-size: clamp(0.8rem, 1vw, 1.05rem);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(255,255,255,0.7);
  padding: 7px 16px;
  border-radius: 999px;
  box-shadow: var(--shadow-sm);
}

/* ============================================================
   LAYOUT FAMILIES
   ============================================================ */
.layout {
  position: relative;
  z-index: 2;
  flex: 1 1 auto;
  display: grid;
  gap: var(--space-lg);
  align-items: center;
  min-height: 0;
}

/* 1. Cover split */
.l-cover { grid-template-columns: 42% 1fr; }
.l-cover .cover-text { display: flex; flex-direction: column; gap: var(--space-sm); }

/* 2. Story split */
.l-story { grid-template-columns: 46% 1fr; }
.l-story.rev { grid-template-columns: 1fr 46%; }

/* 3. Single focus */
.l-single { grid-template-columns: 1fr; place-items: center; text-align: center; }

/* 4. Three character cards */
.l-three { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; min-height: 0; }

/* 5. Two-choice board */
.l-twochoice { grid-template-rows: auto auto; place-content: center; }

/* 6. Choice grid */
/* Rows are sized to the cards themselves (min-content) and the whole block is
   centred, so two rows can never overlap. The image area has a capped, viewport
   -relative height so photos scale down and two rows always fit the stage. */
.l-grid6 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-rows: min-content;
  align-content: center;
  align-items: stretch;
  gap: var(--space-md) var(--space-lg);
  min-height: 0;
}
.l-grid6 .choicecard { min-height: 0; }
.l-grid6 .cc-img { flex: 0 0 auto; height: clamp(72px, 14vh, 165px); }

/* 7. Build view */
.l-build { grid-template-columns: 1fr 38%; }

/* 8. Calm reflection */
.l-reflect { grid-template-columns: 1fr; place-items: center; text-align: center; max-width: min(90%, 1000px); margin: 0 auto; }

@media (max-width: 1024px) {
  .l-build { grid-template-columns: 1fr; grid-auto-rows: min-content; align-content: start; overflow-y: auto; }
}

/* ============================================================
   REUSABLE PIECES
   ============================================================ */

/* Soft color panel / board */
.panel {
  background: rgba(255, 255, 255, 0.92);
  border-radius: var(--r-lg);
  padding: clamp(24px, 3.4vw, 56px);
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(4px);
}
.panel--accent {
  background: color-mix(in srgb, var(--accent) 20%, #fff);
}

/* Hero illustration wrapper */
.hero {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  min-height: 0;
}
.hero img { object-fit: contain; }

.img-cover    {
  max-height: 60vh; max-width: 100%;
  /* Feather all four edges evenly (~10%) so the illustration melts into the
     background instead of showing a hard rectangular border. Two linear
     gradients intersected = a soft rectangular vignette. */
  -webkit-mask-image:
    linear-gradient(to right, transparent 0%, #000 11%, #000 89%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image:
    linear-gradient(to right, transparent 0%, #000 11%, #000 89%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
  mask-composite: intersect;
}
.img-story    { max-height: 54vh; max-width: 100%; filter: drop-shadow(0 20px 30px rgba(23,50,77,0.16)); }
.img-partner  { max-height: 50vh; max-width: 100%; filter: drop-shadow(0 20px 30px rgba(23,50,77,0.16)); }
.img-choice   { max-height: 24vh; }

/* Image placeholder card (missing image) */
.img-fallback {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  background: repeating-linear-gradient(45deg, #fff, #fff 14px, #F1FBF7 14px, #F1FBF7 28px);
  border: 3px dashed color-mix(in srgb, var(--accent) 55%, #fff);
  border-radius: var(--r-md);
  color: var(--navy);
  padding: clamp(10px, 1.4vw, 22px);
  min-height: 90px;
  width: 100%;
  height: 100%;
}
.img-fallback .fb-emoji { font-size: clamp(2rem, 4vw, 3.4rem); }
.img-fallback .fb-name {
  font-weight: 700;
  font-size: clamp(0.8rem, 1vw, 1rem);
  word-break: break-all;
  color: #5b6b7a;
  background: #fff;
  padding: 4px 10px;
  border-radius: 8px;
}

/* Big button */
.btn {
  font-family: var(--font);
  font-weight: 800;
  font-size: clamp(1.05rem, 1.5vw, 1.4rem);
  border: none;
  cursor: pointer;
  border-radius: var(--r-md);
  padding: clamp(14px, 1.4vw, 20px) clamp(26px, 3vw, 46px);
  min-height: 56px;
  color: #fff;
  background: linear-gradient(135deg, var(--teal), var(--aqua));
  box-shadow: var(--shadow-md);
  transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.btn:hover { transform: translateY(-3px); filter: brightness(1.04); }
.btn:active { transform: translateY(-1px); }
.btn:focus-visible { outline: 4px solid var(--navy); outline-offset: 3px; }
.btn--pulse { animation: pulseOnce 1s ease 0.6s 1; }
@keyframes pulseOnce {
  0%,100% { transform: scale(1); }
  50%     { transform: scale(1.06); }
}

/* Choice cards */
.choicecard {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-sm);
  background: #fff;
  border: 4px solid transparent;
  border-radius: var(--r-lg);
  padding: clamp(14px, 1.6vw, 24px);
  cursor: pointer;
  box-shadow: var(--shadow-md);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  min-height: 180px;
  text-align: center;
  font-family: var(--font);
  color: var(--navy);
  overflow: hidden; /* keep image inside the card, never over the label */
}
.choicecard:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.choicecard:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
.choicecard .cc-img {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 0;
  overflow: hidden;
}
.choicecard .cc-img img { max-height: 100%; max-width: 100%; object-fit: contain; display: block; }
.choicecard .cc-label { flex: 0 0 auto; font-weight: 700; font-size: clamp(1.1rem, 1.5vw, 1.45rem); }
.choicecard .cc-clue {
  flex: 0 0 auto;
  font-weight: 600;
  font-size: clamp(0.85rem, 1.1vw, 1.05rem);
  color: #5b6b7a;
  line-height: 1.2;
}
.choicecard.is-selected {
  border-color: var(--accent);
  transform: translateY(-8px) scale(1.03);
  box-shadow: 0 26px 54px color-mix(in srgb, var(--accent) 30%, transparent);
  z-index: 2;
}
.choicecard .cc-check {
  position: absolute;
  top: 10px; right: 10px;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: none;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  box-shadow: var(--shadow-sm);
}
.choicecard.is-selected .cc-check { display: flex; }

.l-three .choicecard { min-height: 40vh; }
.l-three .cc-img { flex: 0 0 68%; }

/* Chips (problem type / helper action / examples) */
.chips { display: flex; flex-wrap: wrap; gap: var(--space-sm); justify-content: center; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 3px solid color-mix(in srgb, var(--accent) 30%, #fff);
  border-radius: 999px;
  padding: 12px 22px;
  min-height: 54px;
  font-family: var(--font);
  font-weight: 700;
  font-size: clamp(1rem, 1.35vw, 1.3rem);
  color: var(--navy);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
}
.chip:hover { transform: translateY(-3px); }
.chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.chip .chip-ico { font-size: 1.3em; }
.chip.is-selected {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  transform: translateY(-3px) scale(1.03);
}

/* Two big answer buttons */
.answers {
  display: flex;
  gap: var(--space-md);
  justify-content: center;
  flex-wrap: wrap;
  margin-top: var(--space-md);
}
.answer {
  flex: 1 1 200px;
  max-width: 320px;
  min-height: 96px;
  border: 4px solid #fff;
  border-radius: var(--r-lg);
  background: #fff;
  cursor: pointer;
  font-family: var(--font);
  font-weight: 800;
  font-size: clamp(1.3rem, 2.2vw, 2rem);
  color: var(--navy);
  box-shadow: var(--shadow-md);
  transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.answer:hover { transform: translateY(-4px); }
.answer:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
.answer.pick-a { border-color: color-mix(in srgb, var(--accent) 55%, #fff); }
.answer.pick-b { border-color: color-mix(in srgb, var(--accent-2) 55%, #fff); }
.answer.is-chosen { transform: translateY(-4px) scale(1.02); }
.answer.correct { background: color-mix(in srgb, var(--teal) 18%, #fff); border-color: var(--teal); }
.answer.soft    { background: color-mix(in srgb, var(--yellow) 26%, #fff); border-color: var(--yellow); }
.answer:disabled { opacity: 0.55; cursor: default; transform: none; }
.answers--compact .answer {
  min-height: 62px;
  font-size: clamp(1.05rem, 1.5vw, 1.4rem);
  flex: 1 1 120px;
  border-radius: var(--r-md);
}

/* Feedback bubble */
.feedback {
  margin-top: var(--space-md);
  background: color-mix(in srgb, var(--accent) 14%, #fff);
  border-left: 8px solid var(--accent);
  border-radius: var(--r-md);
  padding: clamp(14px, 1.6vw, 24px) clamp(18px, 2vw, 30px);
  font-weight: 600;
  font-size: clamp(1.1rem, 1.6vw, 1.5rem);
  color: var(--navy);
  max-width: 760px;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.feedback.show { opacity: 1; transform: translateY(0); }
.feedback .fb-ico { margin-right: 10px; }

/* Speech bubble */
.speech {
  position: relative;
  background: #fff;
  border-radius: var(--r-lg);
  padding: clamp(26px, 3.4vw, 52px);
  box-shadow: var(--shadow-md);
  font-weight: 700;
  color: var(--navy);
}
.speech::after {
  content: "";
  position: absolute;
  left: -26px;
  top: 50%;
  transform: translateY(-50%);
  border: 20px solid transparent;
  border-right-color: #fff;
  filter: drop-shadow(-4px 0 4px rgba(23,50,77,0.06));
}

/* Objects (tappable) */
.objects { display: flex; gap: var(--space-md); flex-wrap: wrap; justify-content: center; }
.object {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: #fff;
  border: 4px solid transparent;
  border-radius: var(--r-md);
  padding: 14px 18px;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  font-family: var(--font);
  font-weight: 700;
  font-size: clamp(0.95rem, 1.2vw, 1.2rem);
  color: var(--navy);
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.object .obj-emoji { font-size: clamp(3rem, 5vw, 5rem); line-height: 1; }
.object:hover { transform: translateY(-4px); }
.object:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
.object.is-tapped { border-color: var(--teal); transform: translateY(-6px) scale(1.04); }
.object.fly { animation: flyToBag 0.7s cubic-bezier(0.3,0.8,0.3,1) forwards; }
@keyframes flyToBag {
  to { transform: translate(var(--fx, 0), var(--fy, -80px)) scale(0.4); opacity: 0.25; }
}

/* Fact cards (Mia scene) */
.facts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; }
.factcard {
  background: #fff;
  border-radius: 12px;
  height: clamp(48px, 7vh, 74px);
  box-shadow: var(--shadow-sm);
  opacity: 0;
  transform: scale(0.7) translateY(10px);
  animation: factPop 0.45s ease forwards;
  display: flex; align-items: center; justify-content: center;
  color: #b7c2cc; font-weight: 800; font-size: 0.9rem;
}
@keyframes factPop { to { opacity: 1; transform: scale(1) translateY(0); } }

/* Flow: Person -> Problem -> Helper */
.flow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(12px, 2vw, 34px);
  flex-wrap: wrap;
}
.flow__node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: clamp(18px, 2.4vw, 36px);
  box-shadow: var(--shadow-md);
  min-width: clamp(150px, 18vw, 230px);
  opacity: 0;
  transform: translateY(16px);
  animation: flowIn 0.5s ease forwards;
}
.flow__node .fn-emoji { font-size: clamp(2.2rem, 4vw, 3.6rem); }
.flow__node .fn-label { font-weight: 800; font-size: clamp(1rem, 1.6vw, 1.5rem); }
.flow__arrow {
  font-size: clamp(2rem, 4vw, 3.6rem);
  color: var(--accent);
  opacity: 0;
  animation: flowIn 0.5s ease forwards;
}
@keyframes flowIn { to { opacity: 1; transform: translateY(0); } }

/* Compare panels (Mia needed / helper gave) */
.compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--space-md); align-items: stretch; width: 100%; }
.compare .cmp {
  border-radius: var(--r-lg);
  padding: clamp(12px, 1.5vw, 22px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  box-shadow: var(--shadow-md);
}
.compare .cmp .cmp-emoji { font-size: clamp(2.2rem, 4vw, 3.4rem); }
.compare .cmp .cmp-cap { font-weight: 700; font-size: clamp(1rem, 1.4vw, 1.4rem); }
.compare .cmp.need { background: color-mix(in srgb, var(--teal) 16%, #fff); }
.compare .cmp.gave { background: color-mix(in srgb, var(--coral) 18%, #fff); }
.compare .cmp-vs { align-self: center; font-weight: 900; font-size: clamp(1.4rem, 2.4vw, 2.4rem); color: var(--navy); }

/* ============================================================
   HELPER IDEA CARD (project preview + final)
   ============================================================ */
.helpercard {
  --card-accent: var(--teal);
  position: relative;
  background: linear-gradient(160deg, #ffffff, #FBFDFF);
  border-radius: var(--r-lg);
  padding: clamp(18px, 2vw, 30px);
  box-shadow: var(--shadow-lg);
  border: 3px solid color-mix(in srgb, var(--card-accent) 30%, #fff);
  width: 100%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}
.helpercard__title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: clamp(1.2rem, 1.8vw, 1.7rem);
  color: var(--navy);
  padding-bottom: 8px;
  border-bottom: 3px dashed color-mix(in srgb, var(--card-accent) 40%, #fff);
}
.helpercard__title .hc-star { color: var(--yellow); }
.hc-row {
  background: #fff;
  border-radius: var(--r-md);
  padding: clamp(12px, 1.4vw, 18px);
  box-shadow: var(--shadow-sm);
  opacity: 0.55;
  transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
}
.hc-row.filled { opacity: 1; }
.hc-row .hc-lead { font-weight: 700; font-size: clamp(0.9rem, 1.1vw, 1.1rem); color: var(--card-accent); }
.hc-row .hc-val { font-weight: 700; font-size: clamp(1rem, 1.4vw, 1.35rem); color: var(--navy); margin-top: 4px; min-height: 1.4em; }
.hc-row .hc-emoji { font-size: 1.6em; }
.hc-row.pop { animation: rowPop 0.5s ease; }
@keyframes rowPop {
  0% { transform: scale(0.9); box-shadow: 0 0 0 rgba(0,0,0,0); }
  50% { transform: scale(1.03); box-shadow: 0 14px 30px rgba(30,175,161,0.25); }
  100% { transform: scale(1); }
}
.helpercard.mini { max-width: 340px; transform: scale(0.92); }
.helpercard.big { max-width: 520px; }

/* Build preview panel */
.preview-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-sm);
}
.preview-wrap .pv-label {
  font-weight: 800;
  color: var(--accent);
  font-size: clamp(0.85rem, 1vw, 1.05rem);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* Input field */
.field-wrap { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: var(--space-sm); }
.field-lead { font-weight: 700; font-size: clamp(1.2rem, 1.8vw, 1.7rem); color: var(--navy); }
.bigfield {
  width: 100%;
  font-family: var(--font);
  font-weight: 600;
  font-size: clamp(1.2rem, 1.8vw, 1.7rem);
  color: var(--navy);
  border: 4px solid color-mix(in srgb, var(--accent) 40%, #fff);
  border-radius: var(--r-md);
  padding: clamp(16px, 1.8vw, 26px);
  background: #fff;
  box-shadow: var(--shadow-sm);
  resize: none;
  min-height: clamp(80px, 12vh, 140px);
}
.bigfield:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
.charcount { font-size: 0.9rem; font-weight: 700; color: #8494a2; align-self: flex-end; }

/* Morph compare (make it small) */
.morph { display: flex; flex-direction: column; align-items: center; gap: var(--space-md); width: 100%; }
.morph .m-big {
  background: color-mix(in srgb, var(--coral) 16%, #fff);
  border-radius: var(--r-lg);
  padding: clamp(18px, 2.4vw, 40px);
  font-weight: 800;
  font-size: clamp(1.6rem, 3vw, 2.8rem);
  color: var(--navy);
  box-shadow: var(--shadow-md);
  text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, var(--coral) 70%, #fff);
  opacity: 0.85;
}
.morph .m-arrow { font-size: clamp(2rem, 3.4vw, 3rem); color: var(--teal); }
.morph .m-small {
  background: color-mix(in srgb, var(--teal) 16%, #fff);
  border-radius: var(--r-lg);
  padding: clamp(20px, 2.8vw, 46px);
  font-weight: 800;
  font-size: clamp(1.9rem, 3.6vw, 3.4rem);
  color: var(--navy);
  box-shadow: var(--shadow-lg);
  border: 3px solid var(--teal);
}

/* Checklist final check */
.check-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-md);
}
.check-emoji {
  font-size: clamp(4rem, 10vw, 9rem);
  filter: drop-shadow(0 14px 22px rgba(23,50,77,0.18));
}

/* Core message big lines */
.bigline {
  font-size: clamp(2.4rem, 6vw, 6rem);
  font-weight: 800;
  line-height: 1.02;
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.bigline.show { opacity: 1; transform: translateY(0); }
.bigline.l1 { color: var(--teal); }
.bigline.l2 { color: var(--coral); }
.bigline.l3 { color: #7d63d8; }
.bigicons { display: flex; gap: var(--space-lg); justify-content: center; margin-top: var(--space-md); }
.bigicons .bi { font-size: clamp(3rem, 6vw, 5.5rem); opacity: 0; transform: scale(0.6); transition: opacity 0.5s ease, transform 0.5s ease; }
.bigicons .bi.show { opacity: 1; transform: scale(1); }

/* Module session progress line (closing) */
.session-track {
  display: flex;
  align-items: center;
  gap: 6px;
  width: min(80%, 700px);
  margin: var(--space-md) auto 0;
}
.session-node {
  flex: 0 0 auto;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--mint);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: #9fb3ad;
  font-size: 0.9rem;
}
.session-node.done { background: var(--teal); border-color: var(--teal); color: #fff; }
.session-node.active { background: var(--yellow); border-color: var(--yellow); color: var(--navy); animation: pulseOnce 1.4s ease infinite; }
.session-line { flex: 1 1 auto; height: 6px; border-radius: 999px; background: var(--mint); overflow: hidden; }
.session-line .sl-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--aqua)); transition: width 1.2s ease; }

/* Confetti */
.confetti-piece {
  position: absolute;
  width: 12px; height: 16px;
  top: -20px;
  border-radius: 3px;
  animation: fall linear forwards;
  z-index: 30;
}
@keyframes fall {
  to { transform: translateY(120vh) rotate(720deg); opacity: 0.9; }
}

/* Optional visual timer */
.timer {
  display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,0.8);
  border-radius: 999px;
  padding: 10px 20px;
  box-shadow: var(--shadow-sm);
  font-weight: 800;
  color: var(--navy);
  width: fit-content;
}
.timer .ring {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 5px solid var(--mint);
  border-top-color: var(--teal);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   OBJECTIVES (combined, staged reveal)
   ============================================================ */
.obj-heading {
  font-weight: 800;
  font-size: clamp(1.4rem, 2.8vw, 2.6rem);
  line-height: 1.12;
  color: var(--navy);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  text-shadow: 0 1px 2px rgba(255, 253, 248, 0.75), 0 0 1px rgba(255, 253, 248, 0.6);
}
.obj-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-md);
  width: 100%;
}
@media (max-width: 680px) { .obj-list { grid-template-columns: 1fr; } }
.obj-card {
  position: relative;
  background: rgba(255, 255, 255, 0.85);
  border-radius: var(--r-lg);
  padding: clamp(22px, 2.8vw, 44px) clamp(18px, 2vw, 30px);
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
  border-top: 10px solid var(--teal);
  opacity: 0;
  transform: translateY(30px) scale(0.92);
  transition: opacity 0.55s ease, transform 0.55s cubic-bezier(.22,.61,.36,1);
}
.obj-card.show { opacity: 1; transform: none; }
.obj-card:nth-child(1) { border-top-color: var(--teal); }
.obj-card:nth-child(2) { border-top-color: var(--aqua); }
.obj-card:nth-child(3) { border-top-color: #E8C455; }
.obj-num {
  width: 52px; height: 52px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1.4rem; color: #fff;
  box-shadow: var(--shadow-sm);
}
.obj-card:nth-child(1) .obj-num { background: var(--teal); }
.obj-card:nth-child(2) .obj-num { background: var(--aqua); }
.obj-card:nth-child(3) .obj-num { background: #E8C455; color: var(--navy); }
.obj-ico { font-size: clamp(2.8rem, 5.5vw, 4.8rem); line-height: 1; }
.obj-text { font-weight: 700; font-size: clamp(1.2rem, 1.8vw, 1.75rem); color: var(--navy); line-height: 1.15; }
.obj-check {
  position: absolute; top: -14px; right: -12px;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--teal); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; box-shadow: var(--shadow-sm);
  opacity: 0; transform: scale(0.4);
  transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.34,1.56,.64,1);
}
.obj-card.show .obj-check { opacity: 1; transform: scale(1); transition-delay: 0.35s; }

/* ============================================================
   AI HELPER avatar / reply (clarity: this is the AI answering)
   ============================================================ */
.ai-line { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.ai-avatar {
  width: clamp(46px, 5vw, 64px); height: clamp(46px, 5vw, 64px);
  border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--sky));
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(1.6rem, 3vw, 2.4rem);
  box-shadow: var(--shadow-sm);
  flex: 0 0 auto;
}
.ai-name { font-weight: 800; color: #7d63d8; font-size: clamp(1rem, 1.3vw, 1.3rem); }
.ai-panel {
  position: relative;
  background: #fff;
  border-radius: var(--r-lg);
  border-left: 8px solid var(--purple);
  padding: clamp(16px, 2vw, 28px);
  box-shadow: var(--shadow-md);
}
.ask-bubble {
  display: inline-block;
  background: color-mix(in srgb, var(--coral) 20%, #fff);
  border-radius: 20px 20px 20px 6px;
  padding: clamp(12px, 1.6vw, 22px) clamp(16px, 2vw, 26px);
  font-weight: 700;
  color: var(--navy);
  box-shadow: var(--shadow-sm);
}
.ask-who { font-weight: 800; color: var(--coral); font-size: clamp(0.85rem, 1vw, 1.05rem); display: block; margin-bottom: 4px; }

/* ============================================================
   PROBLEM-OR-IDEA GAME (multi-round in one scene)
   ============================================================ */
.game-meta { font-weight: 800; color: var(--accent); letter-spacing: 0.05em; text-transform: uppercase; font-size: clamp(0.85rem, 1vw, 1.05rem); }
.game-dots { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
.game-dot { width: 14px; height: 14px; border-radius: 50%; background: #d7e7e1; transition: background 0.3s ease, transform 0.3s ease; }
.game-dot.active { background: var(--accent); transform: scale(1.25); }
.game-dot.done { background: var(--teal); }

/* "My own idea" custom input (revealed on demand) */
.own-input {
  width: 100%;
  margin-top: var(--space-sm);
  display: none;
  flex-direction: column;
  gap: 8px;
  animation: ownReveal 0.4s ease;
}
.own-input.show { display: flex; }
.own-input label { font-weight: 700; color: var(--accent); font-size: clamp(1rem, 1.3vw, 1.2rem); }
@keyframes ownReveal { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ============================================================
   NAVIGATION
   ============================================================ */
.nav {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  padding: clamp(6px, 1vh, 12px) clamp(8px, 1.4vw, 22px);
  z-index: 5;
}
/* bottom-left cluster: trademark logo + Back */
.nav__cluster {
  display: flex;
  align-items: center;
  gap: clamp(10px, 1.4vw, 20px);
}
.brandmark {
  /* proportional: native art is 1493×283 (≈5.3:1); size by height, width auto */
  height: clamp(20px, 3vh, 34px);
  width: auto;
  display: block;
  opacity: 0.9;
  user-select: none;
  -webkit-user-drag: none;
}
@media (max-width: 760px) { .brandmark { display: none; } } /* keep controls roomy on small screens */
.nav__btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: none;
  cursor: pointer;
  font-family: var(--font);
  font-weight: 800;
  font-size: clamp(1rem, 1.25vw, 1.25rem);
  height: 60px;
  min-width: 130px;
  padding: 0 26px;
  border-radius: 22px;
  box-shadow: var(--shadow-md);
  transition: transform 0.16s ease, filter 0.16s ease, box-shadow 0.16s ease;
}
.nav__btn:hover { transform: translateY(-3px); }
.nav__btn:focus-visible { outline: 4px solid var(--navy); outline-offset: 3px; }
.nav__btn--back { background: #EAF3F0; color: var(--navy); }
.nav__btn--next { background: linear-gradient(135deg, var(--teal), var(--aqua)); color: #fff; }
.nav__btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.nav__progress { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 560px; }
.nav__part { font-weight: 800; font-size: clamp(0.8rem, 0.95vw, 1rem); color: var(--teal); letter-spacing: 0.04em; }
.nav__count { font-weight: 700; font-size: clamp(0.75rem, 0.85vw, 0.9rem); color: #7d8b98; }
.progress { width: 100%; height: 10px; border-radius: 999px; background: #DFF0EA; overflow: hidden; }
.progress__fill { height: 100%; width: 2%; border-radius: 999px; background: linear-gradient(90deg, var(--teal), var(--aqua)); transition: width 0.5s ease; }

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  .scene { transition: opacity 0.2s ease !important; transform: none !important; }
}
body.reduce-motion .bg__grad,
body.reduce-motion .blob,
body.reduce-motion .shape,
body.reduce-motion .paper,
body.reduce-motion .dot,
body.reduce-motion .spark,
body.reduce-motion .wave,
body.reduce-motion .session-node.active,
body.reduce-motion .btn--pulse,
body.reduce-motion .timer .ring {
  animation: none !important;
}
body.reduce-motion .scene {
  transition: opacity 0.2s ease !important;
  transform: none !important;
}
body.reduce-motion .confetti-piece { display: none; }

/* small helpers */
.stack { display: flex; flex-direction: column; gap: var(--space-md); }
.center { text-align: center; }
.wrapmax { max-width: min(88vw, 1100px); margin: 0 auto; }
.grow { flex: 1 1 auto; }
.row { display: flex; gap: var(--space-md); align-items: center; }
.rowc { display: flex; gap: var(--space-md); align-items: center; justify-content: center; flex-wrap: wrap; }

/* ============================================================
   SESSION-1 UPDATE — new knowledge scenes
   ============================================================ */

/* Teacher note (secondary, never the main student text) */
.teacher-note {
  margin-top: var(--space-sm);
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(23,50,77,0.05);
  border: 2px dashed rgba(23,50,77,0.20);
  color: #5b6b7a; font-weight: 600;
  font-size: clamp(0.78rem, 0.95vw, 0.98rem);
  padding: 7px 15px; border-radius: 14px;
  max-width: 90%;
}
.teacher-note b { color: var(--navy); }

/* ---- NEW 1: An AI helper can… (2×2 board) ---- */
.aihelp-board {
  background: rgba(255,255,255,0.94);
  border-radius: var(--r-xl);
  padding: clamp(14px, 2vw, 30px);
  box-shadow: var(--shadow-md);
  width: 100%;
}
.aihelp-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: clamp(10px, 1.6vw, 22px);
}
@media (max-width: 680px) { .aihelp-grid { grid-template-columns: 1fr; } }
.aihelp-card {
  display: flex; align-items: center; gap: clamp(12px, 1.6vw, 22px);
  background: #fff; border-radius: var(--r-lg);
  padding: clamp(10px, 1.4vw, 18px);
  box-shadow: var(--shadow-sm);
  border-left: 8px solid var(--accent);
  opacity: 0; transform: translateY(16px) scale(.96);
  transition: opacity .5s ease, transform .5s cubic-bezier(.22,.61,.36,1);
}
.aihelp-card.show { opacity: 1; transform: none; }
.aihelp-card:nth-child(1) { border-left-color: var(--teal); }
.aihelp-card:nth-child(2) { border-left-color: var(--aqua); }
.aihelp-card:nth-child(3) { border-left-color: #E8C455; }
.aihelp-card:nth-child(4) { border-left-color: var(--coral); }
.aihelp-viz { flex: 0 0 auto; width: clamp(60px, 7vw, 92px); height: clamp(60px, 7vw, 92px); display: flex; align-items: center; justify-content: center; }
.aihelp-label { font-weight: 800; font-size: clamp(1.05rem, 1.6vw, 1.55rem); color: var(--navy); }
.aihelp-closing { font-weight: 800; font-size: clamp(1.2rem, 2.2vw, 2rem); color: var(--navy); opacity: 0; transform: translateY(10px); transition: opacity .6s ease, transform .6s ease; }
.aihelp-closing.show { opacity: 1; transform: none; }

/* mini viz: checklist */
.viz-check { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px; justify-content: center; }

.viz-check .vc-box::after { content: "✓"; position: absolute; inset: -2px; display: flex; align-items: center; justify-content: center; color: var(--teal); font-weight: 900; font-size: 13px; opacity: 0; transform: scale(.4); }
.aihelp-card.show .viz-check .vc-row:nth-child(1) .vc-box::after { animation: vcCheck .4s ease forwards .1s; }
.aihelp-card.show .viz-check .vc-row:nth-child(2) .vc-box::after { animation: vcCheck .4s ease forwards .3s; }
.aihelp-card.show .viz-check .vc-row:nth-child(3) .vc-box::after { animation: vcCheck .4s ease forwards .5s; }
.viz-check .vc-bar { height: 7px; border-radius: 5px; background: #e3edf0; flex: 1; }
@keyframes vcCheck { to { opacity: 1; transform: scale(1); } }

/* mini viz: question flip */

@keyframes vqFlip { 0%, 45% { transform: rotateY(0); } 55%, 100% { transform: rotateY(180deg); } }

/* mini viz: stepping stones */
.viz-steps { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 7px; }
.viz-steps .vs { width: clamp(14px, 1.6vw, 22px); border-radius: 8px 8px 4px 4px; opacity: 0; transform: translateY(10px); }

.aihelp-card.show .viz-steps .vs:nth-child(2) { animation: vsUp .4s ease forwards .3s; }
.aihelp-card.show .viz-steps .vs:nth-child(3) { animation: vsUp .4s ease forwards .5s; }
@keyframes vsUp { to { opacity: 1; transform: none; } }

/* mini viz: sticky notes settling into a row */

.viz-notes .vn { width: clamp(18px, 2.2vw, 28px); height: clamp(18px, 2.2vw, 28px); border-radius: 6px; box-shadow: var(--shadow-sm); }

.aihelp-card.show .viz-notes .vn { animation: vnSettle .6s ease forwards .4s; }
@keyframes vnSettle { to { transform: rotate(0) translateY(0); } }

/* ---- NEW 2: comparison paths (does not fit / fits) ---- */
.fitpaths { display: flex; flex-direction: column; gap: clamp(12px, 1.8vw, 22px); width: 100%; }
.fitpath { cursor: pointer; border: none; text-align: left; font-family: var(--font); border-radius: var(--r-lg); padding: clamp(10px, 1.4vw, 18px); background: #fff; box-shadow: var(--shadow-md); border: 4px solid transparent; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; width: 100%; }

.fitpath--bad .fp-label { background: color-mix(in srgb, var(--coral) 24%, #fff); color: #c0483a; }
.fitpath--good .fp-label { background: color-mix(in srgb, var(--teal) 22%, #fff); color: #0f7a70; }

.fp-node img { height: clamp(48px, 7vh, 84px); width: auto; max-width: 100%; object-fit: contain; }
.fp-node .fp-emoji { font-size: clamp(1.8rem, 3.2vw, 2.8rem); }

.fp-arrow { font-size: clamp(1.4rem, 2.2vw, 2.2rem); color: var(--accent); flex: 0 0 auto; }
.fitpath--bad.is-chosen { border-color: var(--coral); }
.fitpath--good.is-chosen { border-color: var(--teal); }
.fitpath--good.lit { background: color-mix(in srgb, var(--teal) 8%, #fff); box-shadow: 0 20px 44px color-mix(in srgb, var(--teal) 26%, transparent); }
.fp-answer.bounce { animation: fpBounce .7s ease; }
@keyframes fpBounce { 0% { transform: translateX(0);} 30% { transform: translateX(12px);} 60% { transform: translateX(-4px);} 100% { transform: translateX(0);} }
.fp-answer.snap { animation: fpSnap .5s ease; }
@keyframes fpSnap { 0% { transform: scale(.82);} 60% { transform: scale(1.08);} 100% { transform: scale(1);} }

/* ---- NEW 3: Match the Help ---- */
.match-board { position: relative; background: rgba(255,255,255,0.94); border-radius: var(--r-xl); padding: clamp(12px, 1.8vw, 26px); box-shadow: var(--shadow-md); width: 100%; }

.match-card .mc-ico { flex: 0 0 auto; width: clamp(44px, 5.5vh, 62px); height: clamp(44px, 5.5vh, 62px); display: flex; align-items: center; justify-content: center; }
.match-card .mc-text { display: flex; flex-direction: column; gap: 1px; }
.match-card .mc-name { font-weight: 800; font-size: clamp(0.98rem, 1.25vw, 1.2rem); }
.match-card .mc-clue { font-weight: 600; font-size: clamp(0.78rem, 1vw, 1rem); color: #5b6b7a; line-height: 1.15; }

.match-help .mh-label { font-weight: 700; font-size: clamp(0.92rem, 1.2vw, 1.18rem); }
.match-card.sel, .match-help.sel { border-color: var(--teal); transform: translateY(-2px) scale(1.02); }
.match-card.locked, .match-help.locked { border-color: var(--teal); background: color-mix(in srgb, var(--teal) 8%, #fff); cursor: default; }
.match-check { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #fff; display: none; align-items: center; justify-content: center; font-weight: 900; flex: 0 0 auto; }

.match-line { fill: none; stroke: color-mix(in srgb, var(--teal) 55%, #fff); stroke-width: 4; stroke-linecap: round; opacity: .5; transition: opacity .4s ease, stroke .4s ease; }

.match-insight { opacity: 0; transform: translateY(10px); transition: opacity .5s ease, transform .5s ease; }

/* ---- NEW 4: Help, don't take over ---- */
.hdt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 2.2vw, 30px); width: 100%; }
@media (max-width: 760px) { .hdt-grid { grid-template-columns: 1fr; } }

/* ============================================================
   DOM helper
   ============================================================ */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(kid => {
    if (kid == null || kid === false) return;
    e.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  });
  return e;
}

/* ---------- Images with graceful placeholder ---------- */
function fallbackCard(src) {
  const name = String(src).split("/").pop();
  return h("div", { class: "img-fallback", role: "img", "aria-label": "Missing image " + name },
    h("div", { class: "fb-emoji", "aria-hidden": "true" }, "🖼️"),
    h("div", {}, "Image"),
    h("div", { class: "fb-name" }, name)
  );
}
function assetImg(key, className, alt) {
  const src = IMAGE_ASSETS[key] || key;
  const img = document.createElement("img");
  img.src = src;
  img.alt = alt || "";
  if (className) img.className = className;
  img.addEventListener("error", () => {
    const fb = fallbackCard(src);
    if (className) fb.classList.add(className);
    img.replaceWith(fb);
  });
  return img;
}
function heroImg(key, cls, alt) { return h("div", { class: "hero" }, assetImg(key, cls, alt)); }

/* Preload (warm cache; errors handled per-scene) */

  } else if (family === "coral") {

    [["#FFD1C6", "14%", "26%"], ["#FFE7A6", "80%", "20%"], ["#8CCCF4", "70%", "68%"]].forEach((p, i) =>

}

/* ============================================================
   Small UI utilities
   ============================================================ */
function eyebrow(t) { return h("span", { class: "eyebrow" }, t); }

function announce(t) { const l = document.getElementById("live"); if (l) l.textContent = t; }

let audioCtx = null;
function blip(freq) {
  if (!prefs.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq || 660; o.type = "sine";
    g.gain.value = 0.06;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);
    o.stop(audioCtx.currentTime + 0.2);
  } catch (e) {}
}

function toast(text) {
  const stage = document.getElementById("stage");
  const t = h("div", {
    style: {
      position: "absolute", left: "50%", bottom: "18px", transform: "translateX(-50%)",
      background: "var(--navy)", color: "#fff", padding: "12px 22px", borderRadius: "999px",
      fontWeight: "700", boxShadow: "var(--shadow-md)", zIndex: "40", opacity: "0",
      transition: "opacity .3s ease, transform .3s ease", fontSize: "1.05rem"
    }
  }, text);
  stage.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = "1"; t.style.transform = "translateX(-50%) translateY(-6px)"; });
  setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.remove(), 320); }, 1700);
}

function feedbackBox() {
  const box = h("div", { class: "feedback", role: "status" });
  box.show = (text, icon) => {
    box.innerHTML = "";
    box.appendChild(h("span", { class: "fb-ico", "aria-hidden": "true" }, icon || "💬"));
    box.appendChild(document.createTextNode(text));
    box.classList.add("show");
    announce(text);
    blip(700);
  };
  return box;
}

/* Big helper-idea card */
function helperCardEl(opts) {

}

   ============================================================ */
function answerBtn(label, cls, onClick) {
  return h("button", { class: "answer " + (cls || ""), type: "button", onClick }, label);
}

/* Yes / Maybe / Not sure check with one warm reasoning feedback */
function checkBlock(question, feedbackText) {
  const fb = feedbackBox();
  const done = () => fb.show(feedbackText, "🌟");
  const board = h("div", { class: "stack center" },
    h("h2", { class: "question" }, question),
    h("div", { class: "answers" },
      answerBtn("Yes",      "pick-a", () => { markPicked(0); done(); }),
      answerBtn("Maybe",    "pick-b", () => { markPicked(1); done(); }),
      answerBtn("Not sure", "pick-a", () => { markPicked(2); done(); })
    ),
    fb
  );
  function markPicked(i) {
    board.querySelectorAll(".answer").forEach((b, idx) => b.classList.toggle("is-chosen", idx === i));
  }
  return board;
}

/* Problem-or-idea round */
function problemIdeaBlock(statement, correctIsProblem, feedbackText) {
  const fb = feedbackBox();
  const board = h("div", { class: "stack center" },
    h("div", { class: "panel panel--accent", style: { maxWidth: "820px", margin: "0 auto" } },
      h("div", { class: "keystmt", style: { fontSize: "clamp(1.8rem,3.4vw,3rem)" } }, statement)),
    h("h2", { class: "question" }, "Problem or cool idea?"),
    h("div", { class: "answers" },
      answerBtn("🧩 Problem",   "pick-a", () => pick(true)),
      answerBtn("✨ Cool Idea", "pick-b", () => pick(false))
    ),
    fb
  );
  function pick(choseProblem) {
    const right = choseProblem === correctIsProblem;
    board.querySelectorAll(".answer").forEach(b => b.classList.remove("is-chosen", "correct", "soft"));
    const btns = board.querySelectorAll(".answer");
    const clicked = choseProblem ? btns[0] : btns[1];
    clicked.classList.add("is-chosen", right ? "correct" : "soft");
    if (right) fb.show(feedbackText, "🌟");
    else fb.show("Look again. Is this the problem, or a design idea?", "🔎");
  }
  return board;
}

/* ============================================================
   Confetti
   ============================================================ */
function confetti() {
  if (prefs.reduceMotion || document.body.classList.contains("reduce-motion")) return;
  const stage = document.getElementById("stage");
  const colors = ["#1EAFA1", "#4CCFDB", "#FFD96A", "#FF8E7A", "#A995E8", "#8CCCF4"];
  for (let i = 0; i < 46; i++) {
    const c = h("div", { class: "confetti-piece", style: {
      left: (Math.random() * 100) + "%",
      background: colors[i % colors.length],
      animationDuration: (2.4 + Math.random() * 1.6) + "s",
      animationDelay: (Math.random() * 0.5) + "s",
      transform: "rotate(" + (Math.random() * 360) + "deg)"
    } });
    stage.appendChild(c);
    setTimeout(() => c.remove(), 4600);
  }
}

/* ============================================================
   Scene engine + navigation
   ============================================================ */
let current = 0;
const stage = document.getElementById("stage");

function partName(n) { for (const p of PARTS) if (n <= p.end) return p.name; return ""; }

function renderScene(index, dir) {
  const def = SCENES[index];
  const scene = h("div", { class: "scene " + (dir === "back" ? "enter-left" : "enter-right") });
  scene.style.setProperty("--accent", def.accents[0]);
  scene.style.setProperty("--accent-2", def.accents[1]);
  scene.style.setProperty("--accent-3", def.accents[2]);
  scene.appendChild(makeBg(def.bg));
  const content = h("div", { class: "scene__content" });
  scene.appendChild(content);
  def.build(content);

  const prev = stage.querySelector(".scene.is-active");
  stage.appendChild(scene);
  requestAnimationFrame(() => {
    scene.classList.remove("enter-left", "enter-right");
    scene.classList.add("is-active");
    if (prev) {
      prev.classList.remove("is-active");
      prev.classList.add(dir === "back" ? "leave-right" : "leave-left");
      setTimeout(() => prev.remove(), 620);
    }
  });
  updateNav();
}

function updateNav() {
  const n = current + 1, total = SCENES.length;
  document.getElementById("sceneCount").textContent = n + " / " + total;
  document.getElementById("partLabel").textContent = partName(n);
  document.getElementById("progressFill").style.width = Math.max(2, (n / total) * 100) + "%";
  document.getElementById("btnBack").disabled = current === 0;
  document.getElementById("btnNext").disabled = current === total - 1;
}

function go(index, dir) {
  index = Math.max(0, Math.min(SCENES.length - 1, index));
  if (index === current && stage.querySelector(".scene")) return;
  const direction = dir || (index < current ? "back" : "forward");
  current = index;
  renderScene(index, direction);
}
function next() { if (current < SCENES.length - 1) go(current + 1, "forward"); }
function back() { if (current > 0) go(current - 1, "back"); }

/* ---------- wire controls ---------- */
document.getElementById("btnNext").addEventListener("click", next);
document.getElementById("btnBack").addEventListener("click", back);

document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "TEXTAREA" || tag === "INPUT") return;
  if (e.key === "ArrowRight") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
});

/* toolbar */
const btnSound = document.getElementById("btnSound");
const btnMotion = document.getElementById("btnMotion");
btnSound.addEventListener("click", () => {
  prefs.sound = !prefs.sound; savePrefs();
  btnSound.setAttribute("aria-pressed", prefs.sound ? "true" : "false");
  btnSound.querySelector(".tool__icon").textContent = prefs.sound ? "🔊" : "🔈";
  if (prefs.sound) blip(760);
});
btnMotion.addEventListener("click", () => {
  prefs.reduceMotion = !prefs.reduceMotion; savePrefs();
  applyMotion();
});
function applyMotion() {
  document.body.classList.toggle("reduce-motion", prefs.reduceMotion);
  btnMotion.setAttribute("aria-pressed", prefs.reduceMotion ? "true" : "false");
  btnMotion.querySelector(".tool__text").textContent = prefs.reduceMotion ? "Calm ✓" : "Calm";
}
document.getElementById("btnReset").addEventListener("click", () => {
  const ok = window.confirm("Reset the lesson and clear your Helper Idea Card?");
  if (!ok) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  state = Object.assign({}, defaultState);
  session.chosenClassmate = "";
  go(0, "back");
  toast("Lesson reset");
});
document.getElementById("btnFull").addEventListener("click", () => {
  if (!document.fullscreenElement) (document.documentElement.requestFullscreen || (() => {})).call(document.documentElement);
  else (document.exitFullscreen || (() => {})).call(document);
});

/* ---------- init ---------- */
btnSound.setAttribute("aria-pressed", prefs.sound ? "true" : "false");
btnSound.querySelector(".tool__icon").textContent = prefs.sound ? "🔊" : "🔈";
applyMotion();
/* optional deep-link: ?scene=N (1-based) for review / teacher jump */
let startIndex = 0;
try {
  const sp = new URLSearchParams(location.search).get("scene");
  if (sp) startIndex = Math.max(0, Math.min(SCENES.length - 1, parseInt(sp, 10) - 1));
} catch (e) {}
go(startIndex, "forward");

</script>
</body>
