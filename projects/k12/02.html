/* ---- 5. MISSION 1: TEAM NEEDS A GOAL (pick two -> pitch reveal + reason) ---- */
IDX.mission1 = SCENES.length;
scene({chapter:'Squad Draft', bg:'lab', build:()=>`
  <div class="lab-bg"><img src="${A('assets/squadlab-background.png')}" alt=""></div><div class="lab-veil"></div>
  <div class="lab-content">
    <div class="mission-card rv" id="m1Mission" style="max-width:min(92vw,900px);margin:0 auto">
      <img class="coach-mini" src="${A('assets/coach-cutout.png')}" alt="">
      <div class="mission-txt">
        <div class="mlabel">Coach &middot; Mission 1</div>
        <div class="mbrief" tabindex="-1">WE NEED A GOAL.</div>
        <div class="msub">Choose two players who could help the team score. Use the role and clues on each card.</div>
      </div>
    </div>
    <div id="m1Pick">
      <div class="card-row mt" id="pickCards">${PKEYS.map(k=>cardButtonHTML(k)).join('')}</div>
      <div class="stack-c"><div class="ui status-line" id="pickHint" role="status">0 of 2 selected</div>
        <p class="sim-note">Different pairs can work. Your choices should connect to the team's need.</p></div>
    </div>
    <div id="m1Result" class="hidden stack-c" style="gap:8px">
      <button type="button" class="reset-btn" id="m1Change" style="justify-self:center;color:var(--teal-bright)">&#8249; Change my pick</button>
      <p class="quest ink-invert" style="max-width:26ch;margin:0 auto">Why could this pair help the team score?</p>
      <div class="pitch" id="m1Pitch" style="width:min(70vw,560px);height:min(24vh,200px);margin:0 auto"></div>
      <div class="row-c" id="m1Chips" style="max-width:min(90vw,720px)"></div>
    </div>
  </div>`,
  enter:(r)=>{
    stagger([$('.mission-card',r)],0,120);
    $$('#pickCards .pcard',r).forEach((c,i)=>after(300+i*90,()=>c.classList.add('dealt')));
    const hint=$('#pickHint',r);
    const already = Array.isArray(state.team1) && state.team1.length===2;
    let picks = already ? [...state.team1] : [];
    const sync=(announceIt)=>{
      hint.textContent = `${picks.length} of 2 selected`;
      $$('#pickCards .pcard',r).forEach(c=>{
        const on = picks.includes(c.dataset.key);
        c.classList.toggle('picked', on);
        c.classList.toggle('dim', picks.length>=2 && !on);
        c.setAttribute('aria-pressed', on?'true':'false');
      });
      if(picks.length===2){
        state.team1=[...picks]; saveState(); unlockNext();
        showResult();
        if(announceIt) announce('2 of 2 selected. Your pair is ready.');
      }else{
        lockNext(`Choose ${2-picks.length} more player${2-picks.length===1?'':'s'} to continue.`);
        $('#m1Result',r).classList.add('hidden');
        $('#m1Pick',r).classList.remove('hidden');
        $('#m1Mission',r).classList.remove('compact');
      }
    };
    $$('#pickCards .pcard',r).forEach(c=>{
      c.addEventListener('click',()=>{
        const k=c.dataset.key;
        if(picks.includes(k)){picks.splice(picks.indexOf(k),1);}
        else{if(picks.length>=2)return;picks.push(k);}
        sync(true);
      });
    });
    function showResult(){
      $('#m1Result',r).classList.remove('hidden');
      $('#m1Pick',r).classList.add('hidden');
      $('#m1Mission',r).classList.add('compact');
      const pitch=$('#m1Pitch',r);
      pitch.innerHTML=`<div class="pitch-line" style="left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%)"></div>
        <div class="pitch-line" style="left:50%;top:50%;width:100px;height:100px;border-radius:50%;transform:translate(-50%,-50%)"></div>`;
      const slots=[{x:34,y:52},{x:66,y:44}];
      state.team1.forEach((k,i)=>{
        const s=slots[i];const t=h(`<div class="pitch-slot pitch-token" style="left:${s.x}%;top:${s.y}%">
          <img src="${PLAYERS[k].img}" alt=""><div class="pt-name">${PLAYERS[k].name}</div></div>`);
        pitch.appendChild(t);after(150+i*200,()=>t.classList.add('in'));
      });
      const chipsWrap=$('#m1Chips',r);
      const chipOptions=['Fast in the box','Clinical finishing','Creates chances','Great movement'];
      chipsWrap.innerHTML = chipOptions.map(c=>`<button type="button" class="switch-chip" data-chip="${escapeHTML(c)}" aria-pressed="false">${c}</button>`).join('');
      $$('.switch-chip',chipsWrap).forEach(chip=>{
        if(chip.dataset.chip===state.team1Reason) chip.classList.add('active');
        chip.addEventListener('click',()=>{
          $$('.switch-chip',chipsWrap).forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false');});
          chip.classList.add('active');chip.setAttribute('aria-pressed','true');
          state.team1Reason=chip.dataset.chip; saveState();
        });
      });
    }
    $('#m1Change',r).addEventListener('click',()=>{
      $('#m1Result',r).classList.add('hidden');
      $('#m1Pick',r).classList.remove('hidden');
      $('#m1Mission',r).classList.remove('compact');
      lockNext('Choose 2 players to continue.');
    });
    sync(false);
    if(already){ showResult(); unlockNext(); }
  }
});

/* ---- 6. MISSION 2: PROTECT THE LEAD (keep/swap + reason) ---- */
IDX.mission2 = SCENES.length;
scene({chapter:'Squad Draft', bg:'lab', build:()=>`
  <div class="lab-bg"><img src="${A('assets/squadlab-background.png')}" alt=""></div><div class="lab-veil"></div>
  <div class="lab-content">
    <div class="mission-card rv" id="m2Mission" style="max-width:min(92vw,900px);margin:0 auto">
      <img class="coach-mini" src="${A('assets/coach-cutout.png')}" alt="">
      <div class="mission-txt">
        <div class="mlabel">Match update &middot; Mission 2</div>
        <div class="mbrief" tabindex="-1">NOW WE'RE AHEAD.</div>
        <div class="msub">Decide whether to keep your pair or choose players who can protect the lead.</div>
      </div>
    </div>
    <div id="m2Choice" class="stack-c">
      <div class="row-c">
        <button class="btn btn-primary btn-lg" id="keepBtn">Keep the same pair</button>
        <button class="btn btn-apri btn-lg" id="swapBtn">Choose different players</button>
      </div>
    </div>
    <div id="m2Pick" class="hidden">
      <div class="card-row mt" id="swapCards">${PKEYS.map(k=>cardButtonHTML(k)).join('')}</div>
      <div class="stack-c"><div class="ui status-line" id="swapHint" role="status">0 of 2 selected</div></div>
    </div>
    <div id="m2Reason" class="hidden stack-c">
      <p class="quest ink-invert" style="max-width:28ch">Why can this pair protect the lead?</p>
      <div class="row-c" id="m2Chips" style="max-width:min(90vw,720px)"></div>
    </div>
  </div>`,
  enter:(r)=>{
    stagger([$('.mission-card',r)],0,120);
    lockNext('Decide to keep or swap your pair, then give one reason.');
    const chipOptions=['Strong defending','Good positioning','Works as a team','Reads danger early'];
    function finishReason(reason){
      state.team2Reason=reason; saveState();
      unlockNext();
      announce('Decision saved.');
    }
    function reasonUI(){
      $('#m2Pick',r).classList.add('hidden');
      $('#m2Mission',r).classList.add('compact');
      $('#m2Reason',r).classList.remove('hidden');
      const wrap=$('#m2Chips',r); wrap.innerHTML=chipOptions.map(c=>`<button type="button" class="switch-chip" data-chip="${escapeHTML(c)}" aria-pressed="false">${c}</button>`).join('');
      $$('.switch-chip',wrap).forEach(chip=>chip.addEventListener('click',()=>{
        $$('.switch-chip',wrap).forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false');});
        chip.classList.add('active');chip.setAttribute('aria-pressed','true');
        finishReason(chip.dataset.chip);
      }));
    }
    $('#keepBtn',r).addEventListener('click',()=>{
      state.team2=[...state.team1]; state.team2Decision='keep'; saveState();
      $('#m2Choice',r).classList.add('hidden');
      reasonUI();
    });
    $('#swapBtn',r).addEventListener('click',()=>{
      state.team2Decision='swap'; saveState();
      $('#m2Choice',r).classList.add('hidden');
      $('#m2Pick',r).classList.remove('hidden');
      $$('#swapCards .pcard',r).forEach((c,i)=>after(i*70,()=>c.classList.add('dealt')));
      const hint=$('#swapHint',r); let picks=[];
      $$('#swapCards .pcard',r).forEach(c=>c.addEventListener('click',()=>{
        const k=c.dataset.key;
        if(picks.includes(k)){picks.splice(picks.indexOf(k),1);}
        else{if(picks.length>=2)return;picks.push(k);}
        hint.textContent=`${picks.length} of 2 selected`;
        $$('#swapCards .pcard',r).forEach(cc=>{
          const on=picks.includes(cc.dataset.key);
          cc.classList.toggle('picked',on); cc.classList.toggle('dim',picks.length>=2&&!on);
          cc.setAttribute('aria-pressed',on?'true':'false');
        });
        if(picks.length===2){ state.team2=[...picks]; saveState(); reasonUI(); }
      }));
    });
    if(Array.isArray(state.team2) && state.team2Decision && state.team2Reason){ reasonUI(); unlockNext(); }
  }
});

      $('#mc2NameA',r).textContent=PLAYERS[a].name; $('#mc2RoleA',r).textContent=PLAYERS[a].role;

        if(v){ state.interpretEvidence={pick,evidence:custom.value,complete:true}; saveState(); unlockNext(); }
        else{ lockNext('Add one clue from the profile to finish.'); }
      });
      if(!state.interpretEvidence.evidence) lockNext('Add one clue from the profile to finish.');

    $('#mc2Change',r).addEventListener('click',()=>{

  }
});

        <div class="l-card" style="text-align:center;min-width:170px"><div class="chain-label">Team goal</div><div class="chain-val" style="font-size:var(--f-body)">Connects the team &#129309;</div></div>
        <div class="chain-arrow" style="align-self:center">&rarr;</div>
        <div class="l-card" style="text-align:center;min-width:170px;border-color:var(--apricot)"><div class="chain-label" style="color:var(--apricot)">Criteria used</div><div class="chain-val" style="font-size:var(--f-body)">Speed + Shooting</div></div>
        <div class="chain-arrow" style="align-self:center">&rarr;</div>
        <div class="l-card" style="text-align:center;min-width:170px;border-color:var(--rose)"><div class="chain-label" style="color:var(--rose)">Weights</div><div class="chain-val" style="font-size:var(--f-body)">Teamwork = 0</div></div>
      </div>
      <h3 class="quest" style="font-size:var(--f-quest)"><span style="color:#fff">THE SYSTEM FOLLOWED THE SETUP.</span></h3>
      <h3 class="quest" style="font-size:var(--f-quest)"><span class="grad-apri">THE SETUP DIDN'T FIT THE JOB.</span></h3>
      <div class="l-card" style="background:rgba(255,253,248,.97);max-width:640px;margin:0 auto;padding:clamp(12px,1.6vh,20px)">
        <p class="ui" style="font-weight:700;color:var(--ink);margin-bottom:8px">What should happen now?</p>
        <div class="row-c" id="decisionBtns">
          <button type="button" class="btn btn-primary" data-d="keep">Keep the recommendation</button>
          <button type="button" class="btn btn-apri" data-d="revise">Revise the setup</button>
          <button type="button" class="btn btn-ghost" style="color:var(--ink);border-color:var(--cream-3)" data-d="reject">Reject it for now</button>
        </div>
      </div>
    </div>
  </div>`,
  enter:(r)=>{
    stagger([$('.mission-card',r)],0,120);stagger($$('.rv',r),160,300);
    lockNext('Pick what you would check first.');
    function goReveal(){
      $('.mission-card',r).classList.add('hidden');
      $('#auditTop',r).classList.add('hidden');
      $('#auditReveal',r).classList.remove('hidden');
      let decision=state.evaluateEvidence.decision;
      $$('#decisionBtns button',r).forEach(b=>{
        b.classList.toggle('active', b.dataset.d===decision);
        if(b.dataset.d===decision) b.style.outline='3px solid var(--gold)';
        b.addEventListener('click',()=>{
          decision=b.dataset.d; state.evaluateEvidence.decision=decision; state.reviewDecision=decision;
          $$('#decisionBtns button',r).forEach(x=>x.style.outline='none');
          b.style.outline='3px solid var(--gold)';
          state.evaluateEvidence.complete=true; saveState(); unlockNext();
          announce('Evaluation saved. You can continue.');
        });
      });
      if(decision) unlockNext();
      else lockNext('Choose keep, revise, or reject.');
    }
    $$('#revChips .switch-chip',r).forEach(chip=>chip.addEventListener('click',()=>{
      $$('#revChips .switch-chip',r).forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false');});
      chip.classList.add('active'); chip.setAttribute('aria-pressed','true');
      state.evaluateEvidence.note=chip.dataset.chip; saveState();
      goReveal();
    }));
    if(state.evaluateEvidence.note && state.evaluateEvidence.decision){ goReveal(); }
  }
});

/* ---- 25. EXIT TICKET (required reflection) ---- */
IDX.exitTicket = SCENES.length;
scene({chapter:'Final Review', bg:'board', build:()=>`
  <div class="scene-inner"><div class="exit-grid">
    <div class="clip-fig-wrap" style="display:grid;place-items:center"><img class="clip-fig" src="${A('assets/review-clipboard.png')}" alt="Review clipboard"></div>
    <div class="exit-form">
      <div class="stack" style="gap:2px"><div class="eyebrow rv">Fair Play Review Board</div>
        <h2 class="title rv dly1" tabindex="-1">YOUR FINAL REVIEW</h2></div>
      <div class="checklist rv dly2" style="gap:4px">
        ${[['&#127919;','What does the team <b>need?</b>'],['&#128100;','What <b>profile</b> fits that need?'],['&#128229;','What <b>information</b> was used?'],['&#127918;','What was given more <b>weight?</b>'],['&#9989;','Does the <b>recommendation fit?</b>']].map(c=>`
          <div class="check-item show" style="padding:5px 12px;gap:8px"><span class="check-ico" style="font-size:var(--f-body)">${c[0]}</span><p style="font-size:var(--f-micro)">${c[1]}</p></div>`).join('')}
      </div>
      <div class="prompt-block rv dly3">
        <label for="exitReflect" style="font-size:var(--f-lead)"><span class="starter">Before you trust an AI ranking, what should you check first, and why?</span></label>
        <textarea class="ta" id="exitReflect" rows="3" placeholder="Write your thinking here&hellip;">${escapeHTML(state.exitReflection)}</textarea>
      </div>
      <div class="row rv dly4"><button class="btn btn-primary" id="exitSubmit">Build my scout report &rsaquo;</button></div>
    </div>
  </div></div>`,
  enter:(r)=>{
    after(200,()=>$('.clip-fig',r).classList.add('in'));
    stagger($$('.rv',r),160,300);
    lockNext('Write a short reflection to finish.');
    const ta=$('#exitReflect',r);
    ta.addEventListener('input',()=>{state.exitReflection=ta.value;saveState();});
    $('#exitSubmit',r).addEventListener('click',()=>{
      if(!isMeaningful(ta.value,4)){ lockNext('Write a bit more before continuing.'); announce('Add a little more detail to your reflection.'); return; }
      state.exitReflection=ta.value; saveState(); unlockNext(); gotoScene(current+1);
    });
    if(isMeaningful(state.exitReflection,4)) unlockNext();
  }
});

/* ---- 26. SCOUT REPORT (completion summary + edit links) ---- */
IDX.scoutReport = SCENES.length;
scene({chapter:'Final Review', bg:'board', build:()=>{
  const rows=[
    {label:'Explain', ok:state.explainEvidence.complete, text:state.explainEvidence.answer, idx:IDX.explain},
    {label:'Interpret', ok:state.interpretEvidence.complete, text:state.interpretEvidence.evidence?`Picked ${PLAYERS[state.interpretEvidence.pick]?PLAYERS[state.interpretEvidence.pick].name:''}. Evidence: ${state.interpretEvidence.evidence}`:'', idx:IDX.interpret},
    {label:'Compare', ok:state.compareEvidence.complete, text:state.compareEvidence.mayaWhy, idx:IDX.compare},
    {label:'Evaluate', ok:state.evaluateEvidence.complete, text:state.evaluateEvidence.note && state.evaluateEvidence.decision ? `Checked: ${state.evaluateEvidence.note}. Decision: ${state.evaluateEvidence.decision}.` : '', idx:IDX.evaluate},
  ];
  return `<div class="scene-inner"><div class="stack-c" style="gap:4px;margin-bottom:6px"><div class="eyebrow rv">Self-check</div>
    <h2 class="title rv dly1" tabindex="-1">YOUR SCOUT REPORT</h2></div>
  <div class="report-grid">
    <div class="report-card rv dly2">
      <div class="report-q"><div class="rq-lbl">Before I trust the ranking&hellip;</div>
        <div class="rq-ans">${state.exitReflection?escapeHTML(state.exitReflection):'<span style="opacity:.6">(You left this blank. Go back and jot a thought now.)</span>'}</div></div>
    </div>
    <div class="stack">
      <p class="lead rv dly3" style="color:var(--ink)">Your objective evidence:</p>
      <div class="checklist" id="checklist">
        ${rows.map((row,i)=>`<div class="check-item show" style="align-items:center;justify-content:space-between;gap:10px">
          <div style="display:flex;gap:12px;align-items:flex-start;min-width:0">
            <span class="check-ico" style="color:${row.ok?'var(--lime)':'var(--ink-mute)'}">${row.ok?'&#9989;':'&#9888;&#65039;'}</span>
            <p><b>${row.label}:</b> ${row.text?escapeHTML(String(row.text)).slice(0,70):'<span style="opacity:.6">not finished yet</span>'}</p>

      <p class="body rv" style="color:var(--ink-soft);font-size:var(--f-ui)">Use Edit to revisit and strengthen any answer.</p>
    </div>
  </div></div>`;
},
  enter:(r)=>{
    $('.eyebrow',r).classList.add('show');stagger($$('.rv',r).filter(n=>!n.classList.contains('eyebrow')),180,250);
    $$('[data-jump]',r).forEach(b=>b.addEventListener('click',()=>gotoScene(+b.dataset.jump)));
  }
});

/* ---- 27. BADGE REVEAL (evidence-gated) ---- */
scene({chapter:'Final Review', bg:'lab', build:()=>{

    <div class="badge-rays" id="badgeRays"></div>
    <div class="badge-core">
      <img class="badge-img" id="badgeImg" src="${A('assets/selection-strategist-badge.png')}" alt="Selection Strategist badge">
      <div class="stack-c" style="gap:6px">

        <p class="lead kin" id="bAward" style="color:#C7D6EC">Awarded to</p>

  enter:(r)=>{
    const jumpBtns=$$('[data-jump]',r);

    after(200,()=>$('#badgeRays',r).classList.add('on'));
    const stg=$('.badge-scene',r);const cols=['#28B7C9','#F0954E','#7E8FEE','#AFD645','#EF7A6B'];
    if(!reducedMotion){
      for(let i=0;i<16;i++){const p=document.createElement('div');p.className='badge-converge';
        p.style.background=cols[i%cols.length];const ang=i/16*Math.PI*2;const dist=40;
        p.style.left=`calc(50% + ${Math.cos(ang)*dist}vmin)`;p.style.top=`calc(50% + ${Math.sin(ang)*dist}vmin)`;

    after(2800,()=>$('#bOrg',r).classList.add('show'));
    announce('Badge unlocked: Selection Strategist.');
  }
});

/* small helper used by Compare Mode boards */
function miniPhotoImg(key){
  return `<img src="${PLAYERS[key].img}" alt="">`;
}

/* ============================================================
   RANKING LAB BUILDER (shared by Ranking Lab & Mini-Check 3)
   ============================================================ */
const PRIO_DEFS=[
  {k:'speed',label:'Speed',ico:'&#9889;',color:'var(--c-speed)'},
  {k:'shooting',label:'Shooting',ico:'&#127919;',color:'var(--c-shoot)'},
  {k:'teamwork',label:'Teamwork',ico:'&#129309;',color:'var(--c-team)'},
];

function buildRankingLab(root,opts){
  const ids=opts.ids||{radar:'labRadar',rank:'labRank',prios:'labPrios',budget:'labBudget',budgetTxt:'labBudgetTxt'};
  const weights={...opts.prio};
  let radarKey=opts.radarKey;
  const radarEl=$('#'+ids.radar,root), rankEl=$('#'+ids.rank,root),
        prioEl=$('#'+ids.prios,root), budgetEl=$('#'+ids.budget,root), budgetTxt=$('#'+ids.budgetTxt,root);

  const drawR=()=>{radarEl.innerHTML=radarSVG([{key:radarKey,stroke:PLAYERS[radarKey].accent,fill:PLAYERS[radarKey].accent+'40'}],{size:300,showLabels:true});
    $$('.radar-poly',radarEl).forEach(p=>p.classList.add('drawn'));$$('.radar-dot',radarEl).forEach(d=>d.classList.add('drawn'));};
  const total=()=>PRIO_DEFS.reduce((s,d)=>s+weights[d.k],0);
  const drawBudget=()=>{const left=BUDGET-total();budgetEl.innerHTML=Array.from({length:BUDGET},(_,i)=>`<span class="bd ${i<total()?'on':''}"></span>`).join('');
    budgetTxt.textContent=`${left} left`;};
  const drawPrios=()=>{
    prioEl.innerHTML=PRIO_DEFS.map(d=>`
      <div class="prio-ctrl">
        <div class="prio-head"><span class="prio-name"><span class="prio-dot" style="background:${d.color}"></span>${d.ico} ${d.label}</span>
          <span class="prio-pips">${Array.from({length:BUDGET},(_,i)=>`<span class="pip ${i<weights[d.k]?'on':''}" style="--pc:${d.color}"></span>`).join('')}</span></div>
        <div class="prio-btns"><button type="button" data-k="${d.k}" data-op="-1" aria-label="Decrease ${d.label} weight" ${weights[d.k]<=0||total()<=1?'disabled':''}>&minus;</button>
          <button type="button" data-k="${d.k}" data-op="1" aria-label="Increase ${d.label} weight" ${total()>=BUDGET||weights[d.k]>=BUDGET?'disabled':''}>+</button></div>
      </div>`).join('');
    $$('.prio-btns button',prioEl).forEach(b=>b.addEventListener('click',()=>{
      const k=b.dataset.k,op=+b.dataset.op;
      if(op<0&&weights[k]>0&&total()>1)weights[k]--;
      if(op>0&&total()<BUDGET&&weights[k]<BUDGET)weights[k]++;
      update(false);
    }));
  };
  const update=(first)=>{
    drawPrios();drawBudget();
    renderRanking(rankEl,opts.rankKeys,weights,{firstAnim:first,highlight:opts.radarKey});
    if(opts.onChange)opts.onChange(weights);
  };
  drawR();update(true);
}

/* renderRanking with FLIP */
function renderRanking(container,pkeys,weights,{firstAnim=false}={}){
  const order=ranked(pkeys,weights);
  const existing={};
  $$('.rank-row',container).forEach(row=>existing[row.dataset.key]=row);
  const firstRects={};
  Object.values(existing).forEach(row=>firstRects[row.dataset.key]=row.getBoundingClientRect());

  order.forEach(x=>{
    if(!existing[x.k]){
      const p=PLAYERS[x.k];
      const row=h(`<div class="rank-row" data-key="${x.k}" style="--accent:${p.accent}">
        <div class="rank-pos"></div>
        <div class="rank-face"><img src="${p.img}" alt=""></div>
        <div class="rank-info"><div class="rank-name">${p.name}</div><div class="rank-tag">${p.tag}</div></div>
        <div class="rank-fit"><div class="rank-fit-num">0</div><div class="rank-fit-lbl">Fit</div></div>
      </div>`);
      container.appendChild(row);existing[x.k]=row;
      if(!firstAnim){row.style.opacity='0';}
    }
  });
  order.forEach((x,i)=>{
    const row=existing[x.k];container.appendChild(row);
    row.querySelector('.rank-pos').textContent='#'+(i+1);
    row.classList.toggle('top',i===0);
    const fitNum=Math.round(x.f);
    const numEl=row.querySelector('.rank-fit-num');
    const cur=parseInt(numEl.textContent)||0;
    animateNum(numEl,cur,fitNum);
  });
  if(!firstAnim && !reducedMotion){
    order.forEach(x=>{
      const row=existing[x.k];row.style.opacity='1';
      const last=row.getBoundingClientRect();const fr=firstRects[x.k];
      if(fr){const dy=fr.top-last.top;
        if(Math.abs(dy)>1){row.style.transform=`translateY(${dy}px)`;row.style.transition='none';
          requestAnimationFrame(()=>{row.style.transition='transform .6s var(--e-out)';row.style.transform='';});}
      }
    });
  }else if(!firstAnim){
    order.forEach(x=>{ existing[x.k].style.opacity='1'; });
  }
}

/* ============================================================
   ENGINE
   ============================================================ */
let current=0;
const stage=$('#stage');

function buildScene(i){
  const s=SCENES[i];
  const el=document.createElement('div');
  el.className='scene';el.dataset.bg=s.bg;el.dataset.idx=i;
  el.innerHTML=s.build();
  return el;
}

let locked=false, lockMsg='';
function lockNext(msg){locked=true;lockMsg=msg||'';updateNav();}
function unlockNext(){locked=false;lockMsg='';updateNav();}

function gotoScene(i){
  if(i<0||i>=SCENES.length)return;
  clearTimers();locked=false;lockMsg='';
  const old=$('.scene.active',stage);
  if(old){old.classList.remove('active');old.remove();}
  $$('.confetti',stage).forEach(c=>c.remove());
  current=i;
  const el=buildScene(i);
  stage.appendChild(el);
  void el.offsetWidth;
  el.classList.add('active');
  const heading = el.querySelector('h1,h2,h3,[tabindex="-1"]');
  if(heading){ if(!heading.hasAttribute('tabindex')) heading.setAttribute('tabindex','-1'); heading.focus({preventScroll:true}); }
  const s=SCENES[i];
  if(s.enter)s.enter(el);
  /* safety net: guarantee no .rv/.kin/.kin-big element is ever left stuck
     invisible because a scene's own stagger() call missed it */
  after(3500,()=>{ $$('.rv,.kin,.kin-big',el).forEach(n=>n.classList.add('show')); });
  updateNav();updateChip();
  saveState();
}

function updateNav(){
  $('#prevBtn').disabled=current===0;
  const next=$('#nextBtn');
  next.disabled=locked||current===SCENES.length-1;
  next.classList.toggle('pulse',!locked&&current<SCENES.length-1&&current>=3);
  next.setAttribute('aria-describedby','nextHint');
  if(current===SCENES.length-1){next.textContent='Done';}
  else{next.textContent='Next ›';}
  $('#progRead').textContent=`${current+1} / ${SCENES.length}`;
  const hint=$('#nextHint');
  if(hint){
    if(locked && lockMsg){ hint.textContent=lockMsg; hint.classList.remove('hidden'); }
    else{ hint.textContent=''; hint.classList.add('hidden'); }
  }
}

function updateChip(){
  const chip=$('#idchip');
  if(state.name && current>=3){
    chip.style.display='flex';
    $('#idName').textContent=state.name;
    $('#idInitial').textContent=(state.name[0]||'R').toUpperCase();
    const active=$('.scene.active',stage);
    chip.classList.toggle('on-lab',active&&active.dataset.bg==='lab');
  }else{chip.style.display='none';}
}

/* nav wiring */
$('#nextBtn').addEventListener('click',()=>{if(!$('#nextBtn').disabled)gotoScene(current+1);});
$('#prevBtn').addEventListener('click',()=>gotoScene(current-1));
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t && t.closest && t.closest('button,a,input,textarea,select,[role="slider"],[contenteditable="true"]'))return;
  if(e.key==='ArrowRight'&&!$('#nextBtn').disabled)gotoScene(current+1);
  if(e.key==='ArrowLeft'&&current>0)gotoScene(current-1);
});
stage.addEventListener('click',e=>{const b=e.target.closest('[data-next]');if(b&&!$('#nextBtn').disabled)gotoScene(current+1);});

/* font size */
let fsIdx=2;const FS=[.82,.9,1,1.12,1.24];
function applyFS(){document.documentElement.style.setProperty('--fsm',FS[fsIdx]);document.body.classList.toggle('fs-max',fsIdx===FS.length-1);}
$('#fsUp').addEventListener('click',()=>{fsIdx=Math.min(FS.length-1,fsIdx+1);applyFS();});
$('#fsDown').addEventListener('click',()=>{fsIdx=Math.max(0,fsIdx-1);applyFS();});
$('#fsReset').addEventListener('click',()=>{fsIdx=2;applyFS();});

/* reset */
$('#resetBtn').addEventListener('click',()=>{
  if(confirm('Reset this session? This clears your name, picks, and notes and starts over from the beginning.')){
    Object.assign(state, freshState());
    try{localStorage.removeItem(STORE_KEY);}catch(e){}
    $('#idchip').style.display='none';
    gotoScene(0);
  }
});

/* boot */
const restoredIdx = restoreState();
applyFS();
gotoScene(Math.min(Math.max(restoredIdx,0),SCENES.length-1));

</script>
