<!DOCTYPE html>
<html lang="en">
<head>
<!-- Standalone build: local JS and image assets embedded as Base64/data URIs. -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>How Would an AI Pick a Team? · Grade 8 · Module 5 · Session 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FAIR PLAY REVIEW BOARD — SESSION 2
   "How Would an AI Pick a Team?"
   CSS is the single source of truth. Tokens → components → scenes.
   ============================================================ */

/* ---------- RESET ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
img{display:block;max-width:100%}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--peri);outline-offset:3px}

/* ---------- TOKENS ---------- */
:root{
  /* palette — warm light foundation + deep game panels */
  --cream:#FBF6EC;
  --cream-2:#F4EADA;
  --cream-3:#EADCC6;
  --paper:#FFFDF8;
  --ink:#17233A;
  --ink-soft:#425068;
  --ink-mute:#7A879C;

  --navy:#0C1B30;
  --navy-2:#12294A;
  --navy-3:#1C3A63;
  --navy-line:#2E507F;

  --teal:#178A9B;
  --teal-bright:#28B7C9;
  --teal-deep:#0E5C68;

  --apricot:#F0954E;
  --apricot-soft:#F8B87E;
  --peri:#7E8FEE;
  --peri-soft:#A9B4F4;
  --lime:#AFD645;
  --lime-soft:#C9E877;
  --rose:#EF7A6B;
  --gold:#F2C14E;

  /* attribute colors (5 axes) */
  --c-speed:#F0954E;
  --c-shoot:#EF7A6B;
  --c-pass:#7E8FEE;
  --c-def:#28B7C9;
  --c-team:#AFD645;

  /* surfaces / depth */
  --shadow-sm:0 2px 10px rgba(20,30,55,.10);
  --shadow-md:0 12px 32px rgba(20,30,55,.16);
  --shadow-lg:0 26px 60px rgba(12,20,40,.30);
  --shadow-card:0 18px 40px rgba(12,22,46,.22);
  --glow-teal:0 0 40px rgba(40,183,201,.45);
  --glow-gold:0 0 46px rgba(242,193,78,.55);

  --r-s:12px; --r-m:20px; --r-l:30px; --r-xl:42px;

  /* motion */
  --e-out:cubic-bezier(.22,.9,.28,1);
  --e-soft:cubic-bezier(.4,.14,.2,1);
  --e-spring:cubic-bezier(.34,1.4,.5,1);

  /* type scale (multiplied by user font control) */
  --fsm:1;
  --f-display:calc(clamp(46px,6.8vw,102px) * var(--fsm));
  --f-chapter:calc(clamp(40px,5.4vw,82px) * var(--fsm));
  --f-title:calc(clamp(28px,3.5vw,58px) * var(--fsm));
  --f-quest:calc(clamp(25px,2.9vw,48px) * var(--fsm));
  --f-lead:calc(clamp(21px,2vw,33px) * var(--fsm));
  --f-body:calc(clamp(18px,1.62vw,28px) * var(--fsm));
  --f-ui:calc(clamp(16px,1.28vw,23px) * var(--fsm));
  --f-micro:calc(clamp(13px,.98vw,16px) * var(--fsm));

  --stage-pad:clamp(18px,3vw,54px);
  --footer-h:clamp(58px,7.2vh,82px);
}

/* ---------- BASE ---------- */
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  background:var(--navy);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp,.font-disp{font-family:'Sora','Inter',sans-serif;}

#app{
  position:fixed;inset:0;
  display:grid;
  grid-template-rows:1fr var(--footer-h);
  background:var(--cream);
}

/* ---------- STAGE ---------- */
#stage{
  position:relative;
  overflow:hidden;
  background:var(--cream);
}
.scene{
  position:absolute;inset:0;
  display:none;
  padding:var(--stage-pad);
  padding-bottom:calc(var(--stage-pad) * .6);
}
.scene.active{display:grid;}
.scene-inner{
  width:100%;height:100%;
  max-width:1560px;margin:0 auto;
  display:grid;
  place-content:center;
  align-content:center;
  gap:clamp(14px,2.2vh,30px);
  position:relative;
}

/* scene background variants */
.scene[data-bg="cream"]{background:radial-gradient(120% 120% at 50% 0%,var(--cream) 0%,var(--cream-2) 78%,var(--cream-3) 100%);}
.scene[data-bg="lab"]{background:var(--navy);}
.scene[data-bg="learn"]{background:radial-gradient(130% 120% at 20% 0%,var(--paper) 0%,var(--cream) 55%,var(--cream-2) 100%);}
.scene[data-bg="board"]{background:radial-gradient(120% 120% at 50% 15%,#FFFDF8 0%,var(--cream) 60%,var(--cream-3) 100%);}

/* ---------- TYPOGRAPHY UTILS ---------- */
.eyebrow{
  font-family:'Sora';font-weight:700;letter-spacing:.28em;text-transform:uppercase;
  font-size:var(--f-ui);color:var(--teal-deep);
}
.scene[data-bg="lab"] .eyebrow{color:var(--teal-bright);}
.display{font-size:var(--f-display);font-weight:800;line-height:.98;letter-spacing:-.02em;}
.chapter{font-size:var(--f-chapter);font-weight:800;line-height:1.0;letter-spacing:-.015em;}
.title{font-size:var(--f-title);font-weight:700;line-height:1.05;letter-spacing:-.01em;}
.quest{font-size:var(--f-quest);font-weight:700;line-height:1.12;}
.lead{font-size:var(--f-lead);font-weight:500;line-height:1.32;color:var(--ink-soft);}
.body{font-size:var(--f-body);font-weight:400;line-height:1.5;color:var(--ink-soft);}
.ui{font-size:var(--f-ui);}
.center{text-align:center}
.ink-invert{color:var(--cream);}
.scene[data-bg="lab"] .lead{color:#C7D6EC;}
.scene[data-bg="lab"] .body{color:#B7C6DE;}
.grad-teal{background:linear-gradient(100deg,var(--teal),var(--teal-bright));-webkit-background-clip:text;background-clip:text;color:transparent;}
.grad-apri{background:linear-gradient(100deg,var(--apricot),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;}
.grad-gold{background:linear-gradient(100deg,var(--gold),var(--apricot));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hl{color:var(--teal);}
.hl-a{color:var(--apricot);}

/* ---------- FOOTER / CHROME ---------- */
#footer{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:0 clamp(14px,2vw,30px);
  background:linear-gradient(180deg,#FFFFFF,#FBF4E7);
  border-top:2px solid var(--cream-3);
  z-index:40;
  box-shadow:0 -6px 24px rgba(20,30,55,.06);
}
.footer-left{display:flex;align-items:center;gap:14px;justify-self:start;}
.logo-chip{
  background:#fff;border-radius:14px;padding:8px 14px;
  box-shadow:var(--shadow-sm);display:flex;align-items:center;
  height:calc(var(--footer-h) - 22px);
}
.logo-chip img{height:100%;width:auto;object-fit:contain;}
.reset-btn{
  font-family:'Sora';font-weight:600;font-size:var(--f-micro);
  color:var(--ink-mute);letter-spacing:.06em;text-transform:uppercase;
  padding:6px 10px;border-radius:10px;transition:.2s;
}
.reset-btn:hover{color:var(--rose);background:rgba(239,122,107,.1);}

.footer-nav{display:flex;align-items:center;gap:clamp(10px,1.4vw,20px);justify-self:center;}
.progress-col{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:66px;}
.nav-btn{
  font-family:'Sora';font-weight:700;font-size:var(--f-ui);
  display:flex;align-items:center;gap:8px;
  padding:clamp(9px,1.1vh,14px) clamp(18px,1.9vw,32px);
  border-radius:999px;transition:transform .18s var(--e-out),box-shadow .2s,background .2s,opacity .2s;
}
.nav-btn.prev{background:var(--cream-2);color:var(--ink-soft);box-shadow:var(--shadow-sm);}
.nav-btn.prev:hover{background:var(--cream-3);transform:translateX(-3px);}
.nav-btn.next{background:linear-gradient(120deg,var(--teal),var(--teal-bright));color:#fff;box-shadow:0 8px 22px rgba(23,138,155,.4);}
.nav-btn.next:hover{transform:translateX(3px);box-shadow:0 12px 30px rgba(23,138,155,.55);}
.nav-btn:disabled{opacity:.32;cursor:not-allowed;transform:none!important;}
.nav-btn.pulse{animation:navpulse 1.6s var(--e-out) infinite;}
@keyframes navpulse{0%,100%{box-shadow:0 8px 22px rgba(23,138,155,.4)}50%{box-shadow:0 8px 30px rgba(40,183,201,.75)}}
.progress-read{font-family:'Sora';font-weight:600;font-size:var(--f-micro);color:var(--ink-mute);min-width:66px;text-align:center;letter-spacing:.04em;}

.footer-right{display:flex;align-items:center;gap:clamp(10px,1.4vw,18px);justify-self:end;}
.copyright{font-size:var(--f-micro);color:var(--ink-mute);letter-spacing:.02em;white-space:nowrap;}
.fs-controls{display:flex;align-items:center;gap:4px;background:var(--cream-2);border-radius:12px;padding:4px;}
.fs-controls button{
  font-family:'Sora';font-weight:700;width:clamp(26px,2.4vw,36px);height:clamp(26px,2.4vw,36px);
  border-radius:9px;color:var(--ink-soft);transition:.16s;display:grid;place-items:center;
}
.fs-controls button:hover{background:#fff;color:var(--teal);}
.fs-controls .fs-a{font-size:calc(var(--f-micro) + 6px);}
.fs-controls .fs-b{font-size:calc(var(--f-micro) + 1px);}

/* identity chip (persistent, top-right of stage) */
#idchip{
  position:absolute;top:clamp(12px,1.8vh,22px);right:clamp(14px,1.8vw,26px);
  display:none;align-items:center;gap:10px;z-index:35;
  background:rgba(255,255,255,.82);backdrop-filter:blur(8px);
  border:1.5px solid var(--cream-3);border-radius:999px;
  padding:6px 14px 6px 6px;box-shadow:var(--shadow-sm);
  animation:chipIn .6s var(--e-spring) both;
}
#idchip.on-lab{background:rgba(18,41,74,.7);border-color:var(--navy-line);}
#idchip.on-lab .idchip-name{color:#fff;}
#idchip.on-lab .idchip-role{color:var(--teal-bright);}
@keyframes chipIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
.idchip-badge{width:clamp(30px,3vw,42px);height:clamp(30px,3vw,42px);border-radius:50%;
  background:conic-gradient(from 210deg,var(--teal),var(--peri),var(--apricot),var(--lime),var(--teal));
  display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.2);}
.idchip-badge span{font-family:'Sora';font-weight:800;color:#fff;font-size:var(--f-ui);}
.idchip-txt{display:flex;flex-direction:column;line-height:1.05;}
.idchip-name{font-family:'Sora';font-weight:700;font-size:var(--f-ui);color:var(--ink);}
.idchip-role{font-size:var(--f-micro);color:var(--teal-deep);font-weight:600;letter-spacing:.05em;}

/* ---------- BUTTONS / GENERAL ---------- */
.btn{
  font-family:'Sora';font-weight:700;font-size:var(--f-ui);
  padding:clamp(12px,1.5vh,18px) clamp(24px,2.4vw,40px);
  border-radius:999px;transition:transform .18s var(--e-out),box-shadow .2s,background .2s;
  display:inline-flex;align-items:center;gap:10px;
}
.btn-primary{background:linear-gradient(120deg,var(--teal),var(--teal-bright));color:#fff;box-shadow:0 10px 26px rgba(23,138,155,.4);}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(40,183,201,.55);}
.btn-apri{background:linear-gradient(120deg,var(--apricot),var(--rose));color:#fff;box-shadow:0 10px 26px rgba(240,149,78,.42);}
.btn-apri:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(239,122,107,.55);}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.35);}
.btn-ghost:hover{background:rgba(255,255,255,.2);}
.btn-lg{font-size:var(--f-lead);padding:clamp(14px,1.9vh,22px) clamp(30px,3vw,52px);}

/* pill / tag */
.pill{display:inline-flex;align-items:center;gap:8px;font-family:'Sora';font-weight:700;
  font-size:var(--f-ui);padding:8px 18px;border-radius:999px;letter-spacing:.02em;}
.pill-teal{background:rgba(40,183,201,.16);color:var(--teal-deep);}
.pill-apri{background:rgba(240,149,78,.18);color:#B4611F;}
.pill-navy{background:var(--navy-2);color:var(--teal-bright);}

/* ---------- KINETIC LINES ---------- */
.kin{opacity:0;transform:translateY(26px);}
.kin.show{animation:kinIn .7s var(--e-out) forwards;}
@keyframes kinIn{to{opacity:1;transform:none}}
.kin-big{opacity:0;transform:translateY(30px) scale(.96);}
.kin-big.show{animation:kinBig .8s var(--e-spring) forwards;}
@keyframes kinBig{to{opacity:1;transform:none}}
.arrow-down{font-size:var(--f-lead);color:var(--apricot);opacity:0;transform:scale(.4);}
.arrow-down.show{animation:kinBig .5s var(--e-spring) forwards;}

/* reveal helper */
.rv{opacity:0;transform:translateY(22px);}
.rv.show{animation:kinIn .7s var(--e-out) forwards;}
.dly1{animation-delay:.12s}.dly2{animation-delay:.26s}.dly3{animation-delay:.42s}
.dly4{animation-delay:.6s}.dly5{animation-delay:.8s}.dly6{animation-delay:1s}.dly7{animation-delay:1.25s}.dly8{animation-delay:1.5s}

/* ============================================================
   COVER (Scene 1)
   ============================================================ */
.cover-wrap{position:absolute;inset:0;overflow:hidden;}
.cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;}
.cover-crowd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;mix-blend-mode:screen;}
.cover-scrim{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(8,18,34,.55) 0%,rgba(8,18,34,.12) 32%,rgba(8,18,34,.25) 66%,rgba(8,18,34,.86) 100%);}
.cover-vig{position:absolute;inset:0;box-shadow:inset 0 0 240px rgba(6,12,26,.7);}
.cover-content{position:absolute;left:0;right:0;bottom:clamp(26px,6vh,70px);
  display:grid;justify-items:center;gap:clamp(14px,2.4vh,28px);text-align:center;padding:0 6vw;z-index:5;}
.cover-meta{position:absolute;top:clamp(20px,4vh,46px);left:0;right:0;text-align:center;
  opacity:0;letter-spacing:.36em;color:#fff;font-family:'Sora';font-weight:700;z-index:6;
  font-size:var(--f-ui);text-transform:uppercase;text-shadow:0 2px 16px rgba(0,0,0,.6);}
.cover-meta b{color:var(--teal-bright);font-weight:700;}
.cover-title{color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.5);position:relative;}
.cover-title .cl{display:block;overflow:hidden;}
.cover-title .cl span{display:block;transform:translateY(110%);}
.cover-ball{position:absolute;width:clamp(90px,13vw,190px);bottom:clamp(-20px,-2vh,-10px);right:clamp(4%,7vw,12%);
  opacity:0;filter:drop-shadow(0 20px 30px rgba(0,0,0,.5));z-index:6;}
.cover-cta{margin-top:8px;opacity:0;}
.cover-title-badge{position:absolute;top:clamp(22px,4vh,44px);left:50%;transform:translateX(-50%);
  z-index:6;opacity:0;}

/* ============================================================
   OBJECTIVES (Scene 2) — learning path
   ============================================================ */
.path{display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.8vw,40px);flex-wrap:nowrap;width:100%;}
.path-node{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;
  padding:0;flex:0 0 auto;}
.path-verb{font-family:'Sora';font-weight:800;font-size:clamp(22px,2.9vw,50px);letter-spacing:-.02em;line-height:1;
  opacity:0;transform:translateY(30px) scale(.9);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:8px;}
.path-verb.show{animation:kinBig .7s var(--e-spring) forwards;}
.pv-explain{color:var(--apricot);}
.pv-interpret{color:var(--teal);}
.pv-compare{color:var(--peri);}
.pv-evaluate{color:#8FB024;}
.path-obj{font-size:var(--f-ui);color:var(--ink-soft);max-width:16ch;text-align:center;opacity:0;font-weight:500;line-height:1.3;}
.path-obj.show{animation:kinIn .6s var(--e-out) forwards;}
.path-arrow{font-size:clamp(20px,2.2vw,40px);color:var(--cream-3);opacity:0;font-family:'Sora';flex-shrink:0;align-self:flex-start;margin-top:clamp(28px,3.4vw,64px);}
.path-arrow.show{animation:kinIn .5s var(--e-out) forwards;}
.obj-num{font-family:'Sora';font-weight:800;font-size:var(--f-micro);color:#fff;
  background:currentColor;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;}
.obj-num span{color:#fff;}
@media (max-width:900px){.path{flex-wrap:wrap;}.path-arrow{display:none;}}

/* ============================================================
   IDENTITY (Scene 3)
   ============================================================ */
.id-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(20px,3vw,60px);align-items:center;width:100%;}
.id-portrait{position:relative;display:grid;place-items:center;}
.id-portrait img{height:min(62vh,520px);width:auto;object-fit:contain;filter:drop-shadow(0 30px 40px rgba(20,30,55,.28));
  transform:translateY(20px) scale(.96);opacity:0;}
.id-portrait.in img{animation:portraitIn .9s var(--e-out) forwards;}
@keyframes portraitIn{to{opacity:1;transform:none}}
.id-glow{position:absolute;bottom:6%;width:70%;height:26%;background:radial-gradient(ellipse,rgba(40,183,201,.4),transparent 70%);filter:blur(24px);z-index:-1;}
.id-panel{display:grid;gap:clamp(14px,2vh,24px);align-content:center;}
.name-field{display:flex;gap:12px;flex-wrap:wrap;}
.name-input{flex:1;min-width:220px;font-family:'Sora';font-weight:600;font-size:var(--f-lead);
  padding:clamp(12px,1.6vh,18px) clamp(18px,2vw,26px);border-radius:16px;border:2.5px solid var(--cream-3);
  background:#fff;color:var(--ink);transition:.2s;box-shadow:var(--shadow-sm);}
.name-input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 4px rgba(40,183,201,.16);}
/* credential card */
.cred{background:linear-gradient(135deg,var(--navy-2),var(--navy-3));border-radius:var(--r-l);
  padding:clamp(18px,2.4vw,30px);color:#fff;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
  border:1.5px solid var(--navy-line);}
.cred::after{content:"";position:absolute;top:-40%;right:-10%;width:60%;height:180%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.14),transparent);transform:rotate(18deg);}
.cred-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cred-seal{width:clamp(42px,4vw,58px);height:clamp(42px,4vw,58px);border-radius:50%;
  background:conic-gradient(from 200deg,var(--teal-bright),var(--peri),var(--lime),var(--teal-bright));
  display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);}
.cred-seal span{font-family:'Sora';font-weight:800;font-size:var(--f-lead);color:#fff;}
.cred-org{font-family:'Sora';font-weight:700;letter-spacing:.14em;font-size:var(--f-micro);color:var(--teal-bright);text-transform:uppercase;}
.cred-name{font-family:'Sora';font-weight:800;font-size:clamp(24px,3vw,44px);margin:6px 0 2px;}
.cred-role{font-size:var(--f-ui);color:var(--peri-soft);font-weight:600;}
.cred-foot{display:flex;justify-content:space-between;margin-top:16px;font-size:var(--f-micro);color:#9FB2CF;letter-spacing:.04em;}

/* ============================================================
   SQUAD LAB shared
   ============================================================ */
.lab-bg{position:absolute;inset:0;overflow:hidden;}
.lab-bg img{width:100%;height:100%;object-fit:cover;object-position:center 60%;filter:saturate(.82) brightness(.8);}
.lab-bg::after{content:"";position:absolute;inset:0;background:
  radial-gradient(95% 85% at 50% 46%,rgba(8,17,32,.46),rgba(8,17,32,.7) 100%),
  linear-gradient(180deg,rgba(8,17,32,.9) 0%,rgba(8,17,32,.64) 32%,rgba(8,17,32,.62) 60%,rgba(8,17,32,.94) 100%);}
.lab-veil{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent,rgba(8,17,32,.45));}
.scene[data-bg="lab"] .ink-invert,
.scene[data-bg="lab"] .lead,
.scene[data-bg="lab"] .title,
.scene[data-bg="lab"] .quest,
.scene[data-bg="lab"] .display{text-shadow:0 2px 16px rgba(0,0,0,.6);}
/* gradient (clipped) text must not carry a shadow — it shows through as a black halo */
.grad-teal,.grad-apri,.grad-gold{text-shadow:none;}
.lab-content{position:relative;z-index:3;width:100%;height:100%;display:grid;place-content:center;align-content:center;gap:clamp(12px,2vh,26px);}

/* player card system (original rounded game cards) */
.card-row{display:flex;justify-content:center;gap:clamp(10px,1.3vw,22px);flex-wrap:nowrap;}
.pcard{
  --accent:var(--teal-bright);
  position:relative;width:clamp(128px,12.2vw,196px);border-radius:26px;
  background:linear-gradient(170deg,#FFFDF8,#F3E8D5);
  box-shadow:var(--shadow-card);overflow:hidden;
  cursor:pointer;transition:transform .3s var(--e-out),box-shadow .3s,filter .3s;
  border:2.5px solid rgba(255,255,255,.7);
  transform:translateY(40px) scale(.9);opacity:0;
  display:flex;flex-direction:column;
}
.pcard.dealt{animation:dealIn .7s var(--e-spring) forwards;}
@keyframes dealIn{to{opacity:1;transform:none}}
.pcard:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 30px 56px rgba(12,22,46,.34);}
.pcard::before{content:"";position:absolute;top:0;left:0;right:0;height:46%;
  background:linear-gradient(160deg,var(--accent),transparent);opacity:.9;}
.pcard-top{position:relative;height:clamp(120px,15vh,168px);overflow:hidden;
  background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--accent) 60%,#fff),transparent);}
.pcard-img{position:absolute;top:-4%;left:50%;transform:translateX(-50%);width:118%;height:auto;max-width:none;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.22));}
.pcard-role{position:absolute;top:10px;left:10px;font-family:'Sora';font-weight:800;font-size:var(--f-micro);
  color:#fff;background:rgba(12,27,48,.55);backdrop-filter:blur(4px);padding:4px 10px;border-radius:999px;letter-spacing:.08em;text-transform:uppercase;z-index:2;}
.pcard-body{padding:clamp(10px,1.3vh,16px) clamp(12px,1vw,18px) clamp(12px,1.5vh,18px);background:linear-gradient(180deg,#FFFDF8,#F5EBD9);position:relative;z-index:2;flex:1;}
.pcard-name{font-family:'Sora';font-weight:800;font-size:clamp(19px,1.6vw,27px);color:var(--ink);line-height:1;}
.pcard-tag{font-size:var(--f-micro);font-weight:700;color:var(--teal-deep);letter-spacing:.06em;margin-top:3px;text-transform:uppercase;}
.pcard-cues{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
.cue{font-size:var(--f-micro);font-weight:600;color:var(--ink-soft);background:rgba(126,143,238,.14);
  padding:3px 9px;border-radius:8px;}
.pcard .pick-badge{position:absolute;inset:0;background:rgba(23,138,155,.28);backdrop-filter:blur(1px);
  display:grid;place-items:center;opacity:0;transition:.25s;z-index:5;pointer-events:none;}
.pcard .pick-badge span{font-family:'Sora';font-weight:800;font-size:clamp(30px,3vw,48px);color:#fff;
  background:var(--teal);width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.35);transform:scale(.5);transition:.3s var(--e-spring);}
.pcard.picked{border-color:var(--teal-bright);box-shadow:0 0 0 4px rgba(40,183,201,.5),var(--shadow-card);}
.pcard.picked .pick-badge{opacity:1;}
.pcard.picked .pick-badge span{transform:scale(1);}
.pcard.dim{filter:grayscale(.4) brightness(.9);opacity:.6;}

/* mini pitch */
.pitch{position:relative;border-radius:24px;background:
  linear-gradient(160deg,#2A915A 0%,#1C7A47 45%,#155F38 100%);border:4px solid rgba(255,255,255,.35);
  box-shadow:inset 0 0 80px rgba(0,0,0,.45),var(--shadow-lg);overflow:hidden;}
.pitch::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 8%,rgba(0,0,0,.05) 8% 16%);}
.pitch::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(0,0,0,.35);pointer-events:none;}
.pitch-line{position:absolute;border:2px solid rgba(255,255,255,.4);}
.pitch-slot{position:absolute;display:grid;place-items:center;transform:translate(-50%,-50%);}
.pitch-token{width:clamp(78px,8vw,120px);opacity:0;transform:scale(.4) translateY(30px);}
.pitch-token.in{animation:tokenIn .6s var(--e-spring) forwards;}
@keyframes tokenIn{to{opacity:1;transform:scale(1) translateY(0)}}
.pitch-token img{width:100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4));}
.pitch-token .pt-name{font-family:'Sora';font-weight:800;color:#fff;font-size:var(--f-ui);text-align:center;
  text-shadow:0 2px 6px rgba(0,0,0,.5);margin-top:2px;}

/* ============================================================
   LEARNING CARDS / CHAINS
   ============================================================ */
.l-card{background:var(--paper);border-radius:var(--r-l);padding:clamp(18px,2.4vw,34px);
  box-shadow:var(--shadow-md);border:2px solid var(--cream-3);}
.chain{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,18px);}
.chain-node{background:#fff;border-radius:var(--r-m);padding:clamp(12px,1.6vh,20px) clamp(22px,2.5vw,40px);
  box-shadow:var(--shadow-sm);border:2px solid var(--cream-3);text-align:center;min-width:clamp(220px,26vw,360px);}
.chain-label{font-family:'Sora';font-weight:700;letter-spacing:.16em;font-size:var(--f-micro);color:var(--teal-deep);text-transform:uppercase;}
.chain-val{font-family:'Sora';font-weight:800;font-size:var(--f-title);color:var(--ink);line-height:1.05;margin-top:2px;}
.chain-multi{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.chain-arrow{color:var(--apricot);font-size:var(--f-lead);}

/* 4 perspectives */
.persp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(12px,1.6vw,22px);max-width:640px;}
.persp{background:#fff;border-radius:var(--r-m);padding:clamp(14px,1.8vh,22px);box-shadow:var(--shadow-sm);
  border-left:6px solid var(--accent,var(--teal));display:flex;gap:14px;align-items:flex-start;opacity:0;transform:translateX(-16px);}
.persp.show{animation:perspIn .6s var(--e-out) forwards;}
@keyframes perspIn{to{opacity:1;transform:none}}
.persp-ico{font-size:clamp(26px,2.6vw,40px);line-height:1;}
.persp h4{font-family:'Sora';font-weight:800;font-size:var(--f-body);color:var(--ink);}
.persp p{font-size:var(--f-ui);color:var(--ink-soft);margin-top:2px;line-height:1.3;}

/* ============================================================
   RADAR / COMPARE
   ============================================================ */
.compare-stage{display:grid;grid-template-columns:1fr 1fr;gap:clamp(34px,5vw,92px);align-items:center;width:100%;}
.radar-box{position:relative;display:grid;place-items:center;padding:0 clamp(30px,3vw,50px);}
.radar-svg{width:100%;height:auto;max-height:56vh;overflow:visible;}
.radar-grid-line{fill:none;stroke:rgba(126,143,238,.28);stroke-width:1.2;}
.radar-spoke{stroke:rgba(126,143,238,.35);stroke-width:1.2;}
.radar-axis-label{font-family:'Sora';font-weight:700;font-size:15px;fill:var(--ink-soft);}
.scene[data-bg="lab"] .radar-axis-label{fill:#CFE0F2;}
.scene[data-bg="lab"] .radar-grid-line{stroke:rgba(120,150,200,.28);}
.scene[data-bg="lab"] .radar-spoke{stroke:rgba(120,150,200,.32);}
.radar-poly{transform-origin:center;transform:scale(0);transition:transform .9s var(--e-out),opacity .6s;opacity:0;}
.radar-poly.drawn{transform:scale(1);opacity:1;}
.radar-dot{opacity:0;transition:opacity .3s;}
.radar-dot.drawn{opacity:1;}

/* stat strips */
.stat-strips{display:grid;gap:clamp(7px,1vh,13px);}
.stat-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;}
.stat-name{font-family:'Sora';font-weight:700;font-size:var(--f-ui);width:clamp(78px,7vw,110px);color:var(--ink);}
.scene[data-bg="lab"] .stat-name{color:#EAF1FA;}
.cmp-legend{margin-bottom:clamp(10px,1.6vh,18px);}
.stat-strips{margin-bottom:2px;}
.stat-track{height:clamp(12px,1.5vh,18px);background:var(--cream-3);border-radius:999px;overflow:hidden;position:relative;}
.scene[data-bg="lab"] .stat-track{background:rgba(255,255,255,.12);}
.stat-fill{height:100%;border-radius:999px;width:0;transition:width .9s var(--e-out);}
.stat-num{font-family:'Sora';font-weight:800;font-size:var(--f-ui);width:2.4em;text-align:right;}
.stat-fill.a-speed{background:linear-gradient(90deg,var(--c-speed),#f7b878);}
.stat-fill.a-shoot{background:linear-gradient(90deg,var(--c-shoot),#f7a99c);}
.stat-fill.a-pass{background:linear-gradient(90deg,var(--c-pass),#b3bdf7);}
.stat-fill.a-def{background:linear-gradient(90deg,var(--c-def),#7fd9e4);}
.stat-fill.a-team{background:linear-gradient(90deg,var(--c-team),#d3ec8f);}

/* legend + player switch */
.cmp-legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px;}
.leg-item{display:flex;align-items:center;gap:9px;font-family:'Sora';font-weight:700;font-size:var(--f-ui);color:var(--ink);}
.scene[data-bg="lab"] .leg-item{color:#FFFFFF;}
.scene[data-bg="lab"] .pin-btn{color:#EAF1FA;background:rgba(40,183,201,.28);}
.leg-swatch{width:18px;height:18px;border-radius:6px;}
.player-switch{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.switch-chip{font-family:'Sora';font-weight:700;font-size:var(--f-ui);padding:8px 16px;border-radius:999px;
  background:#fff;color:var(--ink-soft);box-shadow:var(--shadow-sm);border:2px solid transparent;transition:.18s;}
.scene[data-bg="lab"] .switch-chip{background:rgba(255,255,255,.12);color:#FFFFFF;}
.switch-chip:hover{transform:translateY(-2px);}
.switch-chip.active{border-color:var(--accent2,var(--rose));color:var(--rose);background:rgba(239,122,107,.12);}
.pin-btn{font-family:'Sora';font-weight:700;font-size:var(--f-ui);padding:8px 16px;border-radius:999px;
  background:rgba(40,183,201,.16);color:var(--teal-deep);display:inline-flex;gap:8px;align-items:center;}

/* ============================================================
   PRIORITY / RANKING LAB
   ============================================================ */
.lab-3col{display:grid;grid-template-columns:1.15fr 1.15fr 1fr;gap:clamp(14px,1.8vw,30px);width:100%;align-items:stretch;}
.lab-panel{background:rgba(11,24,45,.82);backdrop-filter:blur(10px);border:1.5px solid var(--navy-line);
  border-radius:var(--r-l);padding:clamp(12px,1.4vw,20px);display:flex;flex-direction:column;gap:clamp(5px,.8vh,10px);}
.lab-panel h3{font-family:'Sora';font-weight:800;font-size:var(--f-body);color:#fff;display:flex;align-items:center;gap:8px;}
.lab-panel .sub{font-size:var(--f-micro);color:#9FB2CF;letter-spacing:.05em;text-transform:uppercase;font-weight:600;}
.lab-panel [id$="Radar"]{display:grid;place-items:center;padding:6px clamp(24px,2.4vw,42px);}
.lab-panel .radar-svg{max-height:min(32vh,250px);}
.lab-panel .radar-axis-label{font-size:13px;}

/* priority control */
.prio-ctrl{background:rgba(255,255,255,.06);border-radius:var(--r-m);padding:clamp(6px,.9vh,12px);border:1.5px solid rgba(255,255,255,.1);}
.prio-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.prio-name{font-family:'Sora';font-weight:800;font-size:var(--f-ui);color:#fff;display:flex;align-items:center;gap:8px;}
.prio-dot{width:14px;height:14px;border-radius:50%;}
.prio-pips{display:flex;gap:5px;}
.pip{width:clamp(14px,1.4vw,20px);height:clamp(14px,1.4vw,20px);border-radius:5px;background:rgba(255,255,255,.16);transition:.25s var(--e-spring);}
.pip.on{background:var(--pc,var(--teal-bright));box-shadow:0 0 12px var(--pc,var(--teal-bright));transform:scale(1.06);}
.prio-btns{display:flex;gap:8px;}
.prio-btns button{width:clamp(30px,3vw,42px);height:clamp(30px,3vw,42px);border-radius:12px;
  background:rgba(255,255,255,.12);color:#fff;font-family:'Sora';font-weight:800;font-size:var(--f-lead);
  display:grid;place-items:center;transition:.15s;}
.prio-btns button:hover:not(:disabled){background:var(--teal);}
.prio-btns button:disabled{opacity:.28;cursor:not-allowed;}
.budget{display:flex;align-items:center;gap:10px;font-family:'Sora';font-weight:800;color:#fff;font-size:var(--f-ui);}
.budget-dots{display:flex;gap:5px;}
.bd{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18);transition:.2s;}
.bd.on{background:var(--gold);box-shadow:0 0 10px var(--gold);}

/* ranking list */
.rank-list{position:relative;display:flex;flex-direction:column;gap:clamp(5px,.75vh,9px);}
.rank-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:clamp(7px,.9vw,14px);align-items:center;
  background:linear-gradient(100deg,#FFFDF8,#F3E8D5);border-radius:15px;padding:clamp(5px,.7vh,9px) clamp(10px,1.1vw,16px);
  box-shadow:var(--shadow-sm);border:2px solid transparent;will-change:transform;}
.rank-row.top{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.4),var(--shadow-md);}
.rank-pos{font-family:'Sora';font-weight:800;font-size:var(--f-quest);color:var(--ink-mute);width:1.5em;text-align:center;line-height:1;}
.rank-row.top .rank-pos{color:var(--gold);}
.rank-face{width:clamp(38px,3.8vw,52px);height:clamp(38px,3.8vw,52px);border-radius:12px;overflow:hidden;position:relative;
  background:radial-gradient(120% 100% at 50% 20%,color-mix(in srgb,var(--accent) 55%,#fff),#EADCC6);flex-shrink:0;}
.rank-face img{position:absolute;top:0;left:50%;transform:translateX(-50%);width:220%;height:auto;max-width:none;}
.rank-info{min-width:0;}
.rank-name{font-family:'Sora';font-weight:800;font-size:var(--f-body);color:var(--ink);line-height:1;}
.rank-tag{font-size:var(--f-micro);color:var(--teal-deep);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.rank-fit{text-align:right;}
.rank-fit-num{font-family:'Sora';font-weight:800;font-size:var(--f-quest);color:var(--teal);line-height:1;transition:color .3s;}
.rank-fit-lbl{font-size:var(--f-micro);color:var(--ink-mute);font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.rank-row.top .rank-fit-num{color:var(--apricot);}
.rank-row.rising{animation:rowGlow 1s var(--e-out);}
@keyframes rowGlow{0%,100%{box-shadow:var(--shadow-sm)}40%{box-shadow:0 0 0 4px rgba(175,214,69,.6),0 12px 30px rgba(175,214,69,.4)}}

/* goal / mission card */
.mission-card{display:flex;align-items:center;gap:clamp(14px,1.8vw,26px);background:rgba(11,24,45,.86);
  border:1.5px solid var(--navy-line);border-radius:var(--r-l);padding:clamp(8px,1.2vh,16px) clamp(18px,2vw,32px);backdrop-filter:blur(8px);box-shadow:var(--shadow-lg);}
.coach-mini{height:clamp(66px,8.5vh,116px);width:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4));flex-shrink:0;}
.mission-card.compact .coach-mini{height:clamp(58px,7vh,92px);}
.mission-card.compact .mbrief{font-size:clamp(19px,2.2vw,34px);}
.mission-card.compact .msub{font-size:var(--f-micro);}
.win-overlay{position:absolute;left:0;right:0;bottom:clamp(10px,2vh,24px);margin:0 auto;width:max-content;z-index:50;
  background:rgba(12,22,46,.92);border:2px solid var(--lime);border-radius:var(--r-m);padding:clamp(10px,1.4vh,18px) clamp(20px,2.4vw,40px);
  text-align:center;box-shadow:var(--glow-gold);backdrop-filter:blur(6px);animation:kinBig .6s var(--e-spring) both;max-width:92vw;}
.mission-txt .mlabel{font-family:'Sora';font-weight:700;letter-spacing:.16em;font-size:var(--f-micro);color:var(--teal-bright);text-transform:uppercase;}
.mission-txt .mbrief{font-family:'Sora';font-weight:800;font-size:var(--f-quest);color:#fff;line-height:1.05;}
.mission-txt .msub{font-size:var(--f-ui);color:#B7C6DE;margin-top:4px;}

/* coach speech (missions in lab) */
.coach-stage{display:flex;align-items:flex-end;gap:clamp(16px,2.4vw,44px);justify-content:center;}
.coach-fig{height:min(60vh,520px);width:auto;filter:drop-shadow(0 24px 34px rgba(0,0,0,.4));
  transform:translateX(-40px);opacity:0;flex-shrink:0;}
.coach-fig.in{animation:coachIn .8s var(--e-out) forwards;}
@keyframes coachIn{to{opacity:1;transform:none}}
.speech{background:#fff;border-radius:28px;padding:clamp(20px,2.6vw,40px);box-shadow:var(--shadow-lg);position:relative;max-width:640px;
  transform:translateY(20px) scale(.94);opacity:0;}
.speech.in{animation:kinBig .7s var(--e-spring) .2s forwards;}
.speech::before{content:"";position:absolute;left:-18px;bottom:60px;border:14px solid transparent;border-right-color:#fff;}

/* ============================================================
   FUNNEL / HUB (Chapter 4)
   ============================================================ */
.world-scene{position:relative;width:100%;height:100%;display:grid;place-content:center;}
.world-bg{position:absolute;inset:0;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-lg);}
.world-bg img{width:100%;height:100%;object-fit:cover;}
.world-bg::after{content:"";position:absolute;inset:0;background:
  radial-gradient(80% 70% at 50% 52%,rgba(6,13,26,.74),rgba(6,13,26,.5) 60%,rgba(6,13,26,.72) 100%),
  linear-gradient(180deg,rgba(8,17,32,.5),rgba(8,17,32,.82));}
.world-scene .ink-invert,.world-scene .lead,.world-scene .quest,.world-scene .title{text-shadow:0 2px 18px rgba(0,0,0,.6);}
.world-scene .pill-navy{background:rgba(8,17,32,.75);}
.funnel-flow{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.4vw,24px);flex-wrap:wrap;}
.flow-step{background:rgba(255,255,255,.92);border-radius:var(--r-m);padding:clamp(12px,1.6vh,20px) clamp(16px,1.8vw,28px);
  text-align:center;box-shadow:var(--shadow-md);opacity:0;transform:translateY(20px) scale(.9);min-width:clamp(120px,13vw,180px);}
.flow-step.show{animation:kinBig .6s var(--e-spring) forwards;}
.flow-step .fs-n{font-family:'Sora';font-weight:800;font-size:var(--f-title);color:var(--teal);line-height:1;}
.flow-step .fs-l{font-family:'Sora';font-weight:700;font-size:var(--f-ui);color:var(--ink);margin-top:3px;}
.flow-arrow{color:var(--gold);font-size:clamp(22px,2.4vw,40px);font-family:'Sora';opacity:0;}
.flow-arrow.show{animation:kinIn .4s var(--e-out) forwards;}
.mrr{display:flex;gap:clamp(10px,1.4vw,22px);justify-content:center;flex-wrap:wrap;}
.mrr-chip{font-family:'Sora';font-weight:800;font-size:var(--f-title);padding:clamp(10px,1.4vh,18px) clamp(20px,2.4vw,38px);
  border-radius:var(--r-m);color:#fff;opacity:0;transform:scale(.7);}
.mrr-chip.show{animation:kinBig .6s var(--e-spring) forwards;}

/* recommendation reveal */
.reco-stack{position:relative;width:clamp(200px,22vw,300px);height:clamp(280px,40vh,420px);margin:0 auto;}
.reco-card{position:absolute;inset:0;border-radius:26px;background:linear-gradient(170deg,#FFFDF8,#F3E8D5);
  box-shadow:var(--shadow-card);border:2.5px solid rgba(255,255,255,.7);overflow:hidden;transition:transform .8s var(--e-out),opacity .8s;}
.reco-winner{position:relative;z-index:10;}

/* ============================================================
   EXIT TICKET / REPORT / BADGE
   ============================================================ */
.exit-grid{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,3vw,50px);align-items:center;width:100%;}
.clip-fig{height:min(66vh,560px);width:auto;filter:drop-shadow(0 26px 36px rgba(20,30,55,.24));
  transform:rotate(-4deg) translateY(16px);opacity:0;}
.clip-fig.in{animation:portraitIn .8s var(--e-out) forwards;}
.exit-form{display:grid;gap:clamp(14px,2vh,24px);}
.prompt-block label{display:block;font-family:'Sora';font-weight:800;font-size:var(--f-quest);color:var(--ink);line-height:1.1;margin-bottom:10px;}
.prompt-block .starter{color:var(--teal);}
.ta{width:100%;font-family:'Inter';font-size:var(--f-body);line-height:1.5;color:var(--ink);
  padding:clamp(12px,1.6vh,18px);border-radius:16px;border:2.5px solid var(--cream-3);background:#fff;resize:none;
  box-shadow:var(--shadow-sm);transition:.2s;}
.ta:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 4px rgba(40,183,201,.14);}

.report-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(20px,2.6vw,44px);width:100%;align-items:start;}
.report-card{background:linear-gradient(160deg,var(--navy-2),var(--navy-3));border-radius:var(--r-l);
  padding:clamp(20px,2.6vw,36px);color:#fff;box-shadow:var(--shadow-lg);border:1.5px solid var(--navy-line);}
.report-q{margin-bottom:20px;}
.report-q .rq-lbl{font-family:'Sora';font-weight:700;letter-spacing:.1em;font-size:var(--f-micro);color:var(--teal-bright);text-transform:uppercase;}
.report-q .rq-ans{font-size:var(--f-body);line-height:1.45;color:#EAF1FA;margin-top:6px;font-style:italic;border-left:3px solid var(--teal-bright);padding-left:14px;}
.checklist{display:grid;gap:clamp(8px,1.2vh,14px);}
.check-item{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;padding:clamp(11px,1.4vh,16px) clamp(14px,1.6vw,20px);
  box-shadow:var(--shadow-sm);opacity:0;transform:translateX(-14px);}
.check-item.show{animation:perspIn .5s var(--e-out) forwards;}
.check-ico{color:var(--lime);font-size:var(--f-lead);line-height:1;flex-shrink:0;filter:saturate(.9) brightness(.85);}
.check-item p{font-size:var(--f-ui);color:var(--ink-soft);font-weight:500;line-height:1.3;}
.check-item b{color:var(--ink);font-weight:700;}

/* badge */
.badge-scene{position:relative;display:grid;place-items:center;width:100%;height:100%;overflow:hidden;}
.badge-rays{position:absolute;width:150vmax;height:150vmax;
  background:conic-gradient(from 0deg,transparent 0 8deg,rgba(242,193,78,.10) 8deg 16deg,transparent 16deg 24deg);
  animation:spin 40s linear infinite;opacity:0;transition:opacity 1s;}
.badge-rays.on{opacity:1;}
@keyframes spin{to{transform:rotate(360deg)}}
.badge-core{position:relative;z-index:3;display:grid;justify-items:center;gap:clamp(12px,2vh,24px);text-align:center;}
.badge-img{width:clamp(200px,26vw,340px);filter:drop-shadow(0 26px 44px rgba(12,20,40,.4));
  transform:scale(.4) rotate(-20deg);opacity:0;}
.badge-img.in{animation:badgePop 1s var(--e-spring) forwards;}
@keyframes badgePop{to{transform:none;opacity:1}}
.badge-img.shine{animation:badgePop 1s var(--e-spring) forwards, badgeShine 2.4s 1s ease-in-out;}
@keyframes badgeShine{0%,100%{filter:drop-shadow(0 26px 44px rgba(12,20,40,.4))}50%{filter:drop-shadow(0 26px 44px rgba(12,20,40,.4)) drop-shadow(0 0 40px rgba(242,193,78,.8))}}
.badge-converge{position:absolute;width:14px;height:14px;border-radius:50%;z-index:2;opacity:0;}

/* discussion banner */
.disc{display:flex;align-items:center;gap:14px;background:rgba(240,149,78,.14);border:2px dashed var(--apricot-soft);
  border-radius:var(--r-m);padding:clamp(12px,1.6vh,18px) clamp(18px,2vw,28px);}
.disc-ico{font-size:clamp(24px,2.6vw,38px);}
.disc p{font-size:var(--f-ui);color:#9A5A22;font-weight:600;}
.disc b{color:#7A3F12;}
.scene[data-bg="lab"] .disc{background:rgba(240,149,78,.2);}
.scene[data-bg="lab"] .disc p{color:#F8D7B4;}
.scene[data-bg="lab"] .disc b{color:#fff;}

/* think-pair-share steps */
.tps{display:flex;gap:clamp(12px,1.8vw,30px);justify-content:center;flex-wrap:wrap;}
.tps-step{background:#fff;border-radius:var(--r-m);padding:clamp(14px,1.8vh,24px);box-shadow:var(--shadow-sm);
  display:grid;justify-items:center;gap:8px;min-width:clamp(140px,15vw,200px);text-align:center;
  border-top:5px solid var(--accent,var(--teal));}
.tps-ico{font-size:clamp(30px,3vw,48px);}
.tps-t{font-family:'Sora';font-weight:800;font-size:var(--f-body);color:var(--ink);}
.tps-d{font-size:var(--f-ui);color:var(--ink-soft);}

/* toast / success */
.toast{position:absolute;top:clamp(14px,3vh,30px);left:50%;transform:translateX(-50%) translateY(-24px);
  background:var(--lime);color:#33470D;font-family:'Sora';font-weight:800;font-size:var(--f-body);
  padding:12px 26px;border-radius:999px;box-shadow:var(--shadow-md);opacity:0;z-index:60;pointer-events:none;}
.toast.show{animation:toastIn 2.6s var(--e-out);}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(-24px)}12%,80%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-24px)}}

/* confetti */
.confetti{position:absolute;width:12px;height:16px;top:-20px;z-index:55;opacity:0;pointer-events:none;}
.confetti.go{animation:fall 2.4s ease-in forwards;}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(90vh) rotate(720deg)}}

/* helper note */
.sim-note{font-size:var(--f-micro);color:var(--ink-mute);font-style:italic;display:flex;gap:8px;align-items:center;
  background:rgba(126,143,238,.1);padding:8px 14px;border-radius:10px;max-width:60ch;}
.scene[data-bg="lab"] .sim-note{color:#9FB2CF;background:rgba(126,143,238,.14);}

/* generic layout helpers */
.stack{display:grid;gap:clamp(10px,1.6vh,20px);}
.stack-c{display:grid;gap:clamp(10px,1.6vh,20px);justify-items:center;text-align:center;}
.row{display:flex;gap:clamp(10px,1.4vw,20px);align-items:center;}
.row-c{display:flex;gap:clamp(10px,1.4vw,20px);align-items:center;justify-content:center;flex-wrap:wrap;}
.wrap{flex-wrap:wrap}
.mt{margin-top:clamp(8px,1.6vh,20px);}
.mw{max-width:min(92vw,1100px);}
.mw-s{max-width:min(90vw,760px);}
.hidden{display:none!important;}

/* morph role scene */
.morph-stage{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(16px,2.4vw,44px);align-items:center;width:100%;}
.morph-player{position:relative;display:grid;place-items:center;}
.morph-player img{height:min(48vh,410px);width:auto;max-width:100%;filter:drop-shadow(0 24px 30px rgba(20,30,55,.25));}
.role-col{display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px);justify-content:center;}
.role-badge{font-family:'Sora';font-weight:800;font-size:var(--f-title);padding:clamp(8px,1.2vh,14px) clamp(20px,2vw,34px);
  border-radius:16px;color:#fff;box-shadow:var(--shadow-md);white-space:nowrap;letter-spacing:.02em;
  transform:scale(.8);}
.role-badge.pop{transform:scale(1);}
.role-attacker{background:linear-gradient(120deg,var(--apricot),var(--rose));}
.role-defender{background:linear-gradient(120deg,var(--teal),var(--teal-bright));}
.hi-list{display:grid;gap:10px;}
.hi-item{font-family:'Sora';font-weight:700;font-size:var(--f-lead);padding:10px 22px;border-radius:14px;
  background:#fff;box-shadow:var(--shadow-sm);opacity:0;transform:translateX(14px);}
.hi-item.show{animation:perspIn .5s var(--e-out) forwards;}

/* numbers vs judgement */
.nj-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.2vw,36px);width:100%;}
.nj-card{border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow-md);position:relative;background:#fff;}
.nj-img{width:100%;height:clamp(150px,26vh,280px);object-fit:cover;}
.nj-body{padding:clamp(14px,1.8vh,24px);}
.nj-tag{font-family:'Sora';font-weight:800;letter-spacing:.08em;font-size:var(--f-ui);text-transform:uppercase;}
.nj-tag.meas{color:var(--apricot);}
.nj-tag.judge{color:var(--peri);}
.nj-body h4{font-family:'Sora';font-weight:800;font-size:var(--f-body);color:var(--ink);margin:2px 0;}
.nj-body p{font-size:var(--f-ui);color:var(--ink-soft);line-height:1.35;}

@media (max-width:920px){
  .lab-3col{grid-template-columns:1fr;}
  .compare-stage,.id-grid,.exit-grid,.report-grid,.morph-stage{grid-template-columns:1fr;}
}
/* height-aware safety */
@media (max-height:800px){
  .mission-card.compact{padding:5px clamp(16px,2vw,28px);}
  .mission-card.compact .coach-mini{height:clamp(50px,6.2vh,78px);}
  .mission-card.compact .mbrief{font-size:clamp(18px,2vw,28px);}
  .mission-card.compact .msub{font-size:var(--f-micro);}
  .rank-list{gap:clamp(4px,.5vh,7px);}
  .rank-row{padding:clamp(3px,.45vh,7px) clamp(10px,1.1vw,16px);}
  .rank-face{width:clamp(34px,3.4vw,46px);height:clamp(34px,3.4vw,46px);}
  .lab-panel [id$="Radar"]{padding:2px clamp(20px,2vw,36px);}
}
@media (max-height:760px){
  :root{--footer-h:clamp(52px,7vh,68px);}
  .persp p,.nj-body p{line-height:1.25;}
  .rank-list{gap:clamp(4px,.6vh,8px);}
}

/* ============================================================
   SCREEN-READER-ONLY / LIVE REGIONS
   ============================================================ */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.status-line{font-size:var(--f-ui);font-weight:600;color:var(--ink-soft);}
.scene[data-bg="lab"] .status-line{color:#C7D6EC;}

#nextHint{max-width:min(30vw,220px);color:var(--ink-mute);font-family:'Sora';font-weight:600;
  font-size:calc(var(--f-micro) - 2px);line-height:1.2;text-align:center;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

/* ============================================================
   INSTRUCTION PATTERN CHIP (every scene shows one clear direction)
   ============================================================ */
.instr{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-m);
  padding:clamp(10px,1.4vh,16px) clamp(16px,1.8vw,26px);max-width:min(92vw,760px);
  background:rgba(40,183,201,.12);border:2px solid rgba(40,183,201,.35);}
.instr b{color:var(--ink);}
.instr p{font-size:var(--f-ui);color:var(--ink-soft);font-weight:500;line-height:1.35;margin:0;}
.instr .instr-tag{font-family:'Sora';font-weight:800;font-size:var(--f-micro);letter-spacing:.08em;
  text-transform:uppercase;flex-shrink:0;padding:5px 10px;border-radius:8px;white-space:nowrap;}
.instr.act{background:rgba(240,149,78,.14);border-color:rgba(240,149,78,.4);}
.instr.act .instr-tag{background:var(--apricot);color:#fff;}
.instr.obs{background:rgba(40,183,201,.12);border-color:rgba(40,183,201,.35);}
.instr.obs .instr-tag{background:var(--teal);color:#fff;}
.instr.dis{background:rgba(126,143,238,.14);border-color:rgba(126,143,238,.4);}
.instr.dis .instr-tag{background:var(--peri);color:#fff;}
.instr.ref{background:rgba(175,214,69,.16);border-color:rgba(175,214,69,.42);}
.instr.ref .instr-tag{background:#7A9426;color:#fff;}
.scene[data-bg="lab"] .instr{background:rgba(255,255,255,.08);}
.scene[data-bg="lab"] .instr p{color:#DCE8F5;}

/* ============================================================
   COMPARE MODE — 3-BOARD LAYOUT
   ============================================================ */
.cmp3-grid{display:grid;grid-template-columns:minmax(180px,1fr) minmax(360px,1.6fr) minmax(180px,1fr);
  gap:clamp(14px,2vw,30px);align-items:stretch;width:100%;}
.cmp-side{background:rgba(16,32,58,.72);border:1.5px solid var(--navy-line);border-radius:var(--r-l);
  padding:clamp(14px,1.8vh,24px) clamp(12px,1.4vw,20px);display:flex;flex-direction:column;align-items:center;
  gap:8px;text-align:center;box-shadow:var(--shadow-card);position:relative;overflow:hidden;}
.cmp-side::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 2px var(--accent,transparent);opacity:.55;}
.cmp-photo{width:clamp(96px,10vw,140px);height:clamp(120px,12.5vw,175px);border-radius:18px;overflow:hidden;
  position:relative;background:radial-gradient(120% 100% at 50% 15%,color-mix(in srgb,var(--accent,#28B7C9) 55%,#12294A),#0C1B30);
  box-shadow:0 10px 26px rgba(0,0,0,.35);flex-shrink:0;}
.cmp-photo img{position:absolute;top:0;left:50%;transform:translateX(-50%);width:108%;height:auto;max-width:none;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));transition:opacity .5s var(--e-out);}
.cmp-pname{font-family:'Sora';font-weight:800;font-size:var(--f-title);color:#fff;line-height:1;}
.cmp-prole{font-size:var(--f-ui);color:var(--teal-bright);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.cmp-ptag{font-size:var(--f-micro);color:#9FB2CF;font-weight:600;}
.cmp-pin{font-family:'Sora';font-weight:700;font-size:var(--f-micro);background:rgba(242,193,78,.2);
  color:var(--gold);padding:4px 12px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase;}
.cmp-center{display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center;min-height:0;}
.cmp-summary{font-size:var(--f-micro);color:#EAF1FA;font-weight:600;text-align:center;max-width:52ch;
  background:rgba(255,255,255,.07);border-radius:12px;padding:4px 12px;line-height:1.25;min-height:1.8em;}
.cmp-switcher{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
.cmp-center .radar-svg{width:100%;height:auto;max-width:min(23vh,185px);max-height:min(23vh,185px);}

/* skill comparison table — A and B aligned side-by-side, one row per stat */
.skillrows{display:grid;gap:clamp(2px,.4vh,5px);width:100%;margin-top:2px;}
.skillrow{display:grid;grid-template-columns:minmax(64px,auto) 1fr 1fr clamp(2.6em,4vw,3.4em);
  gap:6px 8px;align-items:center;min-width:0;}
.skillrow.head{padding-bottom:2px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:2px;}
.sk-head{font-family:'Sora';font-weight:800;font-size:var(--f-micro);color:#9FB2CF;text-align:center;
  text-transform:uppercase;letter-spacing:.04em;}
.skillrow .sk-label{font-family:'Sora';font-weight:700;font-size:var(--f-micro);color:#EAF1FA;min-width:0;
  overflow-wrap:break-word;text-align:left;}
.sk-val{display:grid;grid-template-columns:8px 1fr clamp(2em,3vw,2.6em);align-items:center;gap:5px;min-width:0;}
.sk-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sk-bar-mini{height:clamp(5px,.7vh,8px);background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;min-width:0;}
.sk-fill{display:block;height:100%;border-radius:999px;width:0;transition:width .6s var(--e-out);}
.sk-num{font-family:'Sora';font-weight:800;font-size:var(--f-ui);text-align:right;white-space:nowrap;color:#fff;}
.sk-delta{font-family:'Sora';font-weight:800;font-size:var(--f-micro);text-align:center;white-space:nowrap;
  border-radius:8px;padding:1px 6px;justify-self:end;}
.sk-delta.pos{background:rgba(175,214,69,.22);color:#C9E877;}
.sk-delta.neg{background:rgba(239,122,107,.22);color:#F7B4A9;}
.sk-delta.even{background:rgba(255,255,255,.12);color:#B7C6DE;}

/* ============================================================
   TRADE-OFF GLOSSARY BOARD
   ============================================================ */
.glossary-board{position:relative;display:grid;grid-template-columns:1fr 1fr;border-radius:var(--r-l);
  overflow:hidden;box-shadow:var(--shadow-lg);border:2px solid rgba(255,255,255,.14);max-width:min(92vw,760px);}
.gloss-half{padding:clamp(20px,2.8vw,40px) clamp(18px,2.4vw,32px);position:relative;}
.gloss-half.a{background:linear-gradient(150deg,rgba(240,149,78,.32),rgba(240,149,78,.08));}
.gloss-half.b{background:linear-gradient(210deg,rgba(126,143,238,.32),rgba(40,183,201,.1));}
.gloss-mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.25);
  transform:translateX(-50%);z-index:2;}
.gloss-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  width:clamp(46px,4.4vw,62px);height:clamp(46px,4.4vw,62px);border-radius:50%;
  background:radial-gradient(circle,#fff,rgba(255,255,255,.85));display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(0,0,0,.35);font-size:clamp(20px,2vw,28px);}
.gloss-tag{grid-column:1/-1;text-align:center;padding:clamp(12px,1.6vh,18px) 0 4px;
  font-family:'Sora';font-weight:800;letter-spacing:.24em;font-size:var(--f-micro);color:var(--gold);
  text-transform:uppercase;}
.gloss-title{grid-column:1/-1;text-align:center;font-family:'Sora';font-weight:800;
  font-size:var(--f-chapter);color:#fff;line-height:1;position:relative;padding-bottom:8px;}
.gloss-title span{position:relative;display:inline-block;}
.gloss-title span::after{content:"";position:absolute;left:0;bottom:-4px;height:.14em;width:0;
  background:linear-gradient(90deg,var(--apricot),var(--peri));border-radius:4px;}
.gloss-title span.wipe::after{animation:glossWipe 1s var(--e-out) .2s forwards;}
@keyframes glossWipe{to{width:100%}}
.gloss-def{grid-column:1/-1;text-align:center;font-size:var(--f-lead);color:#EAF1FA;font-weight:500;
  line-height:1.4;padding:6px clamp(18px,2.4vw,32px) 0;max-width:56ch;margin:0 auto;}
.gloss-example{grid-column:1/-1;text-align:center;font-size:var(--f-ui);color:#B7C6DE;font-style:italic;
  padding:8px clamp(18px,2.4vw,32px) clamp(16px,2vh,22px);}

/* ============================================================
   MOTION SAFETY
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;}
  .badge-rays{display:none;}
}
body.reduced-motion .kin,body.reduced-motion .kin-big,body.reduced-motion .rv,
body.reduced-motion .path-verb,body.reduced-motion .path-obj,body.reduced-motion .path-arrow,
body.reduced-motion .persp,body.reduced-motion .check-item,body.reduced-motion .flow-step,
body.reduced-motion .flow-arrow,body.reduced-motion .mrr-chip,body.reduced-motion .hi-item{
  opacity:1!important;transform:none!important;}
body.reduced-motion .radar-poly,body.reduced-motion .radar-dot{opacity:1!important;transform:none!important;}
body.reduced-motion .pcard,body.reduced-motion .pitch-token,body.reduced-motion .badge-img,
body.reduced-motion .id-portrait img,body.reduced-motion .clip-fig,body.reduced-motion .coach-fig{
  opacity:1!important;transform:none!important;}

@media (max-width:1000px){
  .cmp3-grid{grid-template-columns:1fr;}
  .glossary-board{grid-template-columns:1fr;}
  .gloss-mid{display:none;}
}

/* ============================================================
   MAX TEXT SIZE — compress decorative spacing, never the text
   ============================================================ */
body.fs-max{--stage-pad:clamp(8px,1.2vw,20px);}
body.fs-max .scene-inner,body.fs-max .lab-content{gap:5px!important;}
body.fs-max .mission-card{padding:4px clamp(10px,1.4vw,20px)!important;gap:8px!important;}
body.fs-max .coach-mini{height:clamp(36px,5vh,54px)!important;}
body.fs-max .mission-card.compact .coach-mini{height:clamp(30px,4vh,44px)!important;}
body.fs-max .l-card{padding:8px 14px!important;}
body.fs-max .card-row{gap:6px!important;}
body.fs-max .pcard-top{height:clamp(70px,9vh,110px)!important;}
body.fs-max .pcard-body{padding:5px 8px 7px!important;}
body.fs-max .pcard-cues{margin-top:3px!important;gap:3px!important;}
body.fs-max .persp-grid{gap:6px!important;}
body.fs-max .persp{padding:6px 10px!important;gap:8px!important;}
body.fs-max .chain{gap:3px!important;}
body.fs-max .chain-node{padding:5px 12px!important;}
body.fs-max .lab-3col{gap:6px!important;}
body.fs-max .lab-panel{padding:8px!important;gap:3px!important;}
body.fs-max .cmp3-grid{gap:6px!important;}
body.fs-max .cmp-side{padding:6px!important;gap:3px!important;}
body.fs-max .cmp-photo{width:clamp(64px,7vw,96px)!important;height:clamp(80px,8.5vw,120px)!important;}
body.fs-max .instr{padding:5px 10px!important;gap:6px!important;}
body.fs-max .tps{gap:5px!important;}
body.fs-max .tps-step{padding:6px!important;}
body.fs-max .stat-strips,body.fs-max .skillrows{gap:2px!important;}
body.fs-max .rank-list{gap:3px!important;}
body.fs-max .rank-row{padding:3px clamp(8px,1vw,14px)!important;}
body.fs-max .prio-ctrl{padding:4px 8px!important;}
body.fs-max .exit-grid,body.fs-max .report-grid{gap:10px!important;}
body.fs-max .checklist{gap:3px!important;}
body.fs-max .check-item{padding:4px 10px!important;}
body.fs-max .clip-fig,body.fs-max .id-portrait img{height:min(30vh,260px)!important;}
body.fs-max .radar-box{padding:0!important;}
body.fs-max .radar-svg{max-height:30vh!important;}
body.fs-max .compare-stage{gap:12px!important;}
body.fs-max .compare-stage .stack{gap:4px!important;}
body.fs-max .glossary-board .gloss-half{padding:8px clamp(10px,1.4vw,20px)!important;}
body.fs-max .gloss-tag{padding:6px 0 2px!important;}
body.fs-max .gloss-def{padding-top:2px!important;}
body.fs-max .gloss-example{padding-bottom:6px!important;}
body.fs-max .title,body.fs-max .quest{line-height:1.02!important;}
body.fs-max .switch-chip,body.fs-max .pin-btn{padding:4px 10px!important;}
body.fs-max .player-switch,body.fs-max .cmp-switcher{gap:4px!important;}
body.fs-max .lab-panel h3{margin-bottom:0!important;}

/* ---------- PLAYER DATA (fictional, clear trade-offs) ---------- */
const ATTRS = [
  {k:'speed',    label:'Speed',    cls:'a-speed', color:'var(--c-speed)'},
  {k:'shooting', label:'Shooting', cls:'a-shoot', color:'var(--c-shoot)'},

];

const PLAYERS = {
  maya:  {name:'Maya',  role:'Midfielder', tag:'Playmaker', accent:'#28B7C9', img:A('assets/maya-player.png'),
          cues:['Great vision','Team-first'], speed:62, shooting:55, passing:90, defending:48, teamwork:92},
  amara: {name:'Amara', role:'Forward',    tag:'Speedster', accent:'#EF7A6B', img:A('assets/amara-player.png'),
          cues:['Lightning pace','Loves to score'], speed:94, shooting:88, passing:60, defending:45, teamwork:58},
  leo:   {name:'Leo',   role:'Midfielder', tag:'Connector', accent:'#7E8FEE', img:A('assets/leo-player.png'),
          cues:['Links play','Reliable'], speed:66, shooting:62, passing:85, defending:70, teamwork:84},
  zane:  {name:'Zane',  role:'Winger',     tag:'All-Action',accent:'#F0954E', img:A('assets/zane-player.png'),
          cues:['Quick and strong','Attacking'], speed:82, shooting:80, passing:72, defending:68, teamwork:70},

          cues:['Rock solid','Reads danger'], speed:58, shooting:50, passing:66, defending:92, teamwork:88},
  sofia: {name:'Sofia', role:'Utility',    tag:'All-Rounder',accent:'#8F9C3A', img:A('assets/sofia-player.png'),
          cues:['Does everything','Steady'], speed:74, shooting:72, passing:74, defending:70, teamwork:74},
};
const PKEYS = ['maya','amara','leo','zane','niko','sofia'];
const DEFAULT_WEIGHTS = {speed:2, shooting:2, teamwork:2};
const BUDGET = 6;

/* ---------- ACCESSIBILITY: reduced motion ---------- */
const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reducedMotion) document.body.classList.add('reduced-motion');

/* ---------- STATE ---------- */
const STORE_KEY = 'g8m5s2_session_v2';

function freshState(){
  return {
    name:'', returning:false,
    team1:null, team1Reason:'',
    team2:null, team2Decision:'', team2Reason:'',
    missionCompareNote:'',
    explainEvidence:{answer:'', complete:false},
    interpretEvidence:{pick:'', evidence:'', complete:false},
    compareEvidence:{labChanged:false, labObservation:'', mayaTop2:false, mayaPriority:'', mayaWhy:'', complete:false},
    evaluateEvidence:{note:'', decision:'', reason:'', complete:false},
    labWeights:{...DEFAULT_WEIGHTS},
    recommendationRun:false, recommendationResult:'',
    reviewDecision:'',
    exitReflection:'',
    badgeEligible:false,
  };
}
const state = freshState();

function isMeaningful(text, minWords){
  minWords = minWords || 3;
  if(!text) return false;
  const words = String(text).trim().split(/\s+/).filter(Boolean);
  return words.length >= minWords;
}

function computeBadgeEligible(){
  return !!(state.explainEvidence.complete && state.interpretEvidence.complete &&
    state.compareEvidence.complete && state.evaluateEvidence.complete &&
    isMeaningful(state.exitReflection, 4));
}

function saveState(){
  try{
    state.badgeEligible = computeBadgeEligible();
    localStorage.setItem(STORE_KEY, JSON.stringify({v:2, current, state}));
  }catch(e){/* storage unavailable — session still works in-memory */}
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || parsed.v!==2 || typeof parsed.state!=='object' || !parsed.state) return null;
    return parsed;
  }catch(e){ return null; }
}

function restoreState(){
  const found = loadState();
  if(!found) return 0;
  const s = found.state;
  const fresh = freshState();
  try{
    if(typeof s.name==='string') fresh.name = s.name;
    fresh.returning = !!s.returning;
    if(Array.isArray(s.team1) && s.team1.every(k=>PLAYERS[k])) fresh.team1 = s.team1;
    if(typeof s.team1Reason==='string') fresh.team1Reason = s.team1Reason;
    if(Array.isArray(s.team2) && s.team2.every(k=>PLAYERS[k])) fresh.team2 = s.team2;
    if(typeof s.team2Decision==='string') fresh.team2Decision = s.team2Decision;
    if(typeof s.team2Reason==='string') fresh.team2Reason = s.team2Reason;
    if(typeof s.missionCompareNote==='string') fresh.missionCompareNote = s.missionCompareNote;
    if(s.explainEvidence && typeof s.explainEvidence==='object') fresh.explainEvidence = {answer:String(s.explainEvidence.answer||''), complete:!!s.explainEvidence.complete};
    if(s.interpretEvidence && typeof s.interpretEvidence==='object') fresh.interpretEvidence = {pick:String(s.interpretEvidence.pick||''), evidence:String(s.interpretEvidence.evidence||''), complete:!!s.interpretEvidence.complete};
    if(s.compareEvidence && typeof s.compareEvidence==='object') fresh.compareEvidence = {
      labChanged:!!s.compareEvidence.labChanged, labObservation:String(s.compareEvidence.labObservation||''),
      mayaTop2:!!s.compareEvidence.mayaTop2, mayaPriority:String(s.compareEvidence.mayaPriority||''),
      mayaWhy:String(s.compareEvidence.mayaWhy||''), complete:!!s.compareEvidence.complete};
    if(s.evaluateEvidence && typeof s.evaluateEvidence==='object') fresh.evaluateEvidence = {
      note:String(s.evaluateEvidence.note||''), decision:String(s.evaluateEvidence.decision||''),
      reason:String(s.evaluateEvidence.reason||''), complete:!!s.evaluateEvidence.complete};
    if(s.labWeights && typeof s.labWeights==='object'){
      const w={...DEFAULT_WEIGHTS};
      ['speed','shooting','teamwork'].forEach(k=>{ if(Number.isFinite(s.labWeights[k])) w[k]=Math.max(0,Math.min(BUDGET,s.labWeights[k])); });
      fresh.labWeights = w;
    }
    fresh.recommendationRun = !!s.recommendationRun;
    if(typeof s.recommendationResult==='string') fresh.recommendationResult = s.recommendationResult;
    if(typeof s.reviewDecision==='string') fresh.reviewDecision = s.reviewDecision;
    if(typeof s.exitReflection==='string') fresh.exitReflection = s.exitReflection;
  }catch(e){ return 0; }
  Object.assign(state, fresh);
  return Number.isInteger(found.current) ? found.current : 0;
}

/* ---------- SMALL HELPERS ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let sceneTimers=[];
function after(ms,fn){
  if(reducedMotion){ try{fn();}catch(e){/* ignore */} return null; }
  const t=setTimeout(fn,ms); sceneTimers.push(t); return t;
}
function clearTimers(){sceneTimers.forEach(clearTimeout);sceneTimers=[];}
function stagger(nodes,gap=110,start=80,cls='show'){nodes.forEach((n,i)=>after(start+i*gap,()=>n.classList.add(cls)));}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');}
function announce(msg){const el=$('#liveRegion');if(!el)return;el.textContent='';window.setTimeout(()=>{el.textContent=msg;},30);}
function confettiBurst(n=40){
  if(reducedMotion) return;
  const stg=$('#stage');const cols=['#28B7C9','#F0954E','#7E8FEE','#AFD645','#EF7A6B','#F2C14E'];
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='confetti';
    c.style.left=(10+Math.random()*80)+'%';c.style.background=cols[i%cols.length];
    c.style.animationDelay=(Math.random()*.5)+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';
    stg.appendChild(c);void c.offsetWidth;c.classList.add('go');
    after(3200,()=>c.remove());}
}

/* fit = weighted average over active weight keys; profile is fixed */
function fit(pkey, weights){
  const p=PLAYERS[pkey]; let num=0,den=0;
  for(const k in weights){ num+=p[k]*weights[k]; den+=weights[k]; }
  if(den===0){
    const keys=Object.keys(weights); keys.forEach(k=>num+=p[k]); return num/keys.length;
  }
  return num/den;
}
function ranked(pkeys, weights){
  return [...pkeys].map(k=>({k,f:fit(k,weights)})).sort((a,b)=>b.f-a.f||PKEYS.indexOf(a.k)-PKEYS.indexOf(b.k));
}
function weightsEqual(a,b){ return ['speed','shooting','teamwork'].every(k=>(a[k]||0)===(b[k]||0)); }

/* ---------- RADAR (SVG) — built once, updated in place (no innerHTML rebuild) ---------- */
function radarPoints(key, R, c){
  return ATTRS.map((a,i)=>{
    const ang=(-90+i*72)*Math.PI/180, r=R*PLAYERS[key][a.k]/100;
    return [c+r*Math.cos(ang), c+r*Math.sin(ang)];
  });
}
function radarSVG(series, {size=360, showLabels=true}={}){
  const c=size/2, R=size*0.36;
  let grid='';
  for(let lvl=1;lvl<=4;lvl++){
    const rr=R*lvl/4;
    const poly=ATTRS.map((a,i)=>{const ang=(-90+i*72)*Math.PI/180;return `${c+rr*Math.cos(ang)},${c+rr*Math.sin(ang)}`;}).join(' ');
    grid+=`<polygon class="radar-grid-line" points="${poly}"/>`;
  }
  let spokes='',labels='';
  ATTRS.forEach((a,i)=>{
    const ang=(-90+i*72)*Math.PI/180;
    const x=c+R*Math.cos(ang), y=c+R*Math.sin(ang);
    spokes+=`<line class="radar-spoke" x1="${c}" y1="${c}" x2="${x}" y2="${y}"/>`;
    if(showLabels){
      const lx=c+(R+30)*Math.cos(ang), ly=c+(R+30)*Math.sin(ang);
      const anchor = Math.abs(Math.cos(ang))<0.3?'middle':(Math.cos(ang)>0?'start':'end');
      const dy = Math.sin(ang)>0.3?14:(Math.sin(ang)<-0.3?-6:4);
      labels+=`<text class="radar-axis-label" x="${lx}" y="${ly+dy}" text-anchor="${anchor}">${a.label}</text>`;
    }
  });
  let polys='',dots='';
  series.forEach((s,si)=>{
    const p=radarPoints(s.key,R,c);
    const poly=p.map(q=>`${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(' ');
    polys+=`<polygon class="radar-poly" data-poly="${si}" data-key="${s.key}" data-r="${R}" data-c="${c}" points="${poly}" fill="${s.fill}" stroke="${s.stroke}" stroke-width="3" stroke-linejoin="round"/>`;
    p.forEach((q,pi)=>dots+=`<circle class="radar-dot" data-dot="${si}" data-idx="${pi}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4.5" fill="${s.stroke}"/>`);
  });
  return `<svg class="radar-svg" viewBox="0 0 ${size} ${size}" role="img" aria-label="Player profile radar chart">
    ${grid}${spokes}${labels}${polys}${dots}</svg>`;
}
function drawRadar(root){
  $$('.radar-poly',root).forEach((p,i)=>after(200+i*450,()=>p.classList.add('drawn')));
  $$('.radar-dot',root).forEach(d=>{const i=+d.dataset.dot;after(600+i*450,()=>d.classList.add('drawn'));});
}
/* smoothly morph one series (by index) from its current key to a new key — no innerHTML rebuild */
function morphRadarSeries(svg, seriesIndex, newKey, duration=600){
  const poly = svg.querySelector(`.radar-poly[data-poly="${seriesIndex}"]`);
  if(!poly) return;
  const R=+poly.dataset.r, c=+poly.dataset.c;
  const dots = $$(`.radar-dot[data-dot="${seriesIndex}"]`,svg).sort((a,b)=>+a.dataset.idx-+b.dataset.idx);
  const oldPts = poly.getAttribute('points').trim().split(' ').map(pair=>pair.split(',').map(Number));
  const newPts = radarPoints(newKey,R,c);
  poly.dataset.key = newKey;
  if(reducedMotion){
    poly.setAttribute('points', newPts.map(q=>`${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(' '));
    dots.forEach((d,i)=>{ d.setAttribute('cx',newPts[i][0].toFixed(1)); d.setAttribute('cy',newPts[i][1].toFixed(1)); });
    return;
  }
  const t0 = performance.now();
  const ease = p => 1-Math.pow(1-p,3);
  function step(t){
    const p = Math.min(1,(t-t0)/duration);
    const e = ease(p);
    const cur = oldPts.map((op,i)=>[op[0]+(newPts[i][0]-op[0])*e, op[1]+(newPts[i][1]-op[1])*e]);
    poly.setAttribute('points', cur.map(q=>`${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(' '));
    dots.forEach((d,i)=>{ d.setAttribute('cx',cur[i][0].toFixed(1)); d.setAttribute('cy',cur[i][1].toFixed(1)); });
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- SKILL ROWS (stacked, overlap-safe) for Compare Mode ---------- */
function deltaChipHTML(keyA, keyB, attrKey){
  const d = PLAYERS[keyB][attrKey] - PLAYERS[keyA][attrKey];
  const cls = d>0 ? 'pos' : (d<0 ? 'neg' : 'even');
  const txt = d>0 ? `+${d}` : `${d}`;
  return `<span class="sk-delta ${cls}" data-delta="${keyB}|${attrKey}">${txt}</span>`;
}
function skillValHTML(key,attrKey){
  return `<div class="sk-val">
    <span class="sk-dot" style="background:${PLAYERS[key].accent}"></span>
    <span class="sk-bar-mini"><span class="sk-fill" data-k="${key}" data-a="${attrKey}" style="width:0;background:${PLAYERS[key].accent}"></span></span>
    <span class="sk-num" data-num="${key}" data-a="${attrKey}">0</span>
  </div>`;
}
function skillRowsHTML(keyA, keyB){
  return `<div class="skillrows">
    <div class="skillrow head"><span></span><span class="sk-head">${PLAYERS[keyA].name}</span><span class="sk-head">${PLAYERS[keyB].name}</span><span></span></div>
    ${ATTRS.map(a=>`
    <div class="skillrow">
      <span class="sk-label">${a.label}</span>
      ${skillValHTML(keyA,a.k)}
      ${skillValHTML(keyB,a.k)}
      ${deltaChipHTML(keyA,keyB,a.k)}
    </div>`).join('')}</div>`;
}
function animateSkillRows(root, reset){
  $$('.sk-fill',root).forEach((f)=>{
    const k=f.dataset.k,a=f.dataset.a, target=PLAYERS[k][a];
    if(reset) f.style.width='0';
    requestAnimationFrame(()=>{ f.style.width=target+'%'; });
  });
  $$('.sk-num',root).forEach(n=>{
    const k=n.dataset.num,a=n.dataset.a, target=PLAYERS[k][a];
    const cur = reset?0:(parseInt(n.textContent)||0);
    animateNum(n,cur,target);
  });
}
function computeCompareSummary(a,b){
  const pa=PLAYERS[a], pb=PLAYERS[b];
  const aWins=[], bWins=[];
  ATTRS.forEach(attr=>{
    if(pa[attr.k]>pb[attr.k]) aWins.push(attr.label);
    else if(pb[attr.k]>pa[attr.k]) bWins.push(attr.label);
  });
  const fmt=(list)=>list.length>1 ? list.slice(0,-1).join(', ')+' and '+list.slice(-1) : list[0];
  const parts=[];
  if(aWins.length) parts.push(`${pa.name} is stronger in ${fmt(aWins)}.`);
  if(bWins.length) parts.push(`${pb.name} is stronger in ${fmt(bWins)}.`);
  if(!parts.length) parts.push(`${pa.name} and ${pb.name} are evenly matched here.`);
  return parts.join(' ');
}

    <img src="${p.img}" alt="" style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:108%;max-width:none;height:auto"></div>`;

function animateNum(el,from,to){
  if(reducedMotion){ el.textContent=to; return; }
  const dur=500,t0=performance.now();
  const step=(t)=>{const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(from+(to-from)*p);if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

/* ---- 1. COVER ---- */

        </div>
        <div class="row rv dly4"><button class="btn btn-primary" data-next>Take my seat &rsaquo;</button></div>
      ` : `
        <div class="eyebrow rv">Fair Play Review Board</div>
        <h2 class="title rv dly1" tabindex="-1">JOIN THE <span class="grad-teal">REVIEW BOARD</span></h2>
        <p class="lead rv dly2">Enter your name to create your reviewer badge.</p>
        <div class="name-field rv dly3">
          <label class="sr-only" for="nameInput">Your name</label>
          <input class="name-input" id="nameInput" placeholder="Type your name" maxlength="18" autocomplete="off">
          <button class="btn btn-primary" id="nameGo">Get my badge &rsaquo;</button>
        </div>
        <p class="body rv dly4" style="font-size:var(--f-ui)">You'll make real selection calls today. <button class="btn-ghost" style="color:var(--teal-deep);background:none;border:none;padding:0;text-decoration:underline;font-weight:700" id="skipName">Continue without a name</button></p>
      `}
    </div></div></div>`;
},
  enter:(r)=>{
    after(200,()=>$('#idPort',r).classList.add('in'));
    stagger($$('.rv',r),150,200);
    const input=$('#nameInput',r), go=$('#nameGo',r), skip=$('#skipName',r);
    if(go){
      lockNext();
      const commit=()=>{const v=(input.value||'').trim();if(!v)return;state.name=v;state.returning=true;saveState();updateChip();unlockNext();gotoScene(current+1);};
      go.addEventListener('click',commit);
      input.addEventListener('keydown',e=>{if(e.key==='Enter')commit();});
      input.addEventListener('input',()=>{ if(input.value.trim()) unlockNext(); else lockNext('Type a name, or choose Continue without a name.'); });
      skip.addEventListener('click',()=>{state.returning=true;saveState();unlockNext();gotoScene(current+1);});
      lockNext('Type a name, or choose Continue without a name.');
      after(700,()=>input.focus());
    }

  }
});
