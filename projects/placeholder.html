<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project coming soon</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #f7f8ff;
        background:
          radial-gradient(40% 40% at 20% 20%, rgba(124, 131, 255, 0.45), transparent 70%),
          radial-gradient(40% 40% at 80% 80%, rgba(114, 226, 193, 0.25), transparent 70%),
          #0b1020;
      }
      body[data-kind="other"] {
        background:
          radial-gradient(40% 40% at 20% 20%, rgba(196, 181, 253, 0.45), transparent 70%),
          radial-gradient(40% 40% at 80% 80%, rgba(255, 127, 168, 0.22), transparent 70%),
          #0b1020;
      }
      main { max-width: 34rem; text-align: center; }
      .tile {
        width: 96px; height: 96px; margin: 0 auto 28px; border-radius: 30px;
        display: grid; place-items: center; font-size: 40px;
        background: linear-gradient(160deg, #fff, #e6e9ff);
        box-shadow: inset 0 3px 2px #fff, inset 0 -10px 18px rgba(84,92,170,.25), 0 24px 40px -18px rgba(0,0,0,.7);
        transform: rotate(-6deg);
      }
      .tag {
        display: inline-block; margin-bottom: 18px; padding: 6px 14px; border-radius: 99px;
        font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
        background: rgba(255,255,255,.1);
      }
      h1 { margin: 0 0 14px; font-family: Georgia, "Iowan Old Style", serif; font-weight: 400; font-size: clamp(34px, 6vw, 56px); letter-spacing: -0.03em; line-height: 1.05; }
      p { margin: 0; font-size: 18px; line-height: 1.6; color: rgba(247,248,255,.72); }
    </style>
  </head>
  <body>
    <main>
      <div class="tile" id="icon" aria-hidden="true">✨</div>
      <span class="tag">Placeholder</span>
      <h1>This one’s still in the workshop.</h1>
      <p id="copy">The real interactive project will live here soon. Use Portfolio or press Escape to head back.</p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const kind = params.get("kind") === "other" ? "other" : "corporate";
      const n = Math.max(1, Math.min(8, Number(params.get("n")) || 1)) - 1;
      const icons = {
        corporate: ["📈", "💬", "🦺", "💻", "📋", "🤝", "🧭", "🎤"],
        other: ["⚡", "🎬", "🤖", "🧩", "💡", "🌍", "🎮", "🧠"],
      };
      document.body.dataset.kind = kind;
      document.getElementById("icon").textContent = icons[kind][n];
    </script>
  </body>
</html>
